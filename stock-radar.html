    let coolMap = {};
    try { coolMap = JSON.parse(localStorage.getItem('qr_short_cooldown') || '{}'); } catch (e) {}
    const cutoff = dayStr(new Date(Date.UTC(+today.slice(0, 4), +today.slice(5, 7) - 1, +today.slice(8, 10)) - SHORT_COOLDOWN_DAYS * 86400000));
    /* 自适应白名单：牛市 bull20 / 熊市 bear20 选最优形态 */
    const wl = shortWhitelistFor(state.marketUp);
    /* ★ 量价确认（新增）：11 年 · 8,733 信号实测，加入「量比≥1.2 且 J<80」后
       3 日胜率 48.8%→52.1%、5 日 48.9%→52.3%，均收 0.41%→1.02% / 0.70%→1.02%
       9/12 年跑赢基线（2015 样本少、2023 例外）。覆盖率约 16%，属"精选"而非全市场铺开 */
    const volOK = x => {
      if (isNum(x.volratio) && x.volratio > 0) return x.volratio >= 1.2;  /* 腾讯实时量比（已按分钟归一） */
      const I = x.ind;
      if (!I) return true;
      const v20 = last(I.vol20);
      if (isNum(v20) && v20 > 0) return last(I.v) / v20 >= 1.2;          /* 回落：当日量/20日均量 */
      return true;
    };
    filtered = div.filter(x => {
      const sk = x.short && x.short.setup;
      if (!sk) return false;
      if (wl[sk] === false) return false;
      const prevHit = coolMap[x.code];
      if (prevHit && prevHit >= cutoff) return false;
      if (!(x.short.score >= 50)) return false;
      if (!volOK(x)) return false;
      const J = x.ind ? last(x.ind.J) : NaN;
      if (isFinite(J) && J >= 80) return false;                           /* J>80 超买，次日回落概率高 */
      coolMap[x.code] = today;                                            /* 仅通过的信号才计入冷却期 */
      return true;
    });
    try { localStorage.setItem('qr_short_cooldown', JSON.stringify(coolMap)); } catch (e) {}
    /* 无信号时不放宽条件（旧逻辑会绕过白名单/冷却，把低质量标的混进推荐） */
  }

  /* —— 筹码形态统计 + 筛选（策略页）—— */
  filtered.forEach(x => {
    if (!x.bars || x.bars.length < 60) { x.cyqShape = null; return; }
    try { const ca = cyqAdvice(x); x.cyqShape = ca ? ca.shape : null; } catch (e) { x.cyqShape = null; }
  });
  const shapeCounts = {};
  filtered.forEach(x => { if (x.cyqShape) shapeCounts[x.cyqShape] = (shapeCounts[x.cyqShape] || 0) + 1; });
  if (state.styleFilterShape && Object.keys(shapeCounts).length) {
    filtered = filtered.filter(x => x.cyqShape === state.styleFilterShape);
  }
  const SHAPE_META = {
    bottom:{tone:'#5CD66F',name:'底部密集'}, midconsolidation:{tone:'#8DD68D',name:'中位中继'},
    breakout:{tone:'#4CC9F0',name:'突破蓄势'}, bimodal:{tone:'#FFD166',name:'双峰震荡'},
    scattered:{tone:'#8792A6',name:'筹码发散'}, topdistribute:{tone:'#F59E0B',name:'高位派发'},
    topexit:{tone:'#EF4444',name:'顶部出货'}, breakdown:{tone:'#EF4444',name:'跌破密集'},
    neutral:{tone:'#8792A6',name:'中性整理'}
  };
  const filterChips = Object.keys(SHAPE_META).map(k => {
    const cnt = shapeCounts[k] || 0;
    if (cnt === 0) return '';
    const active = state.styleFilterShape === k;
    const m = SHAPE_META[k];
    return '<span class="chip list-cyq-filter' + (active ? ' on' : '') + '" data-shape="' + k + '" style="color:' + m.tone + ';border-color:' + (active ? m.tone : 'rgba(255,255,255,.1)') + (active ? ';background:' + m.tone + '14;font-weight:600' : '') + '">' + m.name + ' ' + cnt + '</span>';
  }).join('');
  const shapeBar = filterChips
    ? '<div style="display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px">' +
      '<span style="font-size:9.5px;color:var(--muted);padding:2px 0">筹码形态筛选</span>' +
      filterChips +
      '</div>'
    : '';

  const cards = filtered.slice(0, 8);
  const cardCodes = new Set(cards.map(c => c.code));
  const rest = arr.filter(x => !cardCodes.has(x.code));
  const title = state.search ? '搜索结果' : state.ind !== '全部' ? state.ind + ' · 行业筛选' : mode === 'long' ? '今日长线精选' : '今日短线机会';
  const note = (state.search || state.ind !== '全部') ? '共 ' + arr.length + ' 只' : cards.length + ' 只精选 · 同行业最多2只';
  let html = '<div class="sec"><b>' + title + '</b><span>' + note + '</span></div>' + shapeBar;
  if (IS_FILE) {
    html += '<div class="notice">本地直开模式：行情经脚本 JSONP 通道直连东财/腾讯，不依赖服务器与隧道；首次拉取若较慢属正常。</div>';
  }
  if (mode === 'short' && !state.search && state.ind === '全部') {
    const down = state.marketUp === false;
    const gold = state.bearGold === true;
    const tight = state.bearTight === true;
    html += '<div class="notice' + (down || tight ? ' warn' : '') + '">' + (
      gold
      ? '<b>🔥 放量反弹黄金窗口</b>：熊市但大盘放量（≥20 日均 1.1×），11 年回测 5 日胜率 <b>53.2%</b>、均收 <b>+0.77%</b>；叠加量价确认后 5 日 <b>54.0%</b>。形态已切换为「弱势反抽 + 超卖反弹 + 趋势延续」，bearGold 加分生效。'
      : tight
      ? '<b>⚠️ 缩量阴跌预警</b>：熊市且成交量萎缩（<20 日均 0.6×），回测 5 日均 -0.4%。bearTight 降权已生效，轻仓观望等放量信号。'
      : down
      ? '<b>大盘下行（熊市）</b>：熊市白名单「弱势反抽 + 超卖反弹 + 趋势延续 + 逆势强势」。量比≥1.2 且 J<80 的量价确认已生效：11 年实测过滤后 3 日胜率 51.4%、5 日 51.1%（基线 48.1% / 48.5%）。'
      : '<b>大盘多头（牛市）</b>：牛市白名单「放量突破 + 趋势延续」。量价确认后 11 年实测：3 日胜率 <b>53.1%</b>、5 日 <b>53.9%</b>（基线 49.9% / 49.6%），放量突破过滤后 5 日 55.5% 为最强形态。'
    ) + '</div>';
  }
  /* 资金面情绪行：两融杠杆（T+1）+ 涨跌停温度（实时快照） */
  if (!state.search) {
    const bits = [];
    if (state.margin && isNum(state.margin.chg5d)) {
      const mg = state.margin;
      const chg = (mg.chg5d >= 0 ? '+' : '') + mg.chg5d + '%';
      const tag = mg.chg5d >= 0.5 ? ' · 杠杆资金进场' : (mg.chg5d <= -1.5 ? ' · 杠杆撤退' : '');
      bits.push('融资余额 ' + (mg.rzYe >= 10000 ? (mg.rzYe / 10000).toFixed(2) + ' 万亿' : mg.rzYe + ' 亿') + ' · 5日 ' + chg + tag + '（' + mg.date + '）');
    }
    if (state.mktSenti && state.mktSenti.total) {
      const ms = state.mktSenti;
      bits.push('涨停 <b>' + ms.limitUp + '</b> 家 · 跌停 <b>' + ms.limitDown + '</b> 家 · 涨超5% ' + ms.up5 + ' 家');
    }
    if (state.north && state.north.toYi != null) {
      const nb = state.north;
      bits.push('北向成交 ¥' + nb.toYi + ' 亿' + (nb.avg20Yi ? '（20日均 ' + nb.avg20Yi + ' 亿' + (nb.hot ? ' · <b class="up">放量</b>' : '') + '）' : ''));
    }
    if (state.north && state.north.t10date && Object.keys(state.north.top10 || {}).length) {
      bits.push('北向十大活跃（' + state.north.t10date + '）已计入评分 +2');
    }
    if (bits.length) html += '<div class="notice" style="font-size:11px;padding:6px 10px">📊 ' + bits.join(' ｜ ') + '</div>';
  }

  if (mode === 'short' && !filtered.length && !state.search && state.ind === '全部') {
    html += '<div class="empty"><div class="ico">🕐</div><p>今日无符合条件信号</p><p>量比≥1.2 且 J&lt;80 的量价确认过滤后为空。宁缺毋滥，等量能配合再出手。</p></div>' +
      '<div class="disc"><b>风险提示：</b>不构成投资建议。</div>';
    head.innerHTML = html;
    return;
  }
  html += '<div class="list">' + cards.map((x, i) => cardHTML(x, mode, i + 1)).join('') + '</div>';
  if (rest.length) {
    html += '<div class="sec"><b>全部排名</b><span>第 9 – ' + (rest.length + 8) + ' 名 · 共 ' + arr.length + ' 只</span></div>' +
      '<div class="rows">' + rest.map((x, i) => rowHTML(x, mode, i + 9)).join('') + '</div>';
  }
  html += '<div class="disc"><b>风险提示：</b>以上结果由技术面多因子模型自动生成，仅用于量化研究与观察，不构成任何投资建议。指标存在滞后与失效风险，请结合基本面、仓位与止损纪律独立决策。</div>';
  head.innerHTML = html;
  drawSparks();
  /* 策略页筹码形态筛选 chip 事件（用 cloneNode 去重）*/
  document.querySelectorAll('.chip.list-cyq-filter').forEach(el => {
    el.replaceWith(el.cloneNode(true));
  });
  document.querySelectorAll('.chip.list-cyq-filter').forEach(chip => {
    chip.addEventListener('click', () => {
      const k = chip.dataset.shape;
      state.styleFilterShape = state.styleFilterShape === k ? null : k;
      renderList();
    });
  });
}

function renderWatch() {
  /* 先兜底拉取未上榜的自选股（异步，先占位渲染） */
  ensureAllWatch();

  const addBar = '<div id="watchAddWrap" style="position:relative;margin:4px 4px 12px">' +
    '<div style="display:flex;gap:8px;align-items:center;padding:8px 12px;background:rgba(255,255,255,.04);border:1px dashed var(--line);border-radius:10px">' +
    '<span style="color:var(--dim);font-size:12px">➕</span>' +
    '<input id="addWatchInput" placeholder="输入代码或名称（如 sh600519 / 贵州茅台 / 茅台 / 600519）" autocomplete="off" style="flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:13px">' +
    '<button class="btn" id="addWatchBtn" style="padding:4px 12px;font-size:12px">添加</button>' +
    '</div>' +
    '<div id="watchMatchBox" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--bg2,rgba(30,30,40,.98));border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:260px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.3)"></div>' +
  '</div>';

  let healed = false;   /* 是否自动补过锚定价，需回写 localStorage */
  const arr = Array.from(state.watch)
    .map(code => ({ code, x: state.data[code] }))
    .filter(o => o.x && o.x.long && o.x.short)
    .map(o => {
      /* 兜底补锚定：旧版自选升级后 anchorPrice 恒为 null，且已在榜单的股票不会再走 ensureWatchStock，
         这里用最近收盘/现价自动补一次；用户手动清除后（manual=true）不再自动补 */
      let meta = state.watchMeta[o.code];
      if (!meta || (!(isNum(meta.anchorPrice) && meta.anchorPrice > 0) && !meta.manual)) {
        meta = recordWatchMeta(o.code, o.x);
        healed = true;
      }
      const adv = watchAdvice(o.x, meta);
      /* 次日方向概率：复用短线引擎（形态×市场基准 + bearGold/量能/KDJ 调整） */
      let nd = null;
      try { nd = nextDayForecast(o.x, { marketUp: state.marketUp, bearGold: state.bearGold }, o.x.short.setup); } catch (e) {}
      return { ...o, meta, adv, nd };
    });
  const pulling = Array.from(state.watch)
    .map(code => state.data[code])
    .filter(x => x && !x.long && !x.short && x.bars && x.bars.length >= 260);

  if (!arr.length && !pulling.length) {
    $('#list').innerHTML = addBar + '<div class="empty"><div class="ico">★</div><p>自选列表为空</p><p>输入代码添加，或在个股卡片点亮星标即可加入自选并长期跟踪</p></div>';
    bindAddWatch();
    return;
  }

  /* —— verdict 优先级 + 形态补充 —— */
  const verdictRank = { '顺势持有': 0, '继续观察': 1, '观望': 2, '考虑减仓': 3, '建议止损': 4 };
  arr.forEach(o => {
    if (!o.x.bars || o.x.bars.length < 60) { o.cyqShape = null; o.cyqShapeName = null; return; }
    try {
      const ca = cyqAdvice(o.x);
      if (ca) { o.cyqShape = ca.shape; o.cyqShapeName = ca.shapeName; }
      else { o.cyqShape = null; o.cyqShapeName = null; }
    } catch (e) { o.cyqShape = null; o.cyqShapeName = null; }
  });

  /* 筹码形态统计 */
  const SHAPE_META = {
    bottom:           { name: '底部密集',       tone: '#5CD66F', pos: true,  action: '入' },
    midconsolidation: { name: '中位中继',       tone: '#8DD68D', pos: true,  action: '持' },
    breakout:         { name: '突破蓄势',       tone: '#4CC9F0', pos: true,  action: '追' },
    bimodal:          { name: '双峰震荡',       tone: '#FFD166', pos: null,  action: '间' },
    scattered:        { name: '筹码发散',       tone: '#8792A6', pos: false, action: '避' },
    topdistribute:    { name: '高位派发',       tone: '#F59E0B', pos: false, action: '减' },
    topexit:          { name: '顶部出货',       tone: '#EF4444', pos: false, action: '清' },
    breakdown:        { name: '跌破密集',       tone: '#EF4444', pos: false, action: '割' },
    neutral:          { name: '中性整理',       tone: '#8792A6', pos: null,  action: '等' },
  };
  const shapeCounts = {};
  arr.forEach(o => { if (o.cyqShape) shapeCounts[o.cyqShape] = (shapeCounts[o.cyqShape] || 0) + 1; });

  /* verdict + 形态筛选（闭包存状态，避免改 state）*/
  const filterShape = state.watchFilterShape || null;
  const filterVerdict = state.watchFilterVerdict || null;
  let filteredArr = arr;
  if (filterShape || filterVerdict) {
    filteredArr = arr.filter(o => {
      if (filterVerdict && (!o.adv || o.adv.verdict !== filterVerdict)) return false;
      if (filterShape && o.cyqShape !== filterShape) return false;
      return true;
    });
  }

  filteredArr.sort((a, b) => {
    const ra = a.adv ? verdictRank[a.adv.verdict] || 2 : 2;
    const rb = b.adv ? verdictRank[b.adv.verdict] || 2 : 2;
    if (ra !== rb) return ra - rb;
    return (b.adv ? b.adv.score : 0) - (a.adv ? a.adv.score : 0);
  });

  /* —— 汇总面板统计（用 filteredArr）—— */
  let sumPct = 0, nPct = 0, ndUp = 0, posCount = 0, totalMV = 0, totalPnl = 0;
  const counts = { '顺势持有': 0, '继续观察': 0, '观望': 0, '考虑减仓': 0, '建议止损': 0, '无锚定': 0 };
  filteredArr.forEach(o => {
    const v = o.adv;
    if (o.nd && o.nd.prob >= 55) ndUp++;
    if (v && v.shares > 0) { posCount++; totalMV += v.mv; totalPnl += v.pnl; }
    if (!v) { counts['无锚定']++; return; }
    if (v.pct != null) { sumPct += v.pct; nPct++; }
    if (counts[v.verdict] != null) counts[v.verdict]++;
  });
  const avgPct = nPct ? sumPct / nPct : null;

  const shapeFilterChips = Object.keys(SHAPE_META).map(key => {
    const meta = SHAPE_META[key];
    const cnt = shapeCounts[key] || 0;
    if (cnt === 0) return '';   /* 只有出现的形态才显示筛选 chip */
    const active = filterShape === key;
    return '<span class="chip cyq-filter' + (active ? ' on' : '') + '" data-shape="' + key + '" style="color:' + meta.tone + ';border-color:' + (active ? meta.tone : 'rgba(255,255,255,.1)') + (active ? ';background:' + meta.tone + '14;font-weight:600' : '') + '">' +
      meta.name + ' ' + cnt + (meta.action ? ' <small style="opacity:.7">' + meta.action + '</small>' : '') + '</span>';
  }).join('');

  const clearFilterBtn = (filterShape || filterVerdict)
    ? '<button class="btn" id="watchFilterClear" style="margin-left:auto;padding:2px 10px;font-size:10px">清除筛选 ✕</button>'
    : '';

  const verdictChipsRaw = [
    { k:'顺势持有', tone:'#5CD66F' }, { k:'继续观察', tone:'#FFD166' },
    { k:'观望', tone:'#8792A6' }, { k:'考虑减仓', tone:'#F59E0B' },
    { k:'建议止损', tone:'#EF4444' }
  ];
  const verdictFilterChips = verdictChipsRaw.map(c => {
    const cnt = counts[c.k] || 0;
    if (cnt === 0) return '';
    const active = filterVerdict === c.k;
    return '<span class="chip verdict-filter' + (active ? ' on' : '') + '" data-verdict="' + c.k + '" style="color:' + c.tone + ';border-color:' + (active ? c.tone : 'rgba(255,255,255,.1)') + (active ? ';background:' + c.tone + '14;font-weight:600' : '') + '">' + c.k + ' ' + cnt + '</span>';
  }).join('');

  const summaryHTML =
    '<div style="margin:2px 4px 10px">' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;background:linear-gradient(135deg,rgba(88,166,255,.06),rgba(162,85,255,.06));border:1px solid var(--line);border-radius:12px">' +
    '<div style="font-size:11px;color:var(--muted);min-width:48px">自选 <b class="num" style="font-size:14px;color:var(--txt)">' + filteredArr.length + '</b>/' + arr.length + ' 只</div>' +
    '<div style="font-size:11px;color:var(--muted);min-width:60px">平均浮盈 <b class="num ' + (avgPct != null && avgPct >= 0 ? 'up' : 'down') + '" style="font-size:14px">' + (avgPct != null ? signTxt(avgPct, 1) : '—') + '</b></div>' +
    '<div style="font-size:11px;color:var(--muted);min-width:72px" title="次日收阳概率≥55%的自选数量（12年实测条件概率）">明日偏涨 <b class="num" style="font-size:14px;color:' + (ndUp > 0 ? 'var(--green)' : 'var(--dim)') + '">' + ndUp + '</b> 只</div>' +
    (posCount ? '<div style="font-size:11px;color:var(--muted)" title="已填写持股数的标的">持仓 <b class="num" style="font-size:14px;color:var(--txt)">' + posCount + '</b> 只 · 市值 <b class="num" style="font-size:14px;color:var(--txt)">¥' + fmtMoney(totalMV) + '</b> · 浮动 <b class="num ' + (totalPnl >= 0 ? 'up' : 'down') + '" style="font-size:14px">' + (totalPnl >= 0 ? '+' : '-') + '¥' + fmtMoney(Math.abs(totalPnl)) + '</b></div>' : '') +
    clearFilterBtn +
    '</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">' +
    verdictFilterChips +
    '</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px">' +
    '<span style="font-size:9.5px;color:var(--muted);padding:2px 0 2px 0">筹码形态</span>' +
    shapeFilterChips +
    '</div>' +
    '</div>';

  let html = addBar + summaryHTML + '<div class="sec"><b>我的自选</b><span>' + filteredArr.length + ' 只 · 长期跟踪建议</span></div><div class="list">';

  /* 正在加载的自选股（未上榜，骨架对象）*/
  if (pulling.length) {
    html += pulling.map(x =>
      '<article class="card" style="opacity:.5"><div class="card-head"><div class="ring"><div class="num" style="color:var(--dim)">⏳</div></div>' +
      '<div class="ci"><div class="nm">' + (x.name || x.code) + '<span class="cd">' + (x.code || '').slice(2) + '</span></div>' +
      '<div class="meta">正在加载 K 线与评分…</div></div>' +
      '<div class="px"><b class="num">—</b></div></div></article>'
    ).join('');
  }

  html += filteredArr.map(({ code, x, meta, adv, cyqShape, cyqShapeName, nd }) => {
    const pctCls = x.pct >= 0 ? 'up' : 'down';
    const ws = Math.max(x.long.score, x.short.score);

    /* —— 浮盈徽章（锚定价 vs 当前价）—— */
    let badgeHTML = '';
    if (adv && adv.pct != null) {
      const bpct = adv.pct;
      const bCls = bpct >= 10 ? 'watch-badge-big' : bpct >= 0 ? 'watch-badge-pos' : 'watch-badge-neg';
      badgeHTML = '<div class="' + bCls + '">' + (bpct >= 0 ? '+' : '') + fmt(bpct, 1) + '%</div>';
    } else if (adv) {
      badgeHTML = '<div class="watch-badge-neutral">无锚定</div>';
    }

    /* —— verdict 徽章 —— */
    const toneMap = { strong: '#5CD66F', ok: '#8DD68D', mid: '#FFD166', warn: '#F59E0B', bad: '#EF4444' };
    const tone = adv ? (toneMap[adv.tone] || '#888') : '#888';
    const verdictHTML = adv
      ? '<span style="color:' + tone + ';font-weight:600;font-size:12px">' + adv.verdict + '</span>'
      : '<span style="color:var(--dim);font-size:12px">—</span>';

    /* —— 建议行（卡片底部）—— */
    let adviceRow = '';
    if (adv) {
      const anchorTxt = '<span class="anchor-edit" data-code="' + code + '" title="点击输入/修改锚定价">' +
        (adv.anchor ? '锚定 ' + fmt(adv.anchor) + (adv.anchorDate ? '（' + adv.anchorDate + '）' : '') : '未锚定') + ' ✎</span>';
      const pctTxt = adv.pct != null ? '自选 ' + (adv.pct >= 0 ? '+' : '') + fmt(adv.pct, 2) + '%' : '';
      const shapeTxt = cyqShapeName ? '筹码·' + cyqShapeName : '';
      const sigTxt = [...adv.flags, ...adv.risks].slice(0, 3).join(' · ');
      /* 次日方向概率徽章（12 年实测条件概率） */
      const ndTxt = nd ? '<span style="color:' + (nd.prob >= 55 ? 'var(--green)' : nd.prob >= 50 ? 'var(--yellow)' : 'var(--red)') + ';font-weight:600" title="次日收阳概率 · ' + (x.short.setupName || '') + (nd.notes.length ? ' · ' + nd.notes.join(' · ') : '') + '">次日↑' + nd.prob.toFixed(0) + '%</span>' : '';
      /* 持仓行：填了股数才显示 */
      const posRow = adv.shares > 0 ? '<div class="wa-pos">持仓 <b class="num">' + adv.shares.toLocaleString('zh-CN') + '</b> 股 · 成本 <b class="num">' + fmt(adv.anchor) + '</b> · 市值 <b class="num">¥' + fmtMoney(adv.mv) + '</b>' +
        (totalMV > 0 ? '（' + (adv.mv / totalMV * 100).toFixed(1) + '%）' : '') +
        ' · 浮动 <b class="num ' + (adv.pnl >= 0 ? 'up' : 'down') + '">' + (adv.pnl >= 0 ? '+' : '-') + '¥' + fmtMoney(Math.abs(adv.pnl)) + '（' + signTxt(adv.pct, 1) + '）</b></div>' : '';
      adviceRow = '<div class="watch-advice">' +
        '<div class="wa-top"><span class="wa-verdict" style="color:' + tone + '">◆ ' + adv.verdict + '</span><span class="wa-score">' + ndTxt + (ndTxt ? ' · ' : '') + '信号分 ' + (adv.score >= 0 ? '+' : '') + adv.score + (shapeTxt ? ' · ' + shapeTxt : '') + '</span></div>' +
        '<div class="wa-sub">' + anchorTxt + (pctTxt ? ' · ' + pctTxt : '') + (sigTxt ? ' · ' + sigTxt : '') + '</div>' +
        '<div class="wa-suggestion">' + adv.suggestion + '</div>' +
        posRow +
      '</div>';
    }

    return '<article class="card watch" data-code="' + code + '">' + badgeHTML +
      '<div class="card-head"><div class="ring"><svg viewBox="0 0 64 64"><circle class="rg" cx="32" cy="32" r="27"></circle>' +
      '<circle class="rv" cx="32" cy="32" r="27" stroke-dasharray="' + (2 * Math.PI * 27 * ws / 100).toFixed(1) + ' ' + (2 * Math.PI * 27).toFixed(1) + '"></circle></svg>' +
      '<span class="num">' + Math.round(ws) + '</span></div>' +
      '<div class="ci"><div class="nm">' + x.name + '<span class="cd">' + code.slice(2) + '</span></div>' +
      '<div class="meta">' + x.sector + ' · 长线 ' + fmt(x.long.score, 0) + ' / 短线 ' + fmt(x.short.score, 0) + '</div></div>' +
      '<div class="px"><b class="num">' + fmt(x.price) + '</b><small class="num ' + pctCls + '">' + signTxt(x.pct) + '</small></div></div>' +
      '<canvas class="spark" data-code="' + code + '"></canvas>' +
      adviceRow +
      '<div class="card-foot"><span>点击查看双策略分析与交易计划</span><span class="go">详情 ›</span></div></article>';
  }).join('');

  html += '</div><div class="disc">自选股不会自动买卖，请定期按「刷新」更新行情与评分。建议仅供参考。</div>';
  $('#list').innerHTML = html;
  if (healed) saveWatch();
  bindAddWatch();
  bindAnchorEdit();
  drawSparks();
  bindWatchFilter();
}

/* 锚定价手动编辑：点「锚定 X ✎」展开输入行 */
function bindAnchorEdit() {
  document.querySelectorAll('.anchor-edit').forEach(el => {
    el.onclick = (ev) => { ev.stopPropagation(); openAnchorEditor(el); };
  });
}

function openAnchorEditor(el) {
  const code = el.dataset.code;
  const old = el.parentNode.querySelector('.anchor-row');
  if (old) { old.remove(); return; }      /* 再点一次收起 */
  const meta = state.watchMeta[code] || {};
  const x = state.data[code];
  const row = document.createElement('div');
  row.className = 'anchor-row';
  row.innerHTML = '<input type="number" step="0.01" inputmode="decimal" data-f="price" placeholder="成本价" value="' + (isNum(meta.anchorPrice) ? meta.anchorPrice : '') + '">' +
    '<input type="number" step="1" min="0" inputmode="numeric" data-f="shares" placeholder="持股数" value="' + (isNum(meta.shares) && meta.shares > 0 ? meta.shares : '') + '">' +
    '<button class="btn" data-a="save">保存</button>' +
    '<button class="btn" data-a="now">现价</button>' +
    '<button class="btn" data-a="clear">清除</button>';
  el.parentNode.appendChild(row);
  const inp = row.querySelector('[data-f="price"]');
  const inpS = row.querySelector('[data-f="shares"]');
  setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) {} }, 40);

  const writeAnchor = (price, shares, manual) => {
    const m = state.watchMeta[code] || { addedAt: Date.now() };
    m.anchorPrice = price;
    m.anchorDate = price ? ((x && x.bars && x.bars.length) ? x.bars[x.bars.length - 1].d : new Date().toISOString().slice(0, 10)) : '';
    m.shares = shares || 0;
    m.manual = manual;
    state.watchMeta[code] = m;
    saveWatch();
    const txt = shares ? '持仓 ' + shares + ' 股 · 成本 ' + fmt(price || 0) : (price ? '锚定价已设为 ' + fmt(price) : '已清除持仓与锚定');
    toast(txt, 1500);
    renderWatch();
  };

  row.querySelector('[data-a="save"]').onclick = (ev) => {
    ev.stopPropagation();
    const pv = parseFloat(inp.value);
    const sv = Math.round(parseFloat(inpS.value) || 0);
    if (!(pv > 0) && !(sv > 0)) { toast('请至少填写成本价或持股数', 1400); return; }
    /* 只填股数时，成本价沿用已有锚定，否则用现价 */
    let cost = pv > 0 ? +pv.toFixed(2) : (isNum(meta.anchorPrice) && meta.anchorPrice > 0 ? meta.anchorPrice : null);
    if (!cost) cost = isNum(x && x.price) && x.price > 0 ? +x.price.toFixed(2) : null;
    writeAnchor(cost, Math.max(0, sv), true);
  };
  row.querySelector('[data-a="now"]').onclick = (ev) => {
    ev.stopPropagation();
    const p = isNum(x && x.price) && x.price > 0 ? x.price : (x && x.bars && x.bars.length ? x.bars[x.bars.length - 1].c : null);
    if (!(p > 0)) { toast('暂无现价，请手动输入', 1300); return; }
    const sv = Math.round(parseFloat(inpS.value) || 0) || (isNum(meta.shares) ? meta.shares : 0);
    writeAnchor(+p.toFixed(2), sv, true);
  };
  row.querySelector('[data-a="clear"]').onclick = (ev) => {
    ev.stopPropagation();
    writeAnchor(null, 0, true);   /* manual=true → 之后不再自动补 */
  };
  [inp, inpS].forEach(elm => { elm.onkeydown = (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); row.querySelector('[data-a="save"]').click(); } }; });
}

function bindWatchFilter() {
  /* 清理旧绑定 */
  document.querySelectorAll('.chip.cyq-filter, .chip.verdict-filter, #watchFilterClear').forEach(el => {
    el.replaceWith(el.cloneNode(true));   /* 去除之前的 addEventListener */
  });
  /* 筹码形态筛选 */
  document.querySelectorAll('.chip.cyq-filter').forEach(chip => {
    chip.addEventListener('click', () => {
      const shape = chip.dataset.shape;
      state.watchFilterShape = state.watchFilterShape === shape ? null : shape;
      renderWatch();
    });
  });
  /* verdict 筛选 */
  document.querySelectorAll('.chip.verdict-filter').forEach(chip => {
    chip.addEventListener('click', () => {
      const v = chip.dataset.verdict;
      state.watchFilterVerdict = state.watchFilterVerdict === v ? null : v;
      renderWatch();
    });
  });
  /* 清除 */
  const clearBtn = document.getElementById('watchFilterClear');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    state.watchFilterShape = null;
    state.watchFilterVerdict = null;
    renderWatch();
  });
}

/* ---------------- 盘后复盘 ---------------- */
function reviewCollect() {
  // 优先分析自选股；自选为空时退化为今日高分入选（长+短各取前 20）
  const all = Object.values(state.data).filter(x => x && x.long && x.short);
  let pool;
  const wArr = Array.from(state.watch).map(c => state.data[c]).filter(x => x && x.long && x.short);
  /* 如果 watch 里有骨架对象（ensureWatchStock 刚塞的占位，数据还没拉完），也先纳入 */
  const partial = Array.from(state.watch).map(c => state.data[c]).filter(x => x && !x.long && !x.short && x.bars && x.bars.length >= 260);
  const needsPull = Array.from(state.watch).filter(c => {
    const x = state.data[c];
    return !x || !x.bars || x.bars.length < 260 || !x.long || !x.short;
  });
  if (needsPull.length) ensureAllWatch();   // 异步兜底，拉完会自动再 renderReview

  if (wArr.length) pool = wArr.concat(partial);
  else {
    const topLong = all.slice().sort((a, b) => b.long.score - a.long.score).slice(0, 20);
    const topShort = all.slice().sort((a, b) => b.short.score - a.short.score).slice(0, 20);
    const set = new Set([...topLong, ...topShort].map(x => x.code));
    pool = all.filter(x => set.has(x.code));
  }
  return pool.map(x => {
    const b = x.bars || [];
    const lb = b[b.length - 1] || {}, pb = b[b.length - 2] || {};
    const dayRet = isNum(x.pct) ? x.pct : (pb.c ? (lb.c / pb.c - 1) * 100 : 0);
    const intra = lb.o ? (lb.c / lb.o - 1) * 100 : 0;
    const bestMode = (x.short.score || 0) >= (x.long.score || 0) ? 'short' : 'long';
    return {
      x, dayRet, intra,
      mode: bestMode,
      score: bestMode === 'short' ? x.short.score : x.long.score,
      setup: bestMode === 'short' ? (x.short.setupName || '短线') : '长线持有'
    };
  });
}

/* 测算引擎面板：展示实测触板率矩阵 + 昨日信号组合 */
function limitStatsPanel() {
  const LS = state.limitStats;
  if (!LS || !LS.cells) {
    return '<div class="notice" style="font-size:11px;padding:8px 10px">📐 测算引擎：暂无数据，点「重新测算」用本地日线现场计算触板率矩阵。<button class="btn" id="lsBtn" style="margin:8px auto 0">重新测算</button></div>';
  }
  const glabels = ['高开1-3%', '高开3-6%', '高开6-9%', '高开≥9%'];
  const vlabels = ['量<1', '量1-2', '量≥2'];
  let rows = '';
  LS.cells.forEach((row, gi) => {
    row.forEach((c, vi) => {
      if (c.p == null) return;
      rows += '<div class="rv-group" style="padding:6px 8px"><div class="rv-g-name" style="font-size:11px">' + glabels[gi] + ' · ' + vlabels[vi] + '</div>' +
        '<div class="rv-g-stat"><span class="' + (c.p >= 30 ? 'up' : c.p >= 12 ? '' : 'down') + '" style="font-size:13px">' + c.p + '%</span><small>n=' + c.n + '</small></div></div>';
    });
  });
  const hk = { ptGapUp: '昨日触板+高开≥1%', ptGapDn: '昨日触板+低开', r15g6: '5日≥15%+高开≥6%', r15g3: '5日≥15%+高开3-6%', r15g1: '5日≥15%+高开1-3%' };
  let hrows = '';
  Object.entries(LS.hist || {}).forEach(([k, b]) => {
    if (!b || b.p == null) return;
    hrows += '<div class="rv-group" style="padding:6px 8px"><div class="rv-g-name" style="font-size:11px">' + hk[k] + '</div>' +
      '<div class="rv-g-stat"><span class="' + (b.p >= 30 ? 'up' : '') + '" style="font-size:13px">' + b.p + '%</span><small>n=' + b.n + '</small></div></div>';
  });
  return '<div class="notice" style="font-size:11px;padding:8px 10px">' +
    '📐 <b>涨停测算引擎</b> · ' + LS.date + ' · ' + LS.stocks + ' 只 × ' + LS.total.toLocaleString() + ' 样本 · 基准触板率 <b>' + LS.base + '%</b>（触板=盘中摸到涨停价，非封板）' +
    '<div class="rv-groups" style="margin-top:6px">' + rows + '</div>' +
    (hrows ? '<div style="margin:6px 0 2px;color:var(--muted)">昨日信号组合（连板/强动量）</div><div class="rv-groups">' + hrows + '</div>' : '') +
    '<button class="btn" id="lsBtn" style="margin:8px auto 0">重新测算</button></div>';
}

/* 盘后复盘 */
function renderReview() {
  const rows = reviewCollect();
  if (!rows.length) {
    $('#list').innerHTML = '<div class="empty"><div class="ico">📊</div><p>暂无数据</p><p>请先点「刷新」扫描市场，或在个股卡片点亮星标加入自选</p></div>';
    return;
  }

  // 分组合计（按 mode+setup）
  const groups = {};
  rows.forEach(r => {
    const k = r.mode + '·' + r.setup;
    if (!groups[k]) groups[k] = { key: k, mode: r.mode, setup: r.setup, items: [] };
    groups[k].items.push(r);
  });
  const groupArr = Object.values(groups).map(g => {
    const rets = g.items.map(i => i.dayRet);
    const wins = rets.filter(v => v > 0).length;
    const avg = rets.reduce((a, b) => a + b, 0) / rets.length;
    const winRate = wins / rets.length * 100;
    return { ...g, n: rets.length, wins, winRate, avg };
  }).sort((a, b) => b.avg - a.avg);

  // 整体
  const allRets = rows.map(r => r.dayRet);
  const totalWins = allRets.filter(v => v > 0).length;
  const totalAvg = allRets.reduce((a, b) => a + b, 0) / allRets.length;
  const best = rows.slice().sort((a, b) => b.dayRet - a.dayRet)[0];
  const worst = rows.slice().sort((a, b) => a.dayRet - b.dayRet)[0];

  let html = '<div class="sec"><b>盘后复盘</b><span>' + (state.lastDate || '') + ' · ' + rows.length + ' 只标的今日表现</span></div>';
  html += '<div class="review-grid">' +
    '<div class="rv-card"><div class="rv-k">今日胜率</div><div class="rv-v ' + (totalWins / rows.length >= 0.5 ? 'up' : 'down') + '">' + (totalWins / rows.length * 100).toFixed(0) + '%</div><div class="rv-s">' + totalWins + ' / ' + rows.length + ' 收红</div></div>' +
    '<div class="rv-card"><div class="rv-k">平均涨跌</div><div class="rv-v ' + (totalAvg >= 0 ? 'up' : 'down') + '">' + signTxt(totalAvg) + '</div><div class="rv-s">含全部标的</div></div>' +
    '<div class="rv-card"><div class="rv-k">最强</div><div class="rv-v up">' + (best ? signTxt(best.dayRet) : '—') + '</div><div class="rv-s">' + (best ? best.x.name : '') + '</div></div>' +
    '<div class="rv-card"><div class="rv-k">最弱</div><div class="rv-v down">' + (worst ? signTxt(worst.dayRet) : '—') + '</div><div class="rv-s">' + (worst ? worst.x.name : '') + '</div></div>' +
    '</div>';

  // 分组合计
  html += '<div class="sec"><b>按策略分组</b><span>胜率 · 平均涨跌</span></div><div class="rv-groups">';
  groupArr.forEach(g => {
    const cls = g.avg >= 0 ? 'up' : 'down';
    html += '<div class="rv-group">' +
      '<div class="rv-g-name"><span class="mode ' + g.mode + '">' + (g.mode === 'short' ? '短线' : '长线') + '</span>' + g.setup + '</div>' +

      '<div class="rv-left">' +
        '<div class="rv-nm">' + x.name + '<span class="cd">' + x.code.slice(2) + '</span></div>' +
        '<div class="rv-meta"><span class="mode ' + r.mode + '">' + (r.mode === 'short' ? '短' : '长') + '</span> ' + r.setup + ' · ' + r.score.toFixed(0) + '分</div>' +

  html += '<div class="disc">复盘基于自选股或当日高分入选；"收红"=今日收盘价高于昨收。建议收盘 15:00 后点「刷新」拉取完整当日 K 线再查看。</div>';

}

function openDetail(code, mode) {

/* ---------------- 实时盘口（腾讯五档行情，免费无 key） ---------------- */
function inTrading() {
  const d = new Date();
  if (d.getDay() === 0 || d.getDay() === 6) return false;
  const t = d.getHours() * 60 + d.getMinutes();
  return (t >= 570 && t <= 690) || (t >= 780 && t <= 900);
}

function depthHTML(x) {
  const q = x.qt || [];
  const n = i => { const v = parseFloat(q[i]); return isFinite(v) ? v : NaN; };
  const px = n(3), prev = n(4), open = n(5), hi = n(33), lo = n(34);
  const vol = n(36), amt = n(37), turn = n(38), vr = n(49);
  const ts = q[30] || '';
  const tm = ts.length >= 14 ? ts.slice(8, 10) + ':' + ts.slice(10, 12) + ':' + ts.slice(12, 14) : '—';
  const pc = isNum(px) && isNum(prev) && prev > 0 ? (px / prev - 1) * 100 : 0;
  const ups = isNum(px) && isNum(prev) ? px >= prev : true;
  const buys = [], sells = [];
  for (let i = 0; i < 5; i++) {
    buys.push({ p: n(9 + i * 2), v: n(10 + i * 2) });
    sells.push({ p: n(19 + i * 2), v: n(20 + i * 2) });
  }
  const mx = Math.max(1, ...buys.map(b => b.v || 0), ...sells.map(s => s.v || 0));
  const row = (cls, lb, o) => {
    if (!isNum(o.p) || o.p <= 0) return '';
    const w = Math.max(3, Math.min(100, (o.v || 0) / mx * 100));
    const qv = isNum(o.v) ? (o.v >= 1e4 ? (o.v / 1e4).toFixed(1) + '万' : String(o.v)) : '—';
    return '<div class="dq ' + cls + '"><span class="lb">' + lb + '</span><b class="num">' + fmt(o.p) + '</b>' +
      '<i class="bar" style="width:' + w.toFixed(0) + '%"></i><span class="qv num">' + qv + '</span></div>';
  };
  const volTxt = v => isNum(v) ? (v >= 1e4 ? (v / 1e4).toFixed(1) + '万手' : v + '手') : '—';
  return '<div class="depth-head"><div>' +
      '<b class="dp num ' + (ups ? 'up' : 'down') + '">' + (isNum(px) ? fmt(px) : '—') + '</b>' +
      '<small class="num ' + (ups ? 'up' : 'down') + '">' + (pc >= 0 ? '+' : '') + fmt(pc, 2) + '%</small></div>' +
      '<div class="dtime">' + tm + ' 更新<br><button class="dref" id="depthRefresh">刷新</button></div></div>' +
    '<div class="dq-list">' +
      sells.slice().reverse().map((o, k) => row('s', '卖' + (5 - k), o)).join('') +
      buys.map((o, k) => row('b', '买' + (k + 1), o)).join('') +
    '</div>' +
    '<div class="dstats">今开 ' + fmt(open) + ' · 昨收 ' + fmt(prev) + ' · 最高 ' + fmt(hi) + ' · 最低 ' + fmt(lo) +
      '<br>成交量 ' + volTxt(vol) + ' · 成交额 ' + (isNum(amt) ? (amt >= 10000 ? fmt(amt / 10000, 2) + '亿' : fmt(amt) + '万') : '—') +
      ' · 换手 ' + (isNum(turn) ? fmt(turn, 2) + '%' : '—') + ' · 量比 ' + (isNum(vr) ? fmt(vr, 2) : '—') + '</div>';
}

async function refreshDepth() {
  const d = state.detail;
  if (!d) return;
  try {
    const qs = await fetchQuotes([d.code]);
    const q = qs[d.code];
    const x = state.data[d.code];
    if (!q || !x) return;
    x.qt = q;
    parseQt(x);
    const box = $('#depthBox');
    if (box) { box.innerHTML = depthHTML(x); bindDepthBtn(); }
  } catch (e) { /* 单次失败忽略，等待下次刷新 */ }
}

function bindDepthBtn() {
  const b = $('#depthRefresh');
  if (b) b.onclick = () => refreshDepth();
}
function stopDepthTimer() {
  if (state.depthTimer) { clearInterval(state.depthTimer); state.depthTimer = 0; }
}
function startDepthTimer() {
  stopDepthTimer();
  if (!inTrading()) return;
  state.depthTimer = setInterval(refreshDepth, 5000);
}

function closeDetail() {
  stopDepthTimer();
  const wrap = $('#sheet');
  wrap.classList.remove('open');
  wrap.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  state.detail = null;
}

    '<div class="part"><span class="pl">' + p.k + '</span><div class="pb"><i style="width:' +
    (clamp(p.v / p.max, 0, 1) * 100).toFixed(1) + '%"></i></div><span class="pv num">' + fmt(p.v, 1) + '</span></div>'
  ).join('');
  const planRows = s.plan.map(r =>
    '<div class="pr"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>'
  ).join('');
  const risks = s.risks.length

function toast(msg, ms) {
  let el = $('#toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms || 2000);
}

/* ---------------- 图表 ---------------- */
function prepCanvas(cv) {
  const rect = cv.getBoundingClientRect();
  const w = Math.max(80, rect.width), h = Math.max(40, rect.height);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  return { g, w, h };
}

function drawSparks() {
  $$('canvas.spark').forEach(cv => {
    const x = state.data[cv.dataset.code];
    if (!x || !x.ind) return;
    const vals = x.ind.c.slice(-60);
    if (vals.length < 2) return;
    const { g, w, h } = prepCanvas(cv);
    const mn = Math.min(...vals), mx = Math.max(...vals), pad = 5;
    const up = vals[vals.length - 1] >= vals[0];
    const col = up ? C.up : C.down;
    const X = i => i / (vals.length - 1) * w;
    const Y = v => h - pad - (v - mn) / (mx - mn || 1) * (h - pad * 2);
    g.beginPath();
    vals.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
    g.strokeStyle = col;
    g.lineWidth = 1.3;
    g.globalAlpha = .9;
    g.stroke();
    g.lineTo(w, h); g.lineTo(0, h); g.closePath();
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, up ? 'rgba(255,92,92,.16)' : 'rgba(34,197,139,.16)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fill();
    g.globalAlpha = 1;

    /* 末端高亮圆点 + 60 日区间涨跌幅（让方向一眼可见） */
    const li = vals.length - 1;
    g.fillStyle = col;
    g.beginPath(); g.arc(X(li) - 1.2, Y(vals[li]), 2.3, 0, Math.PI * 2); g.fill();
    const pct = (vals[li] / vals[0] - 1) * 100;
    g.font = '9px -apple-system,PingFang SC,sans-serif';
    g.textAlign = 'right';
    g.globalAlpha = .95;
    g.fillText((pct >= 0 ? '+' : '') + fmt(pct, 1) + '%', w - 2, 10);
    g.globalAlpha = 1;
    g.textAlign = 'left';
  });
}

function drawLine(g, arr, X, Y, color, width) {
  g.strokeStyle = color;
  g.lineWidth = width || 1.1;
  g.beginPath();
  let started = false;
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i];
    if (!isNum(v)) { started = false; continue; }
    if (!started) { g.moveTo(X(i), Y(v)); started = true; }
    else g.lineTo(X(i), Y(v));
  }
  g.stroke();
}

function drawPrice(cv, x, n) {
  n = n || 90;
  const { g, w, h } = prepCanvas(cv);
  const off = Math.max(0, x.bars.length - n);
  const bars = x.bars.slice(-n);
  if (bars.length < 2) return;
  const ma20 = x.ind.ma20.slice(off, off + bars.length);
  const ma60 = x.ind.ma60.slice(off, off + bars.length);
  const padR = 42, padT = 8, padB = 2;
  const priceH = (h - padT - padB) * 0.74;
  const volTop = h * 0.80, volH = h * 0.15;
  const plotW = w - padR - 2;

  let mn = Infinity, mx = -Infinity;
  bars.forEach(b => { mn = Math.min(mn, b.l); mx = Math.max(mx, b.h); });
  [ma20, ma60].forEach(arr => arr.forEach(v => {
    if (isNum(v)) { mn = Math.min(mn, v); mx = Math.max(mx, v); }
  }));
  const rng = (mx - mn) || 1;
  mn -= rng * .025; mx += rng * .025;
  const Y = v => padT + (mx - v) / (mx - mn) * (priceH - padT);
  const X = i => 1 + (i + .5) / bars.length * plotW;
  const bw = Math.max(1.4, plotW / bars.length * .62);

  g.strokeStyle = C.grid; g.lineWidth = 1;
  for (let i = 0; i <= 2; i++) {
    const yy = padT + (priceH - padT) * i / 2;
    g.beginPath(); g.moveTo(1, yy); g.lineTo(w - padR, yy); g.stroke();
  }

  bars.forEach((b, i) => {
    const up = b.c >= b.o;
    const col = up ? C.up : C.down;
    g.strokeStyle = col; g.lineWidth = .9;
    g.beginPath(); g.moveTo(X(i), Y(b.h)); g.lineTo(X(i), Y(b.l)); g.stroke();
    const y1 = Y(Math.max(b.o, b.c)), y2 = Y(Math.min(b.o, b.c));
    g.fillStyle = up ? 'rgba(255,92,92,.82)' : 'rgba(34,197,139,.82)';
    g.fillRect(X(i) - bw / 2, y1, bw, Math.max(1, y2 - y1));
  });

  drawLine(g, ma20, X, Y, C.gold, 1.1);
  drawLine(g, ma60, X, Y, C.cyan, 1.1);

  const vmax = Math.max(...bars.map(b => b.v), 1);
  bars.forEach((b, i) => {
    const vh = b.v / vmax * volH;
    g.fillStyle = b.c >= b.o ? 'rgba(255,92,92,.42)' : 'rgba(34,197,139,.42)';
    g.fillRect(X(i) - bw / 2, volTop + volH - vh, bw, vh);
  });

  /* 均线图例（左上角，让颜色含义明确） */
  g.font = '9px -apple-system,PingFang SC,sans-serif';
  g.textAlign = 'left';
  g.strokeStyle = C.gold; g.lineWidth = 2;
  g.beginPath(); g.moveTo(4, padT + 4); g.lineTo(12, padT + 4); g.stroke();
  g.fillStyle = 'rgba(229,180,91,.95)';
  g.fillText('MA20', 15, padT + 7);
  g.strokeStyle = C.cyan;
  g.beginPath(); g.moveTo(50, padT + 4); g.lineTo(58, padT + 4); g.stroke();
  g.fillStyle = 'rgba(76,201,240,.95)';
  g.fillText('MA60', 61, padT + 7);

  g.fillStyle = C.muted;
  g.font = '9px -apple-system,PingFang SC,sans-serif';
  g.textAlign = 'left';
  g.fillText(fmt(mx, mx > 100 ? 0 : 2), w - padR + 4, padT + 3);
  g.fillText(fmt(mn, mn > 100 ? 0 : 2), w - padR + 4, priceH - 1);

  const lastC = bars[bars.length - 1].c;

  /* 止损参考线：2×ATR 与前低结构位取更近者，最松 -7% */
  const atr0 = last(x.ind.atr) || lastC * 0.03;
  const swLow = isNum(x.ind.swingLow) ? x.ind.swingLow - 0.5 * atr0 : null;
  const atrStop0 = lastC - 2 * atr0;
  const stopP = Math.max(swLow ? Math.max(atrStop0, swLow) : atrStop0, lastC * 0.93);
  if (stopP > mn && stopP < mx) {
    const sy = Y(stopP);
    g.strokeStyle = 'rgba(255,92,92,.5)';
    g.setLineDash([2, 3]);
    g.beginPath(); g.moveTo(1, sy); g.lineTo(w - padR, sy); g.stroke();
    g.setLineDash([]);
    g.fillStyle = 'rgba(255,92,92,.85)';
    g.font = '8px -apple-system,PingFang SC,sans-serif';
    g.textAlign = 'right';
    g.fillText('止损', w - padR - 3, sy - 3);
    g.textAlign = 'left';
  }

  const ly = clamp(Y(lastC), padT, priceH);
  g.strokeStyle = 'rgba(229,180,91,.45)';
  g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(1, ly); g.lineTo(w - padR, ly); g.stroke();
  g.setLineDash([]);
  const chg = (lastC / bars[bars.length - 2].c - 1) * 100;
  const txt = fmt(lastC);
  const tw = Math.max(g.measureText(txt).width, 30) + 6;
  g.fillStyle = 'rgba(229,180,91,.94)';
  g.fillRect(w - padR + 2, ly - 8, Math.min(tw, padR - 4), 21);
  g.fillStyle = '#0A0F1A';
  g.font = '9px -apple-system,PingFang SC,sans-serif';
  g.fillText(txt, w - padR + 5, ly + 1);
  g.font = '8px -apple-system,PingFang SC,sans-serif';
  g.fillText((chg >= 0 ? '+' : '') + fmt(chg, 1) + '%', w - padR + 5, ly + 10);
}

function drawMACD(cv, x, n) {
  n = n || 90;
  const { g, w, h } = prepCanvas(cv);
  const off = Math.max(0, x.bars.length - n);
  const dif = x.ind.dif.slice(off, off + n);
  const dea = x.ind.dea.slice(off, off + n);
  const hist = x.ind.hist.slice(off, off + n);
  const padR = 42, padT = 6, padB = 6;
  const mid = (padT + h - padB) / 2;
  const amp = (h - padT - padB) / 2 - 2;
  let mx = .001;
  [...dif, ...dea, ...hist].forEach(v => { if (isNum(v)) mx = Math.max(mx, Math.abs(v)); });
  const Y = v => mid - v / mx * amp;
  const X = i => 1 + (i + .5) / hist.length * (w - padR - 2);
  const bw = Math.max(1.3, (w - padR) / hist.length * .6);

  g.strokeStyle = 'rgba(255,255,255,.16)';
  g.beginPath(); g.moveTo(1, mid); g.lineTo(w - padR, mid); g.stroke();
  hist.forEach((v, i) => {
    if (!isNum(v)) return;
    const y0 = mid, y1 = Y(v);
    g.fillStyle = v >= 0 ? 'rgba(255,92,92,.5)' : 'rgba(34,197,139,.5)';
    g.fillRect(X(i) - bw / 2, Math.min(y0, y1), bw, Math.abs(y1 - y0) || 1);
  });
  /* 金叉 / 死叉标记（红色▲=金叉，绿色▼=死叉） */
  for (let i = 1; i < dif.length; i++) {
    if (!isNum(dif[i]) || !isNum(dif[i - 1]) || !isNum(dea[i]) || !isNum(dea[i - 1])) continue;
    const up = dif[i - 1] <= dea[i - 1] && dif[i] > dea[i];
    const dn = dif[i - 1] >= dea[i - 1] && dif[i] < dea[i];
    if (!up && !dn) continue;
    const yy = clamp(Y(dif[i]), padT + 4, h - padB - 2);
    g.fillStyle = up ? 'rgba(255,92,92,.95)' : 'rgba(34,197,139,.95)';
    g.beginPath();
    if (up) { g.moveTo(X(i), yy - 6); g.lineTo(X(i) - 2.6, yy - 1); g.lineTo(X(i) + 2.6, yy - 1); }
    else { g.moveTo(X(i), yy + 6); g.lineTo(X(i) - 2.6, yy + 1); g.lineTo(X(i) + 2.6, yy + 1); }
    g.closePath(); g.fill();
  }
  drawLine(g, dif, X, Y, C.gold, 1.2);
  drawLine(g, dea, X, Y, C.cyan, 1.2);

  g.font = '9px -apple-system,PingFang SC,sans-serif';
  g.textAlign = 'left';
  g.fillStyle = C.gold;
  g.fillText(fmt(last(dif), 2), w - padR + 4, padT + 7);
  g.fillStyle = C.cyan;
  g.fillText(fmt(last(dea), 2), w - padR + 4, padT + 17);
  g.fillStyle = last(hist) >= 0 ? C.up : C.down;
  g.fillText(fmt(last(hist), 2), w - padR + 4, padT + 27);
}

function drawKDJ(cv, x, n) {
  n = n || 90;
  const { g, w, h } = prepCanvas(cv);
  const off = Math.max(0, x.bars.length - n);
  const K = x.ind.K.slice(off, off + n);
  const D = x.ind.D.slice(off, off + n);
  const J = x.ind.J.slice(off, off + n);
  const padR = 42, padT = 6, padB = 6;
  let mn = 0, mx = 100;
  [...K, ...D, ...J].forEach(v => { if (isNum(v)) { mn = Math.min(mn, v); mx = Math.max(mx, v); } });
  mn = Math.floor(mn / 20) * 20 - 10; mx = Math.ceil(mx / 20) * 20 + 10;
  const Y = v => padT + (mx - v) / (mx - mn) * (h - padT - padB);
  const X = i => 1 + (i + .5) / K.length * (w - padR - 2);

  /* 超卖（<20）绿色底 / 超买（>80）红色底，一眼看出极值区 */
  g.fillStyle = 'rgba(34,197,139,.07)';
  g.fillRect(1, Y(20), w - padR - 2, Math.max(0, (h - padB) - Y(20)));
  g.fillStyle = 'rgba(255,92,92,.07)';
  g.fillRect(1, padT, w - padR - 2, Math.max(0, Y(80) - padT));

  g.strokeStyle = 'rgba(255,255,255,.10)';
  g.setLineDash([3, 4]);
  [20, 80].forEach(v => {
    const yy = Y(v);
    g.beginPath(); g.moveTo(1, yy); g.lineTo(w - padR, yy); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.25)';
    g.font = '8px -apple-system,sans-serif';
    g.textAlign = 'left';
    g.fillText(v, 2, yy - 2);
  });
  g.setLineDash([]);

  drawLine(g, K, X, Y, C.gold, 1.2);
  drawLine(g, D, X, Y, C.cyan, 1.2);
  drawLine(g, J, X, Y, C.purple, 1.1);

  g.font = '9px -apple-system,PingFang SC,sans-serif';
  g.textAlign = 'left';
  g.fillStyle = C.gold; g.fillText('K ' + fmt(last(K), 1), w - padR + 4, padT + 7);
  g.fillStyle = C.cyan; g.fillText('D ' + fmt(last(D), 1), w - padR + 4, padT + 17);
  g.fillStyle = C.purple; g.fillText('J ' + fmt(last(J), 1), w - padR + 4, padT + 27);
}

/* ---------------- 筹码分布（CYQ） ---------------- */
/**
 * 换手率衰减模型：纯前端合成筹码分布矩阵
 * 不需要外部 API，仅用 bars（o/h/l/c/v）即可生成。
 * 原理：每一天的成交量 v[i] 按正态分布落在当日 H-L 价格区间；
 *       越早的筹码按「累计换手率」指数衰减，换手率越高衰减越快。
 * 输出：{ bins:[{price, weight}], currentPrice, avgCost, profitRatio, concentrated(percentile), cyq90 }
 */
function cyqDistribution(bars, anchorIdx) {
  if (!bars || bars.length < 60) return null;
  const anchor = anchorIdx != null ? Math.min(anchorIdx, bars.length - 1) : bars.length - 1;
  const slice = bars.slice(Math.max(0, anchor - 250), anchor + 1);
  if (slice.length < 60) return null;

  /* 1. 价格区间 & 价位 bins（50 档）*/
  let pLo = Infinity, pHi = -Infinity;
  slice.forEach(b => { pLo = Math.min(pLo, b.l); pHi = Math.max(pHi, b.h); });
  const pad = (pHi - pLo) * 0.03;
  pLo -= pad; pHi += pad;
  const N = 50;
  const step = (pHi - pLo) / (N - 1);
  const prices = Array.from({ length: N }, (_, i) => pLo + i * step);
  const weights = new Array(N).fill(0);

  /* 2. 估算相对换手率（用当日成交量 / 20日均量）*/
  const vols = slice.map(b => b.v || 0);
  const vma20 = vols.map((_, i) => {
    const start = Math.max(0, i - 19);
    const seg = vols.slice(start, i + 1);
    return seg.reduce((a, b) => a + b, 0) / seg.length;
  });
  /* 累计换手率因子（越靠后累计值越大 → 越早的 day 衰减越多）*/
  const relTurn = vols.map((v, i) => vma20[i] > 0 ? v / vma20[i] : 1);
  const cumTurn = new Array(slice.length).fill(0);
  let acc = 0;
  for (let i = 0; i < slice.length; i++) {
    cumTurn[i] = acc;
    acc += relTurn[i];
  }
  const totalCumTurn = acc;
  const lambda = 2.8 / Math.max(totalCumTurn, 1);   /* 衰减速率：约 1.5~2 倍换手后衰减到 5% */

  /* 3. 每一天把成交量撒到价格 bins 上 */
  for (let i = 0; i < slice.length; i++) {
    const b = slice[i];
    const mid = (b.h + b.l) / 2;
    const halfR = Math.max((b.h - b.l) / 2, step * 1.2);
    const vol = b.v || 0;
    if (vol <= 0) continue;

    /* 衰减：越早的 day（cumTurn 越小）权重越低 */
    const decay = Math.exp(-lambda * (totalCumTurn - cumTurn[i]));
    const effectiveVol = vol * decay;

    /* 正态分布撒筹码（只撒到当日 H-L 区间附近 ±2σ）*/
    const sigma = halfR / 1.6;   /* σ ≈ H-L/3.2，95% 在 H-L 内 */
    let sumW = 0;
    const dayW = new Array(N).fill(0);
    for (let j = 0; j < N; j++) {
      const d = (prices[j] - mid) / sigma;
      dayW[j] = Math.exp(-0.5 * d * d);
      sumW += dayW[j];
    }
    if (sumW <= 0) continue;
    const norm = effectiveVol / sumW;
    for (let j = 0; j < N; j++) weights[j] += dayW[j] * norm;
  }

  /* 4. 归一化 */
  const totalW = weights.reduce((a, b) => a + b, 0);
  if (totalW <= 0) return null;
  for (let j = 0; j < N; j++) weights[j] /= totalW;

  /* 5. 统计指标 */
  const cur = slice[slice.length - 1].c;
  let aboveSum = 0;
  for (let j = 0; j < N; j++) if (prices[j] >= cur) aboveSum += weights[j];
  const profitRatio = 1 - aboveSum;   /* 现价以下的筹码比例 = 获利盘 */

  /* 平均成本（加权均价，全量筹码）*/
  let avgCost = 0;
  for (let j = 0; j < N; j++) avgCost += prices[j] * weights[j];

  /* 筹码集中度 cyq90：90% 筹码分布宽度 / 中位价位 */
  let cum = 0, p10 = pLo, p90 = pHi;
  for (let j = 0; j < N; j++) {
    cum += weights[j];
    if (cum >= 0.1 && p10 === pLo) p10 = prices[j];
    if (cum >= 0.9) { p90 = prices[j]; break; }
  }
  const concentrated = pHi > 0 ? (p90 - p10) / avgCost : 1;

  return {
    prices, weights, currentPrice: cur, avgCost, profitRatio, concentrated,
    p10, p90, pLo, pHi,
    totalBars: slice.length
  };
}

/** 绘制筹码分布图（水平筹码柱 + 均线 + 现价 + 获利/套牢分区）*/
function drawCyq(cv, x) {
  const { g, w, h } = prepCanvas(cv);
  const anchorIdx = x.bars.length - 1;
  const cyq = cyqDistribution(x.bars, anchorIdx);
  if (!cyq) { g.font = '11px -apple-system,sans-serif'; g.fillStyle = C.muted; g.textAlign = 'center'; g.fillText('筹码分布需要至少 60 日 K 线', w / 2, h / 2); return; }

  const padT = 6, padB = 14, padR = 56, padL = 48;
  const plotH = h - padT - padB;
  const plotW = w - padL - padR;

  const Y = p => padT + (cyq.pHi - p) / (cyq.pHi - cyq.pLo) * plotH;
  const X = frac => padL + frac * plotW;

  /* 找最大权重（归一化宽度）*/
  const maxW = Math.max(...cyq.weights, 1e-10);

  /* —— 1. 水平筹码条 —— */
  const step = (cyq.pHi - cyq.pLo) / (cyq.prices.length - 1);
  const bandH = Math.max(plotH / cyq.prices.length - 1, 1.5);
  for (let j = 0; j < cyq.prices.length; j++) {
    const price = cyq.prices[j];
    const wfrac = cyq.weights[j] / maxW;
    if (wfrac < 0.01) continue;
    const y0 = Y(price) - bandH / 2;
    const bw = wfrac * plotW;
    const isProfit = price <= cyq.currentPrice;
    g.fillStyle = isProfit
      ? `rgba(255,92,92,${0.12 + wfrac * 0.62})`    /* 获利盘（现价以下）：红 */
      : `rgba(76,201,240,${0.10 + wfrac * 0.55})`;  /* 套牢盘（现价以上）：青 */
    g.fillRect(padL, y0, bw, bandH);
    /* 高亮层（只给宽筹码条加一点发光）*/
    if (wfrac > 0.45) {
      g.fillStyle = isProfit ? 'rgba(255,160,160,.25)' : 'rgba(160,220,255,.2)';
      g.fillRect(padL, y0, bw, bandH * 0.5);
    }
  }

  /* —— 2. 中轴分隔线 + 价格标尺 —— */
  g.strokeStyle = C.grid; g.lineWidth = 1;
  g.beginPath(); g.moveTo(padL, padT); g.lineTo(padL, padT + plotH); g.stroke();
  /* 每 20% 画一条价格线 */
  g.font = '9px -apple-system,sans-serif';
  g.fillStyle = C.muted; g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let k = 0; k <= 5; k++) {
    const p = cyq.pLo + (cyq.pHi - cyq.pLo) * k / 5;
    const yy = Y(p);
    g.strokeStyle = 'rgba(255,255,255,.04)';
    g.beginPath(); g.moveTo(padL, yy); g.lineTo(w - padR, yy); g.stroke();
    g.fillText(p.toFixed(2), padL - 4, yy);
  }

  /* —— 3. 现价线（水平贯穿）—— */
  const curY = Y(cyq.currentPrice);
  g.strokeStyle = C.up; g.lineWidth = 1.2; g.setLineDash([3, 2]);
  g.beginPath(); g.moveTo(padL, curY); g.lineTo(w - padR, curY); g.stroke();
  g.setLineDash([]);
  g.fillStyle = '#FF5C5C'; g.font = 'bold 9px -apple-system,sans-serif';
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('现价 ' + fmt(cyq.currentPrice, 2), w - padR + 4, curY);

  /* —— 4. 平均成本线（若有明显差异）—— */
  const avgY = Y(cyq.avgCost);
  g.strokeStyle = C.gold; g.lineWidth = 1; g.setLineDash([4, 2]);
  g.beginPath(); g.moveTo(padL, avgY); g.lineTo(w - padR, avgY); g.stroke();
  g.setLineDash([]);
  g.fillStyle = '#E5B45B';
  g.fillText('成本 ' + fmt(cyq.avgCost, 2), w - padR + 4, avgY + 10);

  /* —— 5. cyq90 区间高亮（90% 筹码带宽）—— */
  const p10Y = Y(cyq.p10), p90Y = Y(cyq.p90);
  g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(padL, p10Y); g.lineTo(w - padR, p10Y); g.stroke();
  g.beginPath(); g.moveTo(padL, p90Y); g.lineTo(w - padR, p90Y); g.stroke();
  /* 区间标注 */
  g.fillStyle = 'rgba(255,255,255,.35)';
  g.font = '8.5px -apple-system,sans-serif';
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillText('CYQ90: ' + fmt(cyq.p10, 2) + ' – ' + fmt(cyq.p90, 2), padL + 4, padT + 10);

  /* —— 6. 顶部指标汇总 —— */
  const profitPct = (cyq.profitRatio * 100).toFixed(1);
  const tone = cyq.profitRatio >= 0.7 ? '#5CD66F' : cyq.profitRatio >= 0.45 ? '#FFD166' : cyq.profitRatio >= 0.3 ? '#F59E0B' : '#EF4444';
  g.fillStyle = tone; g.font = 'bold 10px -apple-system,sans-serif';
  g.textAlign = 'right';
  g.fillText('获利盘 ' + profitPct + '%', w - padR - 2, padT + 10);

  /* 集中度（值越小说明筹码越集中）*/
  const concPct = (cyq.concentrated * 100).toFixed(1);
  g.fillStyle = 'rgba(255,255,255,.45)'; g.font = '9px -apple-system,sans-serif';
  g.fillText('集中度 ' + concPct + '%', w - padR - 2, padT + 22);
}

/* ---------------- 筹码形态分析 + 入场/出场建议 ---------------- */
/**
 * 输入：cyqDistribution() 的返回值
 * 输出：{ shape, shapeName, shapeDesc, entryZone, stopLossZone, targetZone,
 *         suggestion, confidence, flags, risks,
 *         entryPriceLow, entryPriceHigh, stopLoss, target,
 *         peakPrice, peakWeight, profitRatio, avgCost, concentrated }
 */
function cyqAdvice(x) {
  const cyq = cyqDistribution(x.bars, x.bars.length - 1);
  if (!cyq) return null;

  const { prices, weights, currentPrice: cur, avgCost, profitRatio, concentrated, p10, p90 } = cyq;

  /* 1. 找峰值（最重筹码价位） */
  let peakIdx = 0, peakW = weights[0];
  for (let j = 1; j < weights.length; j++) if (weights[j] > peakW) { peakW = weights[j]; peakIdx = j; }
  const peakPrice = prices[peakIdx];
  const peakPct = peakW * 100;

  /* 2. 找第二峰（次峰，至少间隔 5 档） */
  let peak2Idx = -1, peak2W = 0;
  for (let j = 0; j < weights.length; j++) {
    if (Math.abs(j - peakIdx) < 5) continue;
    if (weights[j] > peak2W) { peak2W = weights[j]; peak2Idx = j; }
  }
  const hasDoublePeak = peak2W >= peakW * 0.55 && peak2Idx >= 0;
  const peakGapPct = Math.abs(peakPrice - (peak2Idx >= 0 ? prices[peak2Idx] : peakPrice)) / cur;

  /* 3. 特征变量 */
  const profitPct = profitRatio * 100;
  const concPct = concentrated * 100;
  const curVsCost = (cur / avgCost - 1) * 100;       /* 现价相对平均成本偏离 */
  const curVsPeak = (cur / peakPrice - 1) * 100;     /* 现价相对峰位偏离 */
  const curInBand = cur >= p10 && cur <= p90;        /* 现价是否在 CYQ90 密集区 */
  const peakNearLow = peakPrice <= (p10 + p90) / 2 * 0.98;  /* 峰是否偏下（低成本区）*/
  const peakNearHigh = peakPrice >= (p10 + p90) / 2 * 1.02; /* 峰是否偏上（高成本区）*/
  const costAbovePeak = avgCost > peakPrice * 1.02;   /* 平均成本高于峰位 → 有人被套 */
  const costBelowPeak = avgCost < peakPrice * 0.98;   /* 平均成本低于峰位 → 有人获利 */

  const flags = [], risks = [];
  let shape = '', shapeName = '', shapeDesc = '';

  /* —— 4. 形态分类 —— */

  /* 条件：筹码集中度足够高（concentrated < 35% 即 90% 筹码分布宽度 < 35%）*/
  const dense = concPct < 25;
  const midConcent = concPct < 35;
  const scattered = concPct >= 40;

  if (scattered) {
    /* 形态 A：筹码发散 */
    shape = 'scattered';
    shapeName = '筹码发散';
    shapeDesc = '筹码在宽幅区间内分散，多空分歧大，无明显主力控盘迹象';
    risks.push('筹码分散，方向不明');
  } else if (hasDoublePeak && peakGapPct > 0.08) {
    /* 形态 B：双峰/多峰 */
    shape = 'bimodal';
    shapeName = '双峰震荡';
    shapeDesc = '两个明显筹码峰，上下分别代表套牢盘和获利盘，股价可能在两峰之间来回震荡';
    flags.push('双峰结构：上下峰约 ' + fmt(peakGapPct * 100, 1) + '% 间距');
  } else if (profitPct < 30 && dense && curVsCost < 0) {
    /* 形态 C：底部密集 */
    shape = 'bottom';
    shapeName = '底部密集峰';
    shapeDesc = '筹码高度集中在当前价位下方，获利盘极少，典型的底部吸筹形态';
    flags.push('底部密集 + 获利盘 ' + fmt(profitPct, 0) + '% 接近冰点');
  } else if (profitPct >= 25 && profitPct <= 50 && midConcent && curVsCost > -3 && curVsCost < 3) {
    /* 形态 D：中位中继 */
    shape = 'midconsolidation';
    shapeName = '中位密集中继';
    shapeDesc = '筹码在中位价位密集，多空博弈接近平衡，是典型的上升中继或蓄势待发形态';
    flags.push('平均成本 ' + fmt(avgCost) + ' ≈ 现价 ' + fmt(cur) + '，筹码稳定');
  } else if (profitPct > 75 && dense && curVsCost > 0) {
    /* 形态 E：高位密集派发 */
    shape = 'topdistribute';
    shapeName = '高位密集派发';
    shapeDesc = '大量筹码已获利，现价接近高位密集区，主力可能在边拉边派';
    risks.push('获利盘 ' + fmt(profitPct, 0) + '% 过高，兑现压力大');
  } else if (profitPct > 85 && midConcent) {
    /* 形态 F：顶部出货 */
    shape = 'topexit';
    shapeName = '顶部出货形态';
    shapeDesc = '绝大多数筹码获利且高度集中在高位，是典型的顶部出货信号';
    risks.push('获利盘 ' + fmt(profitPct, 0) + '%，几乎所有持仓都在盈利，抛压随时释放');
  } else if (profitPct >= 45 && profitPct <= 75 && dense && curVsPeak > 0 && curInBand) {
    /* 形态 G：突破前蓄势 */
    shape = 'breakout';
    shapeName = '突破前蓄势';
    shapeDesc = '筹码密集区支撑现价，获利盘比例健康（45-75%），有向上突破可能';
    flags.push('筹码密集支撑现价，获利盘比例均衡');
  } else if (profitPct < 40 && midConcent && !curInBand) {
    /* 形态 H：现价跌破密集区 */
    shape = 'breakdown';
    shapeName = '跌破密集支撑';
    shapeDesc = '现价已跌破主要筹码密集区下沿，套牢盘集中，短期内面临抛压';
    risks.push('现价 ' + fmt(cur) + ' < CYQ90 下沿 ' + fmt(p10) + '，密集区失守');
  } else {
    /* 兜底：中性整理 */
    shape = 'neutral';
    shapeName = '中性整理';
    shapeDesc = '筹码无明显特征，建议等待更清晰的形态再介入';
    flags.push('形态不清晰，建议观望');
  }

  /* 5. 入场 / 出场建议 */
  /* 通用锚位 */
  const cyq30 = p10 + (p90 - p10) * 0.2;
  const cyq50 = p10 + (p90 - p10) * 0.5;
  const cyq70 = p10 + (p90 - p10) * 0.8;

  let entryZone = '', stopLoss = '', targetZone = '';
  let suggestion = '';
  let confidence = '中';

  switch (shape) {
    case 'bottom':
      entryZone = fmt(p10) + ' – ' + fmt(peakPrice);
      stopLoss = fmt(p90);
      targetZone = fmt(peakPrice) + ' – ' + fmt(p90);
      suggestion = '底部密集 + 获利盘冰点，是理想的中长期建仓区域。可分批在 CYQ10 到峰位之间吸筹，止损设在 CYQ90 上沿';
      confidence = '高';
      break;
    case 'midconsolidation':
      entryZone = fmt(cyq30) + ' – ' + fmt(cyq50);
      stopLoss = fmt(p10);
      targetZone = fmt(cyq70) + ' – ' + fmt(p90);
      suggestion = '中位密集，是上升中继信号。加仓等回踩 CYQ30~CYQ50 支撑区，跌破 CYQ90 下沿离场';
      confidence = '中';
      break;
    case 'breakout':
      entryZone = fmt(cur) + ' – ' + fmt(cyq70);
      stopLoss = fmt(p10);
      targetZone = fmt(p90) + ' – ' + fmt(p90 + (p90 - p10) * 0.3);
      suggestion = '筹码密集 + 现价在密集带上沿，有突破概率。放量站上 CYQ70 确认后追入，跌破 CYQ90 下沿止损';
      confidence = '中';
      break;
    case 'bimodal':
      entryZone = fmt(prices[peak2Idx >= 0 ? Math.min(peakIdx, peak2Idx) : peakIdx]) + ' 附近';
      stopLoss = fmt(p10);
      targetZone = fmt(prices[peak2Idx >= 0 ? Math.max(peakIdx, peak2Idx) : peakIdx]) + ' 附近';
      suggestion = '双峰震荡，适合区间策略。在下峰低吸、上峰高抛，止损设在 CYQ90 外';
      confidence = '中低';
      break;
    case 'topdistribute':
      entryZone = '观望';
      stopLoss = fmt(cyq30);
      targetZone = '减仓区：' + fmt(cyq70) + ' – ' + fmt(p90);
      suggestion = '高位密集派发现象，建议逐步减仓锁定利润。若持有，止损设在 CYQ30';
      confidence = '中高';
      break;
    case 'topexit':
      entryZone = '观望，切勿追高';
      stopLoss = fmt(p90);
      targetZone = '清仓区';
      suggestion = '顶部出货形态，几乎所有筹码都在高位获利，随时可能出现集中抛售。建议清仓离场';
      confidence = '高';
      break;
    case 'breakdown':
      entryZone = '观望，等企稳';
      stopLoss = '—';
      targetZone = fmt(p10) + ' – ' + fmt(cyq30);
      suggestion = '跌破密集区支撑，短期内抛压较大。等回踩 CYQ10~CYQ30 企稳出现止跌信号后再考虑抄底';
      confidence = '中';
      break;
    case 'scattered':
      entryZone = '观望';
      stopLoss = '—';
      targetZone = '等待重新密集';
      suggestion = '筹码发散说明多空分歧大，方向不明。等待重新出现集中形态（集中度 < 25%）再介入';
      confidence = '低';
      break;
    default: /* neutral */
      entryZone = '观望';
      stopLoss = fmt(p10);
      targetZone = fmt(p90);
      suggestion = '筹码形态中性，建议观望等待更清晰的趋势信号';
      confidence = '低';
  }

  return {
    shape, shapeName, shapeDesc,
    entryZone, stopLoss, targetZone,
    suggestion, confidence, flags, risks,
    /* 关键价位（数字，方便 detail 页格式化）*/
    entryLow: prices[0], entryHigh: prices[prices.length - 1],
    stopLossNum: stopLoss ? (stopLoss.replace(/[^0-9.]/g, '') ? parseFloat(stopLoss.replace(/[^0-9.]/g, '')) : null) : null,
    targetNum: null,
    peakPrice, peakWeightPct: peakPct,
    profitRatio, avgCost, concentrated,
    p10, p90, curPrice: cur
  };
}

function drawDetailCharts(x) {
  const p = $('#cPrice'), m = $('#cMacd'), k = $('#cKdj'), cq = $('#cCyq');
  if (!p || !m || !k) return;
  drawPrice(p, x, 90);
  drawMACD(m, x, 90);
  drawKDJ(k, x, 90);
  if (cq) drawCyq(cq, x);
}

/* ---------------- 事件绑定 ---------------- */
function bindEvents() {
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (!b) return;
    state.tab = b.dataset.tab;
    if (state.tab === 'strategy') state.search = '';
    render();
    /* 切到竞价页：任何时段无当日数据都自动拉取一次；竞价中启动 10 秒自动刷新 */
    if (state.tab === 'auction') {
      const ph = auctionPhase();
      if (!state.auction.rows.length || state.auction.date !== dayStr(new Date())) runAuctionScan();
      if (ph === 'calling' || ph === 'frozen') startAuctionTimer();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  let timer = 0;
  $('#searchInput').addEventListener('input', e => {
    state.search = e.target.value.trim();
    clearTimeout(timer);
    timer = setTimeout(() => { if (state.tab === 'long' || state.tab === 'short') renderList(); }, 180);
  });

  $('#industryRow').addEventListener('click', e => {
    const b = e.target.closest('.fchip');
    if (!b) return;
    state.ind = b.dataset.ind;
    $$('.fchip', $('#industryRow')).forEach(x => x.classList.toggle('active', x.dataset.ind === state.ind));
    renderList();
  });

  $('#list').addEventListener('click', e => {
    const el = e.target.closest('[data-code]');
    if (!el) return;
    const mode = state.tab === 'short' ? 'short' : 'long';
    openDetail(el.dataset.code, mode);
  });

  $('#refreshBtn').addEventListener('click', () => {
    if (state.loading) return;
    fetchAll({});
  });

  $('#cancelLoad').addEventListener('click', () => {
    showOverlay(false);
    toast('已隐藏进度，后台继续更新');
  });

  $('#sheetPanel').addEventListener('click', e => {
    if (e.target.closest('.sheet-close')) { closeDetail(); return; }
    const seg = e.target.closest('.seg button');
    if (seg && state.detail) {
      state.detail.mode = seg.dataset.m;
      renderDetail();
      return;
    }
    const star = e.target.closest('.star-btn');
    if (star) {
      toggleWatch(star.dataset.code);
      renderDetail();
    }
  });

  $('.sheet-bg').addEventListener('click', closeDetail);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.detail) closeDetail();
  });

  let rt = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (state.detail && $('#cPrice')) drawDetailCharts(state.data[state.detail.code]);
      drawSparks();
    }, 200);
  });
}

/* ---------------- 启动 ---------------- */
function render() {
  renderTabs();
  renderRegime();
  const isStrategy = state.tab === 'strategy';
  $('#toolbar').classList.toggle('hide', isStrategy);
  if (isStrategy) renderStrategy();
  else if (state.tab === 'watch') renderWatch();
  else if (state.tab === 'review') renderReview();
  else if (state.tab === 'auction') renderAuction();
  else renderList();
  const n = Object.keys(state.data).length;
  const scope = state.marketTotal && n
    ? '全市场 ' + state.marketTotal + ' 只初筛 · 深度分析 ' + n + ' 只'
    : '扫描 ' + n + ' 只';
  $('#subtitle').textContent = n
    ? scope + ' · ' + (state.lastDate || '') + (IS_FILE ? ' · 本地直开' : ' · 多因子') + (state.autoTimer ? ' · 60s 自刷' : '')
    : 'KDJ · MACD · RSI · ATR 多因子';
}

function marketOpen() {
  const d = new Date();
  if (d.getDay() === 0 || d.getDay() === 6) return false;
  const hm = d.getHours() * 60 + d.getMinutes();
  return hm >= 555 && hm <= 905;
}

/* 交易时段每 60 秒自动拉一次报价并重算评分（页面隐藏时暂停） */
function stopAutoRefresh() {
  if (state.autoTimer) { clearInterval(state.autoTimer); state.autoTimer = 0; }
}
function startAutoRefresh() {
  stopAutoRefresh();
  if (!marketOpen()) return;
  state.autoTimer = setInterval(() => {
    if (document.hidden || state.loading) return;
    if (!marketOpen()) { stopAutoRefresh(); return; }
    quickQuote(true);
  }, 60000);
}

/* 集合竞价阶段自动刷新快照（9:15–9:25 每 10s，9:25 后定格） */
function stopAuctionTimer() {
  if (state.auctionTimer) { clearInterval(state.auctionTimer); state.auctionTimer = 0; }
}
function startAuctionTimer() {
  stopAuctionTimer();
  const ph = auctionPhase();
  if (ph !== 'calling') return;
  state.auctionTimer = setInterval(() => {
    if (document.hidden) return;
    const p = auctionPhase();
    if (p === 'frozen' || p === 'open') { stopAuctionTimer(); runAuctionScan(); return; }
    if (!state.auction.frozen) runAuctionScan();
  }, 10000);
}

async function init() {
  loadWatch();
  loadAuction();
  loadBacktest();
  loadLongBacktest();
  loadNorth();
  loadLimitStats();
  bindEvents();
  const pack = await readCache();
  if (pack) {
    applyCache(pack);
    render();
    const age = Date.now() - (pack.ts || 0);
    const stale = (state.lastDate || '') < lastTradingDate();
    if (stale || marketOpen() || age > 6 * 3600 * 1000) fetchAll({ silent: true });
    else toast('已加载本机缓存 · 点刷新可更新', 2200);
  } else {
    render();
    fetchAll({});
  }
  startAutoRefresh();
  startAuctionTimer();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopAutoRefresh(); stopAuctionTimer(); }
    else { startAutoRefresh(); startAuctionTimer(); }
  });
}

/* PWA：注册 Service Worker，支持「添加到主屏幕」与断网时打开已缓存界面 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
  });
}

init();

</script>
