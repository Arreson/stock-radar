/* 胜率/均收益：优先用当前浏览器回测（牛熊分池），否则回落 12 年实测基准（按牛熊分池） */
const HOLD_IDX = h => (h === 2 ? 0 : h === 3 ? 1 : 2);
function btPool(setup, marketUp) {
  const bt = state.backtest && state.backtest[setup];
  if (!bt || bt.samples < 5) return null;
  const r = bt.reg && (marketUp === false ? bt.reg.bear : bt.reg.bull);
  if (r && r.n >= 5) return r;
  return { n: bt.samples, wr: [bt.wr2, bt.wr3, bt.wr5], avg: [bt.avgRet2, bt.avgRet3, bt.avgRet5] };
}
function wrFor(setup, holdDays, marketUp) {
  const pool = btPool(setup, marketUp);
  if (pool) return pool.wr[HOLD_IDX(holdDays)];
  const d = SHORT_SETUP[setup] || SHORT_SETUP.weak;
  return marketUp === false ? d.wrBear : d.wrBull;
}
function avgRetFor(setup, holdDays, marketUp) {
  const pool = btPool(setup, marketUp);
  if (pool) return pool.avg[HOLD_IDX(holdDays)];
  const d = SHORT_SETUP[setup] || SHORT_SETUP.weak;
  return marketUp === false ? d.avgBear : d.avgBull;
}

/* 实盘形态归类 + 胜率参考（形态判定与回测引擎共用 classifySetup） */
function setupInfoForShort(x, ctx) {
  const I = x.ind, c = last(I.c);
  const setup = classifySetup(I, x, ctx);
  /* resilient 打分口径（不含量能确认，与历史 scoreShort 权重一致）：仅用于 scoreShort 的降权判断 */
  const resilient = ctx.marketUp === false && slope(I.ma20, 20) > 0 && c > last(I.ma20) &&
    isNum(last(I.ma60)) && c > last(I.ma60) && I.ret20 > 0 &&
    (!ctx.secUp || !x.sector || ctx.secUp[x.sector] !== false);
  const wr = wrFor(setup, 5, ctx.marketUp);
  const avgRet = avgRetFor(setup, 5, ctx.marketUp);
  const wr3 = wrFor(setup, 3, ctx.marketUp);
  const avgRet3 = avgRetFor(setup, 3, ctx.marketUp);
  const S = SHORT_SETUP[setup] || SHORT_SETUP.weak;
  return { setup, setupName: S.name, setupNote: S.note, wr, avgRet, wr3, avgRet3, hold: S.hold, resilient };
}

/* ============ 次日方向概率引擎（12 年 · 49,412 样本条件概率实测） ============
   注意：这是统计概率不是预测保证。全样本基准 = 47.8%，日线条件最多抬到 55~65%。
   基准概率（形态 × 市场）次日收阳概率实测：
     bounce 熊 51.9 / 牛 46.6 | weak 熊 50.8 | trend 熊 48.6 / 牛 47.1
     resilient 熊 48.7 | kdj 熊 48.9 / 牛 45.6 | breakout 熊 43.0 / 牛 43.8
     gap 牛 47.6 | limitStreak≥1 全样本 54.8
   调整项（pp 加性，均为实测偏离）：
     bearGold 叠加 bounce +13.1 → 65.0%（n=294）；bearGold 叠加 weak +5.3；bearGold 通用 +5
     trend 熊 J<20 +8.5；trend J>80 -4.0；kdj 熊+放量 -10.4（危险信号）
     bounce 熊+放量 +3.8；limitStreak≥1 +7.0 */
const NEXT_DAY_BASE = {
  bounce:    { bull: 46.6, bear: 51.9 },
  weak:      { bull: 46.5, bear: 50.8 },
  trend:     { bull: 47.1, bear: 48.6 },
  resilient: { bull: 48.0, bear: 48.7 },
  kdj:       { bull: 45.6, bear: 48.9 },
  breakout:  { bull: 43.8, bear: 43.0 },
  gap:       { bull: 47.6, bear: 50.0 },
  limitup:   { bull: 54.8, bear: 54.8 }
};
function nextDayForecast(x, ctx, setup) {
  const I = x.ind;
  if (!I || !I.c || !I.c.length) return null;
  const base = (NEXT_DAY_BASE[setup] || NEXT_DAY_BASE.weak)[ctx.marketUp === false ? 'bear' : 'bull'];
  let p = base;
  const notes = [];
  /* bearGold 叠加：bounce 效果最强 */
  if (ctx.bearGold) {
    const lift = setup === 'bounce' ? 13.1 : setup === 'weak' ? 5.3 : 5.0;
    p += lift; notes.push('黄金窗口 +' + lift.toFixed(0) + 'pp');
  }
  /* KDJ 位置 */
  const J = last(I.J);
  if (setup === 'trend' && ctx.marketUp === false && J < 20) { p += 8.5; notes.push('低位趋势 +' + 8.5 + 'pp'); }
  else if ((setup === 'trend' || setup === 'breakout' || setup === 'gap') && J > 80) { p -= 4.0; notes.push('J 值超买 -4pp'); }
  /* 量能：kdj 熊市放量是危险信号，bounce 放量是确认 */
  const vr = last(I.vol5) > 0 ? last(I.v) / last(I.vol5) : 1;
  if (setup === 'kdj' && ctx.marketUp === false && vr >= 1.5) { p -= 10.4; notes.push('放量拐点多为假信号 -10pp'); }
  else if (setup === 'bounce' && ctx.marketUp === false && vr >= 1.5) { p += 3.8; notes.push('放量超卖确认 +4pp'); }
  /* 连板效应 */
  if (I.limitStreak >= 1) { p += 7.0; notes.push('连板动量 +7pp'); }
  /* 跌停预警 */
  if (I.downLimit20 >= 2) { p -= 4.0; notes.push('近期跌停 -4pp'); }
  p = Math.round(Math.min(66, Math.max(35, p)) * 10) / 10;
  return { prob: p, base, notes: notes.slice(0, 3) };
}

/* 海龟法则：1 单位仓位 = 账户风险预算 1% / (ATR / 价格) */
function atrUnitPos(x, riskPct) {
  const I = x.ind, c = last(I.c), atr = last(I.atr);
  if (!isNum(atr) || atr <= 0 || c <= 0) return 0;
  const unit = (riskPct || 1) / (atr / c);      /* 风险 1% 时，该股可承受的名义仓位% */
  return Math.round(clamp(unit, 2, 25));
}

/* 半凯利：f = (W − (1−W)/R) / 2，W 胜率、R 盈亏比；负值归零 */
function kellyPos(wr, payoff) {
  if (!isNum(wr) || !isNum(payoff) || payoff <= 0) return 0;
  const w = wr / 100;
  const f = (w - (1 - w) / payoff) / 2;
  return Math.round(clamp(f * 100, 0, 20));
}

function longPlan(x) {
  const I = x.ind, c = last(I.c), atr = last(I.atr) || c * 0.03;
  const ma20 = last(I.ma20) || c, ma60 = last(I.ma60) || c, ma120 = last(I.ma120) || c;
  const lo = Math.min(c, ma20) * 0.97, hi = Math.max(c, ma20) * 1.02;
  /* 结构止损：优先用最近确认摆动低点，其次年线 */
  const structStop = isNum(I.swingLow) ? I.swingLow - 0.5 * atr : null;
  const stop = structStop && structStop < c
    ? Math.max(structStop, c * 0.75)
    : Math.min(ma120 * 0.97, c * 0.88);
  const up = atrUnitPos(x, 1);
  return [
    ['建仓区间', fmt(lo) + ' – ' + fmt(hi)],
    ['加仓参考', '回踩 60 日线 ' + fmt(ma60) + '（分批，每批不超 1 单位）'],
    ['止损位', fmt(stop) + '（跌破' + (structStop && structStop < c ? '前低/结构位' : '年线') + '）'],
    ['持有周期', '6 – 18 个月'],
    ['建议仓位', (up ? up : 20) + '%（按 1% 风险预算的 ATR 单位）'],
    ['跟踪信号', '周线 MACD 死叉离场']
  ];
}

function shortPlan(x, o) {
  o = o || {};
  const I = x.ind, c = last(I.c), atr = last(I.atr) || c * 0.03;
  const ma5 = last(I.ma5) || c;
  const atrp = atr / c;

  /* 结构止损：2×ATR 与最近摆动低点取更近者，且不松于 -7% */
  const atrStop = c - 2 * atr;
  const structStop = isNum(I.swingLow) && I.swingLow < c ? I.swingLow - 0.5 * atr : null;
  const stop = Math.max(structStop ? Math.max(atrStop, structStop) : atrStop, c * 0.93);
  const stopPct = (1 - stop / c) * 100;

  const setupKey = o.setup || 'trend';
  const setup = SHORT_SETUP[setupKey] || SHORT_SETUP.trend;

  /* 仓位：ATR 单位（1% 风险）与半凯利取较小值；凯利为 0 表示负期望，只给 3% 试探仓 */
  const payoff = setupKey === 'resilient' ? 1.6 : setupKey === 'breakout' ? 1.5 : 1.2;
  const atrUnit = atrUnitPos(x, 1) || 15;
  const realWr = wrFor(setupKey, 3, o.marketUp !== false);
  const kelly = kellyPos(realWr, payoff);
  let pos = Math.min(atrUnit, kelly > 0 ? kelly : 3);
  if (o.marketDown) pos = Math.round(Math.max(2, pos * 0.6));
  pos = Math.round(clamp(pos, 3, 20));

  return [
    ['持有周期', setup.hold],
    ['参考买点', fmt(c) + '（回踩 5 日线 ' + fmt(ma5) + ' 更佳）'],
    ['止损纪律', '收盘跌破 ' + fmt(stop) + '（约 -' + fmt(stopPct, 1) + '%）'],
    ['止盈方式', '回测最优：TP+8% 主动止盈（10 日内触及即卖）；未触及则跌破 3 日线离场'],
    ['时间止损', '3 个交易日不创新高即撤'],
    ['建议仓位', pos + '%（ATR 单位 ' + atrUnit + '% · 半凯利 ' + kelly + '%' + (o.marketDown ? ' · 大盘下行×0.6' : '') + '）']
  ];
}

/* ---------------- 自选股长期跟踪建议引擎 ---------------- */
function watchAdvice(x, meta) {
  if (!x || !x.ind || !x.bars || x.bars.length < 60) return null;
  const I = x.ind, c = last(I.c);
  if (!isNum(c) || c <= 0) return null;

  const anchor = meta && isNum(meta.anchorPrice) && meta.anchorPrice > 0 ? meta.anchorPrice : null;
  const pct = anchor != null ? (c / anchor - 1) * 100 : null;
  /* 持仓：股数 × 成本价 */
  const shares = meta && isNum(meta.shares) && meta.shares > 0 ? Math.round(meta.shares) : 0;
  const mv = shares ? c * shares : 0;
  const pnl = shares && anchor != null ? (c - anchor) * shares : 0;

  const ma20 = last(I.ma20), ma60 = last(I.ma60), ma120 = last(I.ma120);
  const rsi = last(I.r6);   /* RSI(6)，analyze 输出的字段名是 r6 / r14 */
  const kdjJ = I.J != null ? last(I.J) : null;
  const hist = last(I.hist);
  const prevHist = I.hist && I.hist.length >= 2 ? I.hist[I.hist.length - 2] : null;

  const flags = [];
  const risks = [];
  let score = 0;

  /* —— 1. 浮盈/浮亏（锚定价维度）—— */
  if (pct != null) {
    if (pct >= 15) { score += 25; flags.push('自选以来 +15%↑'); }
    else if (pct >= 10) { score += 20; flags.push('自选以来 +10%↑'); }
    else if (pct >= 5)  { score += 12; flags.push('自选以来 +5%'); }
    else if (pct >= -3) { score += 5;  flags.push('自选以来 ±3%'); }
    else if (pct >= -5) { score -= 5;  risks.push('自选以来 -5%'); }
    else if (pct >= -10){ score -= 18; risks.push('自选以来 -10%'); }
    else                { score -= 30; risks.push('自选以来 -10%+ 需要重估'); }
  }

  /* —— 1b. 持仓风控（填了股数才生效）—— */
  if (shares && pct != null) {
    if (pct <= -8) { score -= 8; risks.push('持仓浮亏 ' + fmt(pct, 1) + '% 触发风控线'); }
    else if (pct <= -5 && pct > -8) { score -= 3; }
    if (pct >= 12 && isNum(last(I.ma20)) && c < last(I.ma20)) { score -= 6; risks.push('高位回落跌破 20 日线'); }
    if (pnl >= 0 && pct >= 8 && isNum(last(I.ma20)) && c > last(I.ma20)) { score += 6; flags.push('持仓盈利且守住 20 日线'); }
  }

  /* —— 2. 均线多空结构 —— */
  const has3 = isNum(ma20) && isNum(ma60) && isNum(ma120);
  if (has3 && c > ma20 && c > ma60 && c > ma120) { score += 18; flags.push('三线多头排列'); }
  else if (has3 && c < ma20 && c < ma60)         { score -= 15; risks.push('跌破 20/60 日线'); }
  if (isNum(ma20) && isNum(ma60)) {
    if (ma20 > ma60) score += 8; else score -= 6;
  }

  /* —— 3. RSI —— */
  if (isNum(rsi)) {
    if (rsi > 75)      { score -= 12; risks.push('RSI 超买 ' + fmt(rsi, 0)); }
    else if (rsi > 70) { score -= 6;  risks.push('RSI 偏高 ' + fmt(rsi, 0)); }
    else if (rsi < 30) { score += 10; flags.push('RSI 超卖 ' + fmt(rsi, 0)); }
    else if (rsi > 50) { score += 5; }
    else               { score -= 3; }
  }

  /* —— 4. MACD 柱线 —— */
  if (isNum(hist)) {
    if (hist > 0 && (prevHist == null || hist > prevHist)) { score += 8; flags.push('MACD 红柱放大'); }
    else if (hist > 0 && prevHist != null && hist < prevHist) { score += 2; risks.push('MACD 红柱缩小'); }
    else if (hist < 0 && prevHist != null && hist > prevHist) { score += 6; flags.push('MACD 绿柱收敛'); }
    else if (hist < 0 && prevHist != null && hist < prevHist) { score -= 8; risks.push('MACD 绿柱放大'); }
  }

  /* —— 5. 道氏趋势结构（analyze 已算）—— */
  if (I.structure === 'up')   { score += 10; flags.push('上升结构'); }
  else if (I.structure === 'down') { score -= 12; risks.push('下降结构'); }

  /* —— 6. 量价 —— */
  if (I.volDiverge) { score -= 8; risks.push('量价顶背离'); }

  /* —— 7. 周线动能 —— */
  const wDif = I.wDif != null ? last(I.wDif) : null;
  const wDea = I.wDea != null ? last(I.wDea) : null;
  if (isNum(wDif) && isNum(wDea)) {
    if (wDif > wDea && wDif > 0) { score += 8; flags.push('周线多头'); }
    else if (wDif < wDea && wDif < 0) { score -= 8; risks.push('周线空头'); }
  }

  /* —— 8. 筹码形态（cyqAdvice 融合）—— */
  let cyqShape = null, cyqShapeName = null;
  try {
    const ca = cyqAdvice(x);
    if (ca) {
      cyqShape = ca.shape;
      cyqShapeName = ca.shapeName;
      const profitPct = ca.profitRatio * 100;
      const concPct = ca.concentrated * 100;
      const curVsCostPct = (ca.curPrice / ca.avgCost - 1) * 100;
      switch (ca.shape) {
        case 'bottom':
          score += 18; flags.push('底部密集峰'); break;
        case 'midconsolidation':
          score += 10; flags.push('中位密集中继'); break;
        case 'breakout':
          score += 14; flags.push('筹码突破蓄势'); break;
        case 'bimodal':
          if (profitPct < 40) { score += 6; flags.push('双峰低位可区间'); }
          else { score -= 2; risks.push('双峰高位分歧'); }
          break;
        case 'topdistribute':
          score -= 15; risks.push('高位密集派发'); break;
        case 'topexit':
          score -= 25; risks.push('顶部出货形态'); break;
        case 'breakdown':
          score -= 18; risks.push('跌破密集支撑'); break;
        case 'scattered':
          score -= 3; risks.push('筹码发散方向不明'); break;
      }
    }
  } catch (e) { /* cyqAdvice 内部出错时降级，不影响 watchAdvice 其他维度 */ }

  score = clamp(Math.round(score), -100, 100);

  /* —— verdict + suggestion —— */
  let verdict, suggestion, tone;
  if (score >= 30) {
    verdict = '顺势持有'; tone = 'strong';
    if (pct != null && pct >= 5) {
      suggestion = '已有浮盈 +' + fmt(pct, 1) + '%，移动止损到 MA20（' + fmt(ma20) + '），让利润奔跑';
    } else {
      suggestion = '趋势向好，可继续持有；止损参考 MA20（' + fmt(ma20) + '）';
    }
  } else if (score >= 10) {
    verdict = '继续观察'; tone = 'ok';
    suggestion = '信号中性偏多，关注 MA20（' + fmt(ma20) + '）支撑与 MACD 柱线方向';
  } else if (score >= -10) {
    verdict = '观望'; tone = 'mid';
    suggestion = '信号中性，暂不加仓；等突破方向或明确形态后再决策';
  } else if (score >= -30) {
    verdict = '考虑减仓'; tone = 'warn';
    suggestion = (pct != null ? '浮亏 ' + fmt(pct, 1) + '%，' : '') + '动能走弱；建议减仓至半仓，破 MA60（' + fmt(ma60) + '）则清仓';
  } else {
    verdict = '建议止损'; tone = 'bad';
    suggestion = '多重信号恶化；建议止损出局，等待重新站回 MA20 再评估';
  }

  return {
    verdict, suggestion, tone, score, flags, risks, pct, anchor,
    shares, mv, pnl,
    anchorDate: meta ? meta.anchorDate : null,
    ma20: fmt(ma20), ma60: fmt(ma60), ma120: fmt(ma120),
    rsi: isNum(rsi) ? fmt(rsi, 0) : '—',
    structure: I.structure || '—',
    cyqShape, cyqShapeName
  };
}

function scoreAll() {
  const list = Object.values(state.data).filter(x => x.ind && x.bars.length >= 260);
  if (!list.length) return;
  const ctx = buildContext(list);
  const sec = sectorStats(list);
  ctx.secRank = sec.rank;
  ctx.secUp = sec.up;
  ctx.marketUp = marketTrendUp();
  state.marketUp = ctx.marketUp;
  /* 大盘黄金窗口/阴跌状态（主流程统一在此计算，与 ensureWatchStock 口径一致） */
  const _ix = state.indexes && state.indexes['sh000001'];
  if (_ix && _ix.bars && _ix.bars.length >= 260) {
    const iC = _ix.bars.map(b => b.c), iV = _ix.bars.map(b => b.v || 0);
    const iMa60 = SMA(iC, 60), iVolMa20 = SMA(iV, 20);
    const li = iC.length - 1;
    const ivr = (iVolMa20[li] > 0) ? (iV[li] / iVolMa20[li]) : 1;
    ctx.bearGold = iC[li] < iMa60[li] && ivr >= 1.1;
    ctx.bearTight = iC[li] < iMa60[li] && ivr < 0.6;
    state.bearGold = ctx.bearGold;
    state.bearTight = ctx.bearTight;
  }
  /* 融资融券杠杆情绪（路线B：fetchMarginSentiment 异步填充 state.margin） */
  if (state.margin && isNum(state.margin.chg5d)) ctx.margin5d = state.margin.chg5d;
  /* 北向十大活跃股（T 日盘后发布，热度信号无方向） */
  if (state.north && state.north.top10) ctx.north10 = state.north.top10;
  list.forEach(x => { x.long = scoreLong(x, ctx); x.short = scoreShort(x, ctx); });
  state.scoredCount = list.length;
}

/* ---------------- 行情抓取与缓存 ---------------- */
function shToday() {
  try {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  } catch (e) {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
}

function dayFromStr(s) {
  if (!s || s.length < 10) return null;
  const p = s.slice(0, 10).split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
}

function dayStr(d) { return d.toISOString().slice(0, 10); }

function dayGap(a, b) {
  const x = dayFromStr(a), y = dayFromStr(b);
  if (!x || !y) return 0;
  return Math.round((y - x) / 86400000);
}

function lastTradingDate() {
  let d = dayFromStr(shToday()) || new Date();
  for (let i = 0; i < 12; i++) {
    const w = d.getUTCDay();
    if (w >= 1 && w <= 5) return dayStr(d);
    d = new Date(d.getTime() - 86400000);
  }
  return dayStr(d);
}

function parseQt(x) {
  const q = x.qt || [];
  const n = i => { const v = parseFloat(q[i]); return isFinite(v) ? v : NaN; };
  const qn = (q[1] || '').replace(/\s+/g, '');
  if (qn) x.name = qn;
  x.price = n(3);
  const bars = x.bars;
  const c = last(bars).c, prev = bars[bars.length - 2] ? bars[bars.length - 2].c : c;
  if (!isNum(x.price) || x.price <= 0) x.price = c;
  x.pct = n(32);
  if (!isNum(x.pct)) x.pct = prev ? (c / prev - 1) * 100 : 0;
  x.turnover = n(38);
  x.pe = n(39);
  x.pb = n(46);
  x.mcap = n(45);
  x.amount = n(37);
  x.volratio = n(49);
}

function buildEntry(meta, raw) {
  const bars = raw.bars;
  const x = {
    code: meta.code, name: meta.name, sector: meta.ind,
    bars, qt: raw.qt || [],
    lastDate: last(bars).d
  };
  x.ind = analyze(bars);
  parseQt(x);
  x.hi52 = Math.max(...bars.slice(-250).map(b => b.h));
  x.lo52 = Math.min(...bars.slice(-250).map(b => b.l));
  return x;
}

/* 代码 -> 元信息（优先本次扫描结果，其次内置样本池） */
function metaOf(code) {
  if (state.meta[code]) return { code, name: state.meta[code].name, ind: state.meta[code].ind };
  const u = UNIVERSE.find(v => v.code === code);
  return u ? { code: u.code, name: u.name, ind: u.ind } : null;
}

async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || 10000);
  try {
    const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res;
  } finally {
    clearTimeout(timer);
  }
}

/* 分钟级信号分析 —— 从 5 分钟/1 分钟 K 线计算 A 股实盘独有因子 */
function analyzeMinute(minBars, dailyI) {
  if (!minBars || !minBars.length || minBars.length < 5) return null;
  const B = minBars;
  const c = B.map(b => b.c), h = B.map(b => b.h), l = B.map(b => b.l), v = B.map(b => b.v), amt = B.map(b => b.amt);
  const N = B.length;
  const open0 = B[0].o, closeN = last(c);

  /* 1. VWAP（成交均价）：sum(amt) / sum(vol)，amt 单位=元 vol 单位=手 → 需 ×100 转成股 */
  const totalAmt = amt.reduce((s, x) => s + (x || 0), 0);
  const totalVol = v.reduce((s, x) => s + (x || 0), 0);
  const vwap = totalVol > 0 && totalAmt > 0 ? totalAmt / (totalVol * 100) : null;
  const vwapDiv = vwap != null && vwap > 0 ? closeN / vwap - 1 : 0;
  /* VWAP 斜率（最近 20 分钟）：线性回归 */
  const tailN = Math.min(20, N);
  const tailAmtArr = amt.slice(-tailN), tailVolArr = v.slice(-tailN);
  const tailVWAP = (tailAmtArr.reduce((a, b) => a + (b || 0), 0) / (tailVolArr.reduce((a, b) => a + (b || 0), 0) * 100)) || 0;
  const vwapSlope = vwap != null ? (closeN / vwap - 1) * 100 : 0;  /* VWAP 偏离度（%） */

  /* 2. 早盘强弱：9:30~10:00 前 6 根 5分钟K线 */
  const morningEnd = B.findIndex(b => b.t && b.t.includes('10:00'));
  const morningN = morningEnd > 0 ? Math.min(morningEnd + 1, N) : Math.min(7, N);
  const morningRet = B[morningN - 1].c / open0 - 1;
  const morningVolSum = v.slice(0, morningN).reduce((s, x) => s + (x || 0), 0);
  const avgMinVol = totalVol / N;
  const morningVolRatio = avgMinVol > 0 ? (morningVolSum / morningN) / avgMinVol : 1;
  const morningScore = morningRet * 100 + (morningVolRatio - 1) * 3;

  /* 3. 尾盘抢筹：14:00~14:57 累计涨幅 */
  const afternoonStart = B.findIndex(b => b.t && b.t.includes('14:0'));
  let tailRet = 0, tailVol = 0;
  if (afternoonStart > 0) {
    const tail = B.slice(afternoonStart);
    if (tail.length >= 2) {
      tailRet = tail[tail.length - 1].c / tail[0].o - 1;
      tailVol = tail.reduce((s, b) => s + (b.v || 0), 0);
    }
  }
  const tailVolRatio = avgMinVol > 0 ? (tailVol / Math.max(1, N - afternoonStart)) / avgMinVol : 1;
  const tailScore = tailRet * 100 + (tailVolRatio - 1) * 2;

  /* 4. 连续上涨分钟数 */
  let upRun = 0, maxUpRun = 0;
  for (let i = 1; i < N; i++) {
    if (c[i] > c[i - 1]) { upRun++; maxUpRun = Math.max(maxUpRun, upRun); }
    else upRun = 0;
  }

  /* 5. 脉冲次数（量 > 2.5× 均量） */
  const avgV = totalVol / N;
  const spikes = v.filter(x => x > avgV * 2.5).length;
  const spikeRatio = spikes / N;

  /* 6. 影线比例 */
  let upperShadowSum = 0, lowerShadowSum = 0;
  for (let i = 0; i < N; i++) {
    const range = h[i] - l[i];
    if (range <= 0) continue;
    upperShadowSum += (h[i] - Math.max(c[i], B[i].o)) / range;
    lowerShadowSum += (Math.min(c[i], B[i].o) - l[i]) / range;
  }
  const avgUpper = upperShadowSum / N, avgLower = lowerShadowSum / N;

  /* 7. 量价相关性（近 20 分钟）：量增价涨 → 正相关，量增价跌 → 负相关（顶背离） */
  const corrN = Math.min(20, N);
  let xy = 0, x2 = 0, y2 = 0, upMoves = 0, downMoves = 0;
  for (let i = N - corrN + 1; i < N; i++) {
    const dp = c[i] - c[i - 1];
    const dv = v[i] - v[i - 1];
    xy += dp * dv; x2 += dp * dp; y2 += dv * dv;
    if (dp > 0) upMoves++; else if (dp < 0) downMoves++;
  }
  const denom = Math.sqrt(x2 * y2);
  const priceVolCorr = denom > 0 ? xy / denom : 0;

  /* 8. 全天涨跌幅 + 振幅 */
  const dayRet = closeN / open0 - 1;
  const dayRange = (Math.max(...h) - Math.min(...l)) / open0;

  return {
    vwap, vwapSlope, vwapDiv,
    morningRet: morningRet * 100, morningVolRatio, morningScore,
    tailRet: tailRet * 100, tailVolRatio, tailScore,
    upRun, maxUpRun,
    spikes, spikeRatio,
    avgUpper, avgLower,
    priceVolCorr,
    dayRet: dayRet * 100, dayRange: dayRange * 100,
    totalBars: N,
    date: (B[N - 1].t || '').slice(0, 10)  /* 分钟数据所属交易日（VWAP 按此日期计算与展示） */
  };
}

/* 分钟级日内信号评分（叠加到 scoreShort，实盘专用） */
function scoreMinute(minInd, dailyI) {
  if (!minInd) return null;
  let v = 0, note = [];
  /* VWAP 偏离：正偏离（价在均价上）强，负偏离弱 */
  if (minInd.vwapSlope > 0.5) { v += 8; note.push('VWAP 上方 +' + minInd.vwapSlope.toFixed(1) + '%'); }
  else if (minInd.vwapSlope > 0) { v += 4; note.push('VWAP 上方'); }
  else if (minInd.vwapSlope < -0.5) { v -= 6; note.push('VWAP 下方 ' + minInd.vwapSlope.toFixed(1) + '%'); }

  /* 早盘强度：A 股早盘效应最强（9:30-10:00 资金动向最有指导意义） */
  if (minInd.morningScore > 3) { v += 10; note.push('早盘强势 ' + minInd.morningRet.toFixed(1) + '%'); }
  else if (minInd.morningScore > 0) { v += 5; note.push('早盘偏强'); }
  else if (minInd.morningRet < -1 && minInd.morningVolRatio > 1.2) { v -= 5; note.push('早盘放量下跌'); }

  /* 尾盘抢筹 */
  if (minInd.tailScore > 2) { v += 6; note.push('尾盘抢筹 +' + minInd.tailRet.toFixed(1) + '%'); }
  else if (minInd.tailRet < -0.5 && minInd.tailVolRatio > 1.2) { v -= 4; note.push('尾盘放量下杀'); }

  /* 连续上涨 */
  if (minInd.maxUpRun >= 5) { v += 5; note.push('连续上涨 ' + minInd.maxUpRun + ' 根'); }
  else if (minInd.maxUpRun >= 3) { v += 2; }

  /* 量价相关性：正相关=量价配合，负相关=顶/底背离 */
  if (minInd.priceVolCorr > 0.5) { v += 3; note.push('量价配合良好'); }
  else if (minInd.priceVolCorr < -0.3) { v -= 5; note.push('量价背离（警惕）'); }

  /* 脉冲次数 */
  if (minInd.spikeRatio > 0.15 && minInd.dayRet > 0) { v += 4; note.push('资金脉冲 ' + minInd.spikes + ' 次'); }

  /* 上影线过长 = 抛压 */
  if (minInd.avgUpper > 0.5 && minInd.dayRet > 0) { v -= 3; note.push('上影偏长，上方有抛压'); }
  if (minInd.avgLower > 0.4 && minInd.dayRet < 0) { v += 2; note.push('下影较多，下方有承接'); }

  return {
    score: clamp(v, -15, 30),
    notes: note.slice(0, 4),
    /* 关键决策指标（UI 展示用） */
    vwapDivPct: minInd.vwapSlope.toFixed(2),
    morningPct: minInd.morningRet.toFixed(1),
    tailPct: minInd.tailRet.toFixed(1),
    maxUpRun: minInd.maxUpRun,
    dayPct: minInd.dayRet.toFixed(2),
    date: minInd.date || ''
  };
}

/* ========================================
   日线级替代因子（纯日线能算，不依赖分钟数据）
   ======================================== */

/* 换手率粗估：用 amtYi / (mcap * 1e8) 估算。amtYi=今日成交额(亿), mcap=总市值(亿)
   结果是百分比量级（接近真实换手率但总市值偏大，实际换手率应该更高）
   真实换手率需要流通市值字段，东财日线不返回 */
function estTurnoverRate(amtYi, mcap) {
  if (!amtYi || !mcap || mcap <= 0) return null;
  /* amtYi 亿元，mcap 亿元 → 流通市值估 30-70%，取 50% 做粗略 */
  const floatMcap = mcap * 0.5;
  return amtYi / floatMcap * 100;  /* 近似换手率 % */
}

/* 板块共振：同 sector 今日上涨的股票数 / sector 总数
   衡量板块整体热度，分数越高说明板块共振强（A 股"板块效应"极强） */
function sectorResonance(list, sector, date) {
  if (!list || !list.length) return 0.5;
  const same = list.filter(x => x.sector === sector);
  if (!same.length) return 0.5;
  let up = 0;
  for (const x of same) {
    if (!x.bars || !x.bars.length) continue;
    const last = x.bars[x.bars.length - 1];
    const prev = x.bars.length >= 2 ? x.bars[x.bars.length - 2] : last;
    if (last && prev && last.c > prev.c) up++;
  }
  return up / same.length;
}

/* 精细量价背离检测（日线序列）：
   价创 N 日新高但 OBV 未创新高 → 顶背离 → 减分
   价创 N 日新低但 OBV 未创新低 → 底背离 → 加分
   比 analyze() 里 volDiverge 更精细，能识别假突破 */
function checkDivergence(I, N) {
  N = N || 20;
  const cArr = I.c.slice(-N);
  const obvArr = I.obv.slice(-N);
  const hi = Math.max(...cArr);
  const lo = Math.min(...cArr);
  const obvHi = Math.max(...obvArr);
  const obvLo = Math.min(...obvArr);
  const cur = last(I.c), curObv = last(I.obv);
  /* 顶背离：价接近新高但 OBV 远低于新高 */
  const nearHi = cur >= hi * 0.995;
  const obvBelowHi = curObv < obvHi * 0.9;
  const topDiverge = nearHi && obvBelowHi;
  /* 底背离：价接近新低但 OBV 远高于新低 */
  const nearLo = cur <= lo * 1.005;
  const obvAboveLo = curObv > obvLo * 1.1;
  const botDiverge = nearLo && obvAboveLo;
  return { topDiverge, botDiverge };
}

/* 腾讯 UTF-8 脚本通道：返回 v_sh600519="..." 形式全局变量 */
function txScriptQuotes(codes) {
  return new Promise(resolve => {
    const s = document.createElement('script');
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      const out = {};
      for (const c of codes) {
        const v = window['v_' + c];
        if (typeof v === 'string') {
          const f = v.split('~');
          if (f.length >= 46) out[c] = f;
        }
        try { delete window['v_' + c]; } catch (e) { window['v_' + c] = undefined; }
      }
      if (s.parentNode) s.parentNode.removeChild(s);
      resolve(out);
    };
    const timer = setTimeout(finish, 9000);
    s.src = 'https://web.sqt.gtimg.cn/utf8/q=' + codes.join(',');
    s.onload = finish;
    s.onerror = finish;
    document.head.appendChild(s);
  });
}

/* 批量报价：30 只一组；优先 GBK 接口，失败/本地打开时走 UTF-8 脚本通道 */
async function fetchQuotes(codes) {
  const out = {};
  const CH = 30;
  for (let i = 0; i < codes.length; i += CH) {
    const chunk = codes.slice(i, i + CH);
    let ok = false;
    if (!IS_FILE) {
      try {
        const res = await fetchWithTimeout('https://qt.gtimg.cn/q=' + chunk.join(','), 8000);
        const buf = await res.arrayBuffer();
        const txt = new TextDecoder('gbk').decode(buf);
        const re = /v_(\w+)="([^"]*)"/g;
        let m;
        while ((m = re.exec(txt))) {
          const f = m[2].split('~');
          if (f.length >= 46) out[m[1]] = f;
        }
        ok = true;
      } catch (e) { /* 回落脚本通道 */ }
    }
    if (!ok) {
      const alt = await txScriptQuotes(chunk);
      Object.keys(alt).forEach(k => { out[k] = alt[k]; });
    }
    if (i + CH < codes.length) await sleep(70);
  }
  return out;
}

function quoteDay(f) {
  const ts = (f && f[30]) || '';
  return ts.length >= 8 ? ts.slice(0, 4) + '-' + ts.slice(4, 6) + '-' + ts.slice(6, 8) : '';
}

/* 用报价更新最后一根 K 线（当日）或追加新 K 线 */
function applyQuote(x, f) {
  if (!f || f.length < 46) return false;
  const price = parseFloat(f[3]);
  if (!isFinite(price) || price <= 0) return false;
  const day = quoteDay(f);
  if (!day) return false;
  const o = parseFloat(f[5]), h = parseFloat(f[33]), l = parseFloat(f[34]), v = parseFloat(f[6]);
  const bars = x.bars, lb = bars[bars.length - 1];
  if (!lb) return false;
  let changed = false;
  if (lb.d === day) {
    if (lb.c !== price) { lb.c = price; changed = true; }
    if (isFinite(h) && h > 0 && h > lb.h) { lb.h = h; changed = true; }
    if (isFinite(l) && l > 0 && l < lb.l) { lb.l = l; changed = true; }
    if (isFinite(o) && o > 0) lb.o = o;
    if (isFinite(v) && v > 0 && v !== lb.v) { lb.v = v; changed = true; }
  } else if (lb.d < day && isFinite(v) && v > 0) {
    bars.push({
      d: day,
      o: isFinite(o) && o > 0 ? o : price,
      c: price,
      h: isFinite(h) && h > 0 ? h : price,
      l: isFinite(l) && l > 0 ? l : price,
      v
    });
    changed = true;
  }
  x.qt = f;
  parseQt(x);
  if (!changed) return true;
  x.lastDate = last(bars).d;
  x.ind = analyze(bars);
  x.hi52 = Math.max(...bars.slice(-250).map(b => b.h));
  x.lo52 = Math.min(...bars.slice(-250).map(b => b.l));
  return true;
}

/* —— 涨停测算引擎：用本地缓存日线现场计算"开盘涨幅×量比→触板率"，替代硬编码表 ——
   口径与离线回测一致：10% 主板口径、触板=盘中 high ≥ 昨收×1.099、样本不足 30 格回落默认值 */
const LIMIT_STATS_KEY = 'qr_limitstats_v1';
function loadLimitStats() {
  try { const j = JSON.parse(localStorage.getItem(LIMIT_STATS_KEY) || 'null'); if (j && j.cells) state.limitStats = j; } catch (e) {}
}
function saveLimitStats() { try { localStorage.setItem(LIMIT_STATS_KEY, JSON.stringify(state.limitStats)); } catch (e) {} }

function computeLimitUpStats() {
  const t0 = Date.now();
  /* 格：gap 4 桶 × vr 3 桶；hist 组合 5 项 */
  const G = [[1, 3], [3, 6], [6, 9], [9, 99]];
  const V = [[0, 1], [1, 2], [2, 99]];
  const cells = G.map(() => V.map(() => ({ n: 0, hit: 0 })));
  const hist = { ptGapUp: { n: 0, hit: 0 }, ptGapDn: { n: 0, hit:0 }, r15g6: { n: 0, hit: 0 }, r15g3: { n: 0, hit: 0 }, r15g1: { n: 0, hit: 0 } };
  let total = 0, hits = 0;
  for (const code of Object.keys(state.data)) {
    const bars = state.data[code] && state.data[code].bars;
    if (!bars || bars.length < 70) continue;
    for (let i = 61; i < bars.length; i++) {
      const prev = bars[i-1].c, o = bars[i].o, h = bars[i].h;
      if (!prev || !o || !h || prev <= 0) continue;
      total++;
      const limit = prev * 1.099, touch = h >= limit;
      if (touch) hits++;
      const g = (o / prev - 1) * 100;
      const prevTouch = i >= 2 && bars[i-1].h >= bars[i-2].c * 1.099;
      if (prevTouch && g < 0) { hist.ptGapDn.n++; if (touch) hist.ptGapDn.hit++; }
      if (g < 1) continue;
      let vs = 0; for (let j = i - 20; j < i; j++) vs += bars[j].v || 0;
      const vr = (vs / 20) > 0 ? (bars[i].v || 0) / (vs / 20) : 1;
      const gi = G.findIndex(b => g >= b[0] && g < b[1]);
      const vi = V.findIndex(b => vr >= b[0] && vr < b[1]);
      if (gi >= 0 && vi >= 0) { cells[gi][vi].n++; if (touch) cells[gi][vi].hit++; }
      const prevTouch2 = prevTouch;
      const ret5 = i >= 6 ? (bars[i-1].c / bars[i-6].c - 1) * 100 : 0;
      if (prevTouch2 && g >= 1) { hist.ptGapUp.n++; if (touch) hist.ptGapUp.hit++; }
      if (!prevTouch && ret5 >= 15) {
        if (g >= 6) { hist.r15g6.n++; if (touch) hist.r15g6.hit++; }
        else if (g >= 3) { hist.r15g3.n++; if (touch) hist.r15g3.hit++; }
        else { hist.r15g1.n++; if (touch) hist.r15g1.hit++; }
      }
    }
  }
  const rate = b => (b.n >= 30) ? +(b.hit / b.n * 100).toFixed(1) : null;   /* 样本不足返回 null → 回落默认 */
  state.limitStats = {
    date: state.lastDate || dayStr(new Date()),
    stocks: Object.keys(state.data).length, total, hits,
    base: total ? +(hits / total * 100).toFixed(2) : 0,
    cells: cells.map(row => row.map(c => ({ n: c.n, p: rate(c) }))),
    hist: Object.fromEntries(Object.entries(hist).map(([k, b]) => [k, { n: b.n, p: rate(b) }])),
    ms: Date.now() - t0,
  };
  saveLimitStats();
  return state.limitStats;
}

/* 竞价 → 当日盘中触及涨停概率（测算引擎驱动，qr_limitstats_v1；无测算时回落默认值）
   离线基准：高开3-6%+量≥2≈47%；昨日触板+高开≥1%≈48%（连板效应）；20cm 票打 6 折 */
function limitUpProb(code, pct, vr, hist) {
  const LS = state.limitStats;
  let p = null;
  /* 主表：gap × vr 实测格（样本不足格回落默认） */
  if (LS && LS.cells) {
    const G = [[1, 3], [3, 6], [6, 9], [9, 99]], V = [[0, 1], [1, 2], [2, 99]];
    const gi = G.findIndex(b => pct >= b[0] && pct < b[1]);
    const vi = V.findIndex(b => vr >= b[0] && vr < b[1]);
    if (gi >= 0 && vi >= 0 && LS.cells[gi][vi].p != null) p = LS.cells[gi][vi].p;
  }
  if (p == null) {
    if (pct >= 9) p = 95;
    else if (pct >= 6) p = vr >= 2 ? 83 : vr >= 1 ? 59 : 40;
    else if (pct >= 3) p = vr >= 2 ? 47 : vr >= 1 ? 26 : 18;
    else if (pct >= 1) p = vr >= 2 ? 32 : vr >= 1.5 ? 15 : 9;
    else if (pct >= 0) p = 3;
    else p = 2;
  }
  /* 昨日信号修正（优先实测值，样本不足回落默认） */
  if (hist) {
    const H = LS && LS.hist ? LS.hist : {};
    if (hist.prevTouch) {
      if (pct >= 1) {
        const m = H.ptGapUp && H.ptGapUp.p != null ? H.ptGapUp.p : 48;
        p = Math.max(p, hist.ret5 >= 15 ? Math.min(95, m + 5) : m);
      } else if (pct < 0) {
        const m = H.ptGapDn && H.ptGapDn.p != null ? H.ptGapDn.p : 16;
        p = Math.min(p, m);
      }
    } else if (hist.ret5 >= 15) {
      const key = pct >= 6 ? 'r15g6' : pct >= 3 ? 'r15g3' : pct >= 1 ? 'r15g1' : null;
      const dft = pct >= 6 ? 90 : pct >= 3 ? 44 : 21;
      if (key) {
        const m = H[key] && H[key].p != null ? H[key].p : dft;
        p = Math.max(p, m);
      }
    }
  }
  const pre = code.slice(2, 4);
  if (pre === '30' || pre === '68') p = Math.round(p * 0.6);   /* 20cm 涨停更难 */
  return Math.min(95, Math.max(1, Math.round(p)));
}

/* 竞价强势评分：涨幅/量比/成交额/市值 四维 + 技术面加分 */
function scoreAuction(r) {
  const name = (r.f14 || '').replace(/\s+/g, '');
  if (!name || /ST|退/.test(name)) return null;
  const price = +r.f2, pct = +r.f3;
  if (!isFinite(price) || price <= 0) return null;          /* 停牌 */
  if (pct < 0) return null;                                  /* 下跌不参与 */
  const amtYi = (+r.f6 || 0) / 1e8;
  const volRatio = +r.f10;
  const circ = (+r.f21 || 0) / 1e8;
  const prev = +r.f18;
  const listDay = r.f26 ? String(r.f26) : '';

  /* 上市不足 60 日排除 */
  if (listDay && listDay >= '20250901') return null;

  let v = 0;
  const reasons = [], risks = [];

  /* 涨幅维度 */
  if (pct >= 3 && pct <= 6) { v += 25; reasons.push('竞价涨 3–6%'); }
  else if (pct >= 1 && pct < 3) { v += 18; reasons.push('温和高开'); }
  else if (pct > 6 && pct <= 9) { v += 12; reasons.push('强势高开'); }
  else if (pct >= 0 && pct < 1) { v += 4; }
  if (pct >= 9.5) { risks.push('接近涨停，难以成交'); v -= 12; }

  /* 量比维度 */
  if (volRatio >= 3) { v += 20; reasons.push('量比 ≥3'); }
  else if (volRatio >= 2) { v += 15; reasons.push('量比 ≥2'); }
  else if (volRatio >= 1.5) { v += 10; }
  else if (volRatio < 1) { risks.push('量比不足'); v -= 6; }

  /* 成交额维度 */
  if (amtYi >= 2) { v += 20; reasons.push('竞价额 ≥2亿'); }
  else if (amtYi >= 1) { v += 15; reasons.push('竞价额 ≥1亿'); }
  else if (amtYi >= 0.5) { v += 10; }
  else return null;

  /* 流通市值维度 */
  if (circ >= 50 && circ <= 300) { v += 15; reasons.push('流通市值适中'); }
  else if ((circ >= 30 && circ < 50) || (circ > 300 && circ <= 800)) { v += 8; }
  else if (circ > 0 && circ < 30) { risks.push('小盘易操纵'); v -= 6; }
  else if (circ > 800) { risks.push('大盘难拉升'); v -= 6; }

  /* 技术面加分：用昨日已缓存的日线数据 */
  const code = codeFromRow(r);
  const x = state.data[code];
  let hist = null;
  if (x && x.ind) {
    const I = x.ind;
    try {
      if (I.uptrend) { v += 6; reasons.push('日线多头'); }
      if (I.rsi6 >= 40 && I.rsi6 <= 70) { v += 4; reasons.push('RSI 健康'); }
      if (I.k && I.d && I.k > I.d) { v += 3; reasons.push('KDJ 金叉'); }
      if (I.ret60 > 0.05) { v += 3; reasons.push('中期趋势向上'); }
    } catch (e) {}
    /* 昨日信号：触板史 + 5日涨幅（连板效应实测 lift 5.6×） */
    const bars = x.bars;
    if (bars && bars.length >= 7) {
      const n = bars.length;
      const prevTouch = bars[n - 1].h >= bars[n - 2].c * 1.099;
      const ret5 = (bars[n - 1].c / bars[n - 6].c - 1) * 100;
      hist = { prevTouch, ret5 };
      if (prevTouch) { v += 5; reasons.push('昨日触板·连板预期'); }
      else if (ret5 >= 15) { v += 3; reasons.push('5日动量强'); }
    }
  }

  /* 买入建议 */
  const buyLow = +(price * 0.995).toFixed(2);
  const buyHigh = +(price * 1.010).toFixed(2);
  const stop = prev > 0 ? +(Math.max(price * 0.97, prev * 0.985)).toFixed(2) : +(price * 0.97).toFixed(2);
  const target = +(price * 1.05).toFixed(2);
  const pos = clamp(Math.round((v / 100) * 8), 3, 8);    /* 竞价不确定性高，单只 3–8% */

  return {
    code, name, ind: r.f100 || '其他',
    price, pct, amtYi, volRatio, circ,
    score: clamp(Math.round(v), 0, 100),
    limitProb: limitUpProb(code, pct, isFinite(volRatio) ? volRatio : 1, hist),
    reasons, risks,
    buyLow, buyHigh, stop, target, pos,
    setup: '竞价强势'
  };
}

  const scored = rows.map(scoreAuction).filter(Boolean)

  const phase = auctionPhase();
  const today = dayStr(new Date());

    ? '已开盘 · 以下为实时行情快照（非当日 9:25 定格竞价数据，竞价评分仅供参考）'
    : phase === 'frozen' ? '9:25 定格 · 以下为今日竞价推荐'
    : phase === 'before' ? '盘前实时快照（竞价尚未开始，9:15 后口径更准确）'
    : '竞价中 · 每 10 秒刷新（9:25 前可撤单，数据仅供参考）';
  saveAuction();
  renderAuction();
}

async function fetchMarketList(onProgress) {
  const PZ = 100;
  const first = await emJSON(clistUrl(1, PZ), 10000);
  if (!first || !first.data) throw new Error('全市场快照失败');
  const total = first.data.total || 0;
  let rows = clistRows(first.data);
  const pages = Math.min(60, Math.ceil(total / PZ) || 1);
  let pn = 2, done = 1;
  const worker = async () => {
    while (pn <= pages) {
      const p = pn++;
      try {
        const j = await emJSON(clistUrl(p, PZ), 10000);
        rows = rows.concat(clistRows(j && j.data));
      } catch (e) { /* 单页失败忽略 */ }
      done++;
      if (onProgress) onProgress(done, pages);
      await sleep(60 + Math.random() * 80);
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  return { total, rows };
}

/* 快照字段 -> 统一 meta，过滤 ST/退市/停牌/新股/低流动性 */
function normalizeMarket(rows, todayStr) {
  const d0 = dayFromStr(todayStr) || new Date();
  const cutoff = dayStr(new Date(d0.getTime() - 560 * 86400000)).replace(/-/g, '');
  const out = [], seen = {};
  for (const r of rows) {
    const nm = (r.f14 || '').replace(/\s+/g, '');
    if (!nm || nm.indexOf('ST') >= 0 || nm.indexOf('退') >= 0) continue;
    const mkt = r.f13;
    if (mkt !== 0 && mkt !== 1) continue;
    const code = (mkt === 1 ? 'sh' : 'sz') + r.f12;
    if (seen[code]) continue;
    const price = +r.f2, amount = +r.f6;
    if (!isFinite(price) || price <= 0) continue;        /* 停牌 */
    if (!isFinite(amount) || amount < 1.5e7) continue;   /* 成交额 < 1500 万 */
    const listDay = r.f26 ? String(r.f26) : '';
    if (listDay && listDay < cutoff) { /* 上市够久 */ } else if (listDay) continue;
    seen[code] = 1;
    out.push({
      code, name: nm, ind: (r.f100 || '其他'),
      price, pct: +r.f3 || 0, amount,
      mcap: (+r.f20 || 0) / 1e8,
      ret60: +r.f24, listDay
    });
  }
  return out;
}

/* 初筛：50% 按成交额（可交易性），30% 按 60 日正动量，20% 按最大回撤（超卖反弹候选）
   行业 10% 上限，确保覆盖多个板块。回撤桶让市场下跌时也能抓住反弹机会。 */
function prescreen(list, n) {
  if (!list.length) return [];
  const secCap = Math.max(5, Math.ceil(n * 0.10));
  const picked = [], seen = {}, secCnt = {};
  const push = (x, cap) => {
    if (seen[x.code] || (secCnt[x.ind] || 0) >= cap) return false;
    seen[x.code] = 1; secCnt[x.ind] = (secCnt[x.ind] || 0) + 1;
    picked.push(x); return true;
  };
  const byAmt = list.slice().sort((a, b) => b.amount - a.amount);
  const withRet60 = list.filter(x => isNum(x.ret60));
  const byMom = withRet60.slice().sort((a, b) => b.ret60 - a.ret60);    /* 动量正 */
  const byPull = withRet60.slice().sort((a, b) => a.ret60 - b.ret60);   /* 回撤大（超卖候选） */
  const nLiq = Math.round(n * 0.5);
  const nMom = Math.round(n * 0.3);
  for (const x of byAmt) { if (picked.length >= nLiq) break; push(x, secCap); }
  for (const x of byMom) { if (picked.length >= nLiq + nMom) break; if (isNum(x.ret60) && x.ret60 >= -0.15) push(x, secCap); }
  for (const x of byPull) { if (picked.length >= n) break; push(x, secCap); }
  if (picked.length < n) for (const x of byAmt) { if (picked.length >= n) break; push(x, secCap * 2); }
  return picked;
}

function setProgress(done, total, label) {
  state.progress = { done, total };
  const pct = total ? done / total * 100 : 0;
  const bar = $('#loadBar');
  if (bar) bar.style.width = pct.toFixed(1) + '%';
  const st = $('#loadStatus');
  if (st) {
    const stkTotal = Math.max(1, total - 2);
    st.textContent = label ? '正在分析 ' + Math.min(done, stkTotal) + '/' + stkTotal + ' · ' + label : '正在读取…';
  }
  const sb = $('#syncbar');
  if (sb) sb.style.width = pct.toFixed(1) + '%';
}

/* 全量扫描：全市场快照初筛 -> 逐只拉日线 + 指数，再补批量报价 */
async function refreshFull(opts) {
  opts = opts || {};
  const overlay = opts.overlay !== false;
  state.loading = true;
  state.background = !overlay;
  state.hasCache = !!Object.keys(state.data).length;
  const btn = $('#refreshBtn');
  btn.classList.add('busy');

  if (overlay) {
    showOverlay(true);
    $('#loadTitle').textContent = '正在扫描行情';
    $('#loadStatus').textContent = '全市场快照…';
    $('#loadBar').style.width = '0';
    $('#cancelLoad').classList.toggle('hide', !state.hasCache);
    const tip = $('#loadTip');
    if (tip) tip.textContent = '首次运行先拉取全市场快照（沪深 A 股 5000+ 只），初筛后对 ' + COVER_N + ' 只做深度技术分析，约需 1–2 分钟。';
  } else {
    showSync(true);
  }

  /* 第一段：全市场快照 + 初筛 */
  let metas;
  try {
    const ml = await fetchMarketList((d, t) => setProgress(d, t, '全市场快照'));
    const norm = normalizeMarket(ml.rows, shToday());
    state.marketTotal = ml.total || norm.length;
    /* 市场情绪温度：全市场快照统计涨跌停家数（A股特有情绪指标，零额外请求） */
    state.mktSenti = {
      limitUp: norm.filter(r => r.pct >= 9.8).length,
      limitDown: norm.filter(r => r.pct <= -9.8).length,
      up5: norm.filter(r => r.pct >= 5).length,
      down5: norm.filter(r => r.pct <= -5).length,
      total: norm.length
    };
    metas = prescreen(norm, COVER_N);
    if (metas.length < 40) throw new Error('初筛候选不足');
    $('#loadStatus').textContent = '全市场 ' + (ml.total || norm.length) + ' 只 · 初筛 ' + metas.length + ' 只';
  } catch (e) {
    /* 快照失败（接口异常/CORS）时退回内置样本池 */
    metas = UNIVERSE.map(u => ({ code: u.code, name: u.name, ind: u.ind }));
    state.marketTotal = 0;
  }
  state.meta = {};
  metas.forEach(m => { state.meta[m.code] = { name: m.name, ind: m.ind }; });
  state.coverN = metas.length;

  const total = metas.length + 2;
  let done = 0, ok = 0, fail = 0;
  const out = {};
  let idx = 0;

  const worker = async () => {
    while (idx < metas.length) {
      const u = metas[idx++];
      try {
        const r = await fetchBars(u.code, false);
        if (r.bars.length >= 200) { out[u.code] = r; ok++; } else fail++;
      } catch (e) { fail++; }
      done++;
      setProgress(done, total, u.name);
      await sleep(30 + Math.random() * 70);
    }
  };
  await Promise.all([0, 1, 2, 3].map(worker));

  const idxList = [['sh000001', '上证指数'], ['sz399006', '创业板指']];
  const newIdx = {};
  for (const item of idxList) {
    try {
      const r = await fetchBars(item[0], true);
      if (r.bars.length > 60) {
        const ix = { code: item[0], name: item[1], bars: r.bars, qt: r.qt || [] };
        ix.ind = analyze(r.bars);
        newIdx[item[0]] = ix;
      }
    } catch (e) { /* 指数失败不影响主流程 */ }
    done++;
    setProgress(done, total, '指数');
  }

  if (ok >= 20) {
    const qs = await fetchQuotes(Object.keys(out));
    const nd = {};
    for (const code of Object.keys(out)) {
      const meta = metaOf(code);
      if (!meta) continue;
      const r = out[code];
      r.qt = qs[code] || r.qt || [];
      try { nd[code] = buildEntry(meta, r); } catch (e) { /* 跳过异常项 */ }
    }
    state.data = nd;
    if (Object.keys(newIdx).length) state.indexes = newIdx;
    state.hasCache = true;
    scoreAll();
    state.ts = Date.now();
    const dates = Object.values(nd).map(x => x.lastDate).filter(Boolean).sort();
    state.lastDate = dates[dates.length - 1] || '';
    saveCache();
    showSync(false);
    showOverlay(false);
    render();
    /* ★ 融资融券情绪异步补充（路线B）：拿到后带 margin5d 重算分数并刷新 */
    (async () => {
      const mg = await fetchMarginSentiment();
      if (mg && isNum(mg.chg5d)) { scoreAll(); render(); }
    })();
    /* ★ 北向资金异步补充：十大活跃股 +2 分、成交额快照进资金面行 */
    (async () => {
      const nb = await fetchNorthSentiment();
      if (nb && (Object.keys(nb.top10 || {}).length || nb.toYi != null)) { scoreAll(); render(); }
    })();
    /* ★ 涨停测算引擎：数据日期变化时重算（约 0.1~0.3s），竞价页概率自动采用实测值 */
    (async () => {
      try {
        if (!state.limitStats || state.limitStats.date !== (state.lastDate || dayStr(new Date()))) {
          computeLimitUpStats();
          if (state.tab === 'auction') renderAuction();
        }
      } catch (e) {}
    })();
    /* ★ 分钟级数据异步补充：拉 Top 15 短线精选票的 5 分钟线，
       计算 VWAP/早盘/尾盘 等日内因子，不阻塞主流程 */
    (async () => {
      try {
        const sorted = sortedList('short').filter(x => x.short.score >= 50 && shortWhitelistFor(state.marketUp)[x.short.setup] !== false);
        const topCodes = sorted.slice(0, 15).map(x => x.code);
        const minuteData = await batchFetchMinuteBars(topCodes, 5);
        let updated = 0;
        for (const code of Object.keys(minuteData)) {
          const x = state.data[code];
          if (!x) continue;
          const minInd = analyzeMinute(minuteData[code].bars, x.ind);
          const minScore = scoreMinute(minInd, x.ind);
          x.minute = { ind: minInd, score: minScore };
          updated++;
        }
        if (updated > 0) render();  /* 重新渲染让分钟信号显示 */
      } catch (e) { /* 分钟级数据失败不影响主流程 */ }
    })();
    if (fail > 0) toast('已更新 ' + ok + ' 只 · ' + fail + ' 只获取失败', 2400);
    else toast('行情已更新 · ' + ok + ' 只', 1800);
  } else {
    showSync(false);
    if (state.hasCache) {
      showOverlay(false);
      toast('网络异常，继续使用缓存数据', 2400);
    } else {
      showOverlay(true);
      $('#loadTitle').textContent = '行情获取失败';
      $('#loadStatus').textContent = '请检查网络后重试';
      $('#loadBar').style.width = '0';
      $('#cancelLoad').classList.add('hide');
      showRetryBtn();
    }
  }

  state.loading = false;
  btn.classList.remove('busy');
  return ok >= 20;
}

/* 增量刷新：只拉批量报价，更新当日 K 线并重算指标 */
async function quickQuote(silent) {
  const codes = Object.keys(state.data);
  if (!codes.length) return false;
  const btn = $('#refreshBtn');
  if (!silent) btn.classList.add('busy');
  showSync(true);

  const qs = await fetchQuotes(codes);
  let ok = 0, needFull = false;
  for (const code of Object.keys(qs)) {
    const x = state.data[code];
    if (!x) continue;
    const qd = quoteDay(qs[code]);
    if (qd && x.lastDate && dayGap(x.lastDate, qd) >= 3) { needFull = true; continue; }
    try { if (applyQuote(x, qs[code])) ok++; } catch (e) {}
  }

  if (!Object.keys(qs).length) {
    showSync(false);
    if (!silent) { btn.classList.remove('busy'); toast('报价更新失败，请检查网络', 2400); }
    return false;
  }

  if (ok) {
    scoreAll();
    state.ts = Date.now();
    const dates = Object.values(state.data).map(x => x.lastDate).filter(Boolean).sort();
    if (dates.length) state.lastDate = dates[dates.length - 1];
    state.hasCache = true;
    saveCache();
    render();
    if (!silent) toast('报价已更新 · ' + ok + ' 只', 1800);
  }
  showSync(false);
  if (!silent) btn.classList.remove('busy');
  return needFull;
}

async function fetchAll(opts) {
  opts = opts || {};
  if (state.loading) return;
  const hasData = Object.keys(state.data).length > 0;
  if (!hasData) { await refreshFull({ overlay: true }); return; }
  state.loading = true;
  let needFull = false;
  try {
    needFull = await quickQuote(!!opts.silent);
  } finally {
    state.loading = false;
  }
  if (needFull) await refreshFull({ overlay: false });
}

/* ---------------- 本地缓存（IndexedDB，容量足够存 240 只×320 根） ---------------- */
let __db = null;
function openDB() {
  if (__db) return Promise.resolve(__db);
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('no idb'));
    const req = indexedDB.open('qr_db', 1);
    req.onupgradeneeded = () => { try { req.result.createObjectStore('kv'); } catch (e) {} };
    req.onsuccess = () => { __db = req.result; resolve(__db); };
    req.onerror = () => reject(req.error || new Error('idb open fail'));
  });
}
function dbPut(key, val) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error || new Error('idb put fail'));
  }));
}
function dbGet(key) {
  return openDB().then(db => new Promise((res, rej) => {
    const rq = db.transaction('kv', 'readonly').objectStore('kv').get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error || new Error('idb get fail'));
  }));
}

function saveCache() {
  const pack = {
    v: 5, ts: Date.now(), lastDate: state.lastDate,
    marketTotal: state.marketTotal, coverN: state.coverN,
    meta: {}, data: {}, idx: {}
  };
  for (const k of Object.keys(state.data)) {
    const x = state.data[k];
    pack.meta[k] = { name: x.name, ind: x.sector };
    pack.data[k] = { qt: x.qt, bars: x.bars.slice(-320) };
  }
  for (const k of Object.keys(state.indexes)) {
    pack.idx[k] = { bars: state.indexes[k].bars.slice(-320) };
  }
  dbPut('pack', pack).catch(() => {
    if (Object.keys(pack.data).length > 120) return;   /* 超量不写 localStorage */
    try { localStorage.setItem(STORE, JSON.stringify(pack)); } catch (e) {}
  });
}

async function readCache() {
  try {
    const pack = await dbGet('pack');
    if (pack && pack.v === 5 && pack.data) return pack;
  } catch (e) { /* 回落 localStorage */ }
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return null;
    const pack = JSON.parse(raw);
    if (!pack || pack.v !== 5 || !pack.data) return null;
    return pack;
  } catch (e) { return null; }
}

function applyCache(pack) {
  state.meta = pack.meta || {};
  state.marketTotal = pack.marketTotal || 0;
  state.coverN = pack.coverN || 0;
  state.data = {};
  for (const code of Object.keys(pack.data)) {
    const raw = pack.data[code];
    if (!raw || !raw.bars || raw.bars.length < 200) continue;
    const meta = metaOf(code);
    if (!meta) continue;
    try { state.data[code] = buildEntry(meta, raw); } catch (e) { /* 跳过损坏项 */ }
  }
  state.indexes = {};
  const idxs = pack.idx || {};
  for (const code of Object.keys(idxs)) {
    const raw = idxs[code];
    if (!raw || !raw.bars || raw.bars.length < 60) continue;
    const nm = code === 'sh000001' ? '上证指数' : '创业板指';
    try {
      const ix = { code, name: nm, bars: raw.bars };
      ix.ind = analyze(raw.bars);
      state.indexes[code] = ix;
    } catch (e) {}
  }
  state.ts = pack.ts || 0;
  state.lastDate = pack.lastDate || '';
  state.hasCache = true;
  scoreAll();
}

/* ---------------- 自选与缓存偏好 ---------------- */
function loadWatch() {
  try {
    const raw = localStorage.getItem(STORE_W);
    if (!raw) { state.watchMeta = {}; state.watch = new Set(); return; }
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) {
      /* 旧版：只是 code 数组 → 自动升级 */
      state.watch = new Set(parsed);
      state.watchMeta = {};
      parsed.forEach(c => { state.watchMeta[c] = { addedAt: Date.now(), anchorPrice: null, anchorDate: '' }; });
      saveWatch();   /* 立即以新格式写回 */
    } else if (parsed && typeof parsed === 'object' && parsed.version === 2) {
      state.watch = new Set(Object.keys(parsed.items || {}));
      state.watchMeta = parsed.items || {};
    } else {
      state.watch = new Set(); state.watchMeta = {};
    }
  } catch (e) { state.watch = new Set(); state.watchMeta = {}; }
}

function saveWatch() {
  try {
    const items = {};
    for (const c of state.watch) items[c] = state.watchMeta[c] || { addedAt: Date.now(), anchorPrice: null, anchorDate: '' };
    localStorage.setItem(STORE_W, JSON.stringify({ version: 2, items }));
  } catch (e) {}
}

function recordWatchMeta(code, x) {
  const lastC = x && x.bars && x.bars.length ? x.bars[x.bars.length - 1].c : null;
  const price = isNum(x && x.price) && x.price > 0 ? x.price : lastC;
  const meta = state.watchMeta[code] || { addedAt: Date.now(), anchorPrice: null, anchorDate: '' };
  if (!meta.anchorPrice && isNum(price) && price > 0) {
    meta.anchorPrice = +price.toFixed(2);
    meta.anchorDate = x && x.bars && x.bars.length ? x.bars[x.bars.length - 1].d : new Date().toISOString().slice(0, 10);
  }
  state.watchMeta[code] = meta;
  return meta;
}

/* 自选股兜底拉取：未上榜的股票不在 state.data 里，需要单独 fetchBars + analyze + 评分 */
async function ensureWatchStock(code) {
  const existing = state.data[code];
  if (existing && existing.bars && existing.bars.length >= 260 && existing.long && existing.short) return existing;

  /* 占位：先塞一个骨架对象，renderWatch 不会因为 null 而过滤掉 */
  if (!existing) state.data[code] = { code, name: (state.meta[code] && state.meta[code].name) || code, sector: (state.meta[code] && state.meta[code].ind) || '自选', bars: [], amount: 0 };
  const x = state.data[code];

  /* 拉 K 线 */
  try {
    const r = await fetchBars(code, false);
    x.bars = r.bars;
    if (r.qt && r.qt.length) { x.qt = r.qt; parseQt(x); }
  } catch (e) {
    console.warn('[ensureWatch] fetchBars 失败', code, e.message);
    toast('自选股 ' + (x.name || code) + ' 数据拉取失败，请重试', 1500);
    return null;
  }

  /* 实时行情（价格/涨跌幅/成交额） */
  try {
    const qs = await fetchQuotes([code]);
    if (qs[code]) parseQt(qs[code]);
  } catch (e) { /* 忽略，bars 已够评分 */ }

  /* analyze + 评分 */
  try {
    x.ind = analyze(x.bars);
    const ctx = { marketUp: true, secUp: {}, secRank: {}, indexes: state.indexes };
    /* 大盘条件 */
    const idx = state.indexes && state.indexes['sh000001'];
    if (idx && idx.bars && idx.bars.length >= 260) {
      const idxBars = idx.bars, idxC = idxBars.map(b => b.c), idxV = idxBars.map(b => b.v || 0);
      const idxMa20 = SMA(idxC, 20), idxMa60 = SMA(idxC, 60), idxVolMa20 = SMA(idxV, 20);
      const lastC = idxC[idxC.length - 1], lastMa20 = idxMa20[idxMa20.length - 1], lastMa60 = idxMa60[idxMa60.length - 1];
      const lastVolRatio = idxVolMa20 && idxVolMa20[idxVolMa20.length - 1] > 0 ? idxV[idxV.length - 1] / idxVolMa20[idxVolMa20.length - 1] : 1;
      ctx.marketUp = lastC >= lastMa20;
      /* 缩量阴跌过滤 + 放量反弹黄金信号：
         - 熊市（指数在 MA60 下方）但大盘成交量相对 20 日均 > 1.1 倍 = 放量反弹，回测 5 日胜率 53.2% / +0.77%
         - 连续下跌 ≥ 6 天 + 量比 < 0.6 = 缩量阴跌，这段时段 5 日均 -0.4%
         bearGold 置顶显示、bearTight 标记为"阴跌中谨慎" */
      ctx.bearGold = (lastC < lastMa60) && lastVolRatio >= 1.1;
      ctx.bearTight = (lastC < lastMa60) && lastVolRatio < 0.6;
      ctx.volRatio = lastVolRatio;
      state.bearGold = ctx.bearGold;
      state.bearTight = ctx.bearTight;
    }
    x.long = scoreLong(x, ctx);
    x.short = scoreShort(x, ctx);
  } catch (e) {
    console.warn('[ensureWatch] analyze/score 失败', code, e.message);
    return null;
  }

  /* 保存 name/sector 到 meta 持久化 */
  if (x.name && state.meta[code]) state.meta[code].name = x.name;
  if (x.sector && state.meta[code]) state.meta[code].ind = x.sector;

  /* 记录自选锚定价：首次拉取成功时记录 anchorPrice / anchorDate */
  recordWatchMeta(code, x);
  saveWatch();

  return x;
}

/* 批量 ensure：对所有未上榜的自选股并发拉取 */
async function ensureAllWatch() {
  const codes = Array.from(state.watch).filter(c => {
    const x = state.data[c];
    return !x || !x.long || !x.short || !x.bars || x.bars.length < 260;
  });
  if (!codes.length) return;
  toast('正在加载 ' + codes.length + ' 只自选股数据…', 1500);
  await Promise.all(codes.map(c => ensureWatchStock(c)));
  /* 拉完触发 renderWatch（如果当前 Tab 是 watch）或 renderList */
  if (state.tab === 'watch') renderWatch();
  else if (state.tab === 'long' || state.tab === 'short') renderList();
  else if (state.tab === 'review') renderReview();
}

/* ---------------- 自选输入框：代码规范化 + 添加 ---------------- */
function normalizeCode(input) {
  const raw = (input || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!raw) return null;
  /* 已经带前缀 sh/sz/bj */
  if (/^(sh|sz|bj)\d{6}$/.test(raw)) return raw;
  if (/^(sh|sz|bj)\d{4,5}$/.test(raw)) return raw;
  /* 纯数字 6 位 */
  if (/^\d{6}$/.test(raw)) {
    const p = raw.slice(0, 2);
    if (/^(60|68|11|12|13|14|15|16|17|18|90|91|92|93|94|95|96|97|98|99)$/.test(p)) return 'sh' + raw;
    if (/^(00|01|02|03|20|30|15|16|18|19)$/.test(p)) return 'sz' + raw;
    if (/^(43|83|87|88|89|92)$/.test(p)) return 'bj' + raw;
    return null;   /* 无法识别的前缀 → 无效 */
  }
  /* 纯数字 5 位（老代码或 ETF）*/
  if (/^\d{5}$/.test(raw)) return 'sh' + raw;
  return null;
}

/* —— 本地三源股票池匹配（UNIVERSE + state.meta + state.data）—— */
function buildLocalStockIndex() {
  if (window.__LOCAL_STOCK_IDX__) return window.__LOCAL_STOCK_IDX__;
  const idx = {};
  const add = (code, name, ind) => {
    if (!code || !name) return;
    const normCode = /^(sh|sz|bj)\d/.test(code) ? code : normalizeCode(code);
    if (!normCode) return;
    idx[normCode] = { code: normCode, name: name.trim(), ind: ind || '' };
  };
  /* 源 1：UNIVERSE（稳定不变）*/
  (typeof UNIVERSE !== 'undefined' ? UNIVERSE : []).forEach(v => add(v.code, v.name, v.ind));
  /* 源 2：state.meta（东财初筛）*/
  Object.keys(state.meta || {}).forEach(c => add(c, state.meta[c].name, state.meta[c].ind));
  /* 源 3：state.data（正在加载/已经分析的）*/
  Object.keys(state.data || {}).forEach(c => {
    const x = state.data[c];
    if (x && x.name && x.name !== c) add(c, x.name, x.sector);
  });
  return (window.__LOCAL_STOCK_IDX__ = idx);
}
function matchWatchInput(q) {
  const raw = (q || '').trim();
  if (!raw) return [];
  const idx = buildLocalStockIndex();
  const isCodeLike = /^\d{2,8}$/.test(raw) || /^(sh|sz|bj)\d{4,6}$/i.test(raw);
  const results = [];
  const seen = new Set();
  for (const code of Object.keys(idx)) {
    if (seen.has(code)) continue;
    const s = idx[code];
    let score = -1;
    if (isCodeLike) {
      const bare = code.replace(/^(sh|sz|bj)/, '');
      if (code.includes(raw.toLowerCase())) score = 100;        /* 完整前缀 */
      else if (bare.includes(raw)) score = 90;                 /* 纯数字包含 */
      else if (bare === raw) score = 110;                      /* 精确匹配 */
    } else {
      /* 名称匹配 */
      if (s.name === raw) score = 110;                          /* 精确 */
      else if (s.name.includes(raw)) score = 95;                /* 子串 */
      else if (raw.length >= 2 && fuzzyIncludes(s.name, raw)) score = 60; /* 模糊 */
    }
    if (score >= 0) {
      results.push({ ...s, score });
      seen.add(code);
    }
  }
  results.sort((a, b) => b.score - a.score || a.code.localeCompare(b.code));
  return results.slice(0, 10);
}
function fuzzyIncludes(str, sub) {
  /* 允许跳过 0-1 字符的子序列匹配（'茅台' ≈ '贵州茅台'）*/
  let j = 0;
  for (let i = 0; i < str.length && j < sub.length; i++) {
    if (str[i] === sub[j]) j++;
  }
  return j === sub.length;
}

function bindAddWatch() {
  const input = $('#addWatchInput');
  const btn = $('#addWatchBtn');
  const box = $('#watchMatchBox');
  if (!input || !btn) return;

  let currentMatches = [];
  let selectedIdx = -1;

  const renderMatches = () => {
    if (!box) return;
    if (!currentMatches.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.style.display = 'block';
    box.innerHTML = currentMatches.map((m, i) => {
      const watchCls = state.watch.has(m.code) ? '已在自选' : '';
      const watchStyle = state.watch.has(m.code) ? 'color:var(--dim)' : 'color:var(--txt)';
      const indTag = m.ind ? '<small style="color:var(--muted);font-size:10px;margin-left:6px">' + m.ind + '</small>' : '';
      const selCls = i === selectedIdx ? 'background:rgba(88,166,255,.15)' : '';
      return '<div class="watch-match-item" data-code="' + m.code + '" data-idx="' + i + '" style="padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-size:13px;' + selCls + '">' +
        '<span style="' + watchStyle + '"><b>' + m.name + '</b>' + indTag + '</span>' +
        '<span class="num" style="color:var(--muted);font-size:11px">' + m.code.replace(/^(sh|sz|bj)/, '$1:').replace(':', '·') + ' ' + m.code.slice(2) + '</span>' +
        (watchCls ? '<span style="color:var(--dim);font-size:10px;margin-left:8px">★ ' + watchCls + '</span>' : '') +
        '</div>';
    }).join('');
    /* 点击事件 */
    box.querySelectorAll('.watch-match-item').forEach(el => {
      el.addEventListener('mousedown', e => {
        e.preventDefault();   /* 防止 input blur */
        const code = el.dataset.code;
        addWatchByCode(code);
      });
      el.addEventListener('mouseenter', () => {
        selectedIdx = parseInt(el.dataset.idx, 10);
        box.querySelectorAll('.watch-match-item').forEach((n, k) => {
          n.style.background = k === selectedIdx ? 'rgba(88,166,255,.15)' : '';
        });
      });
    });
  };

  const addWatchByCode = (code) => {
    if (!code) return;
    if (state.watch.has(code)) { toast('已经在自选里了', 1200); input.value = ''; box && (box.style.display = 'none'); return; }
    state.watch.add(code);
    if (state.data[code]) recordWatchMeta(code, state.data[code]);
    saveWatch();
    if (!state.data[code]) state.data[code] = { code, name: (state.meta[code] && state.meta[code].name) || code, sector: (state.meta[code] && state.meta[code].ind) || '自选', bars: [], amount: 0 };
    toast('已添加自选，正在加载数据…', 1500);
    input.value = '';
    selectedIdx = -1;
    if (box) { box.innerHTML = ''; box.style.display = 'none'; }
    renderWatch();
    ensureWatchStock(code).then(x => { if (x) renderWatch(); });
  };

  /* oninput 实时搜索 */
  input.oninput = () => {
    const v = input.value.trim();
    if (!v) { currentMatches = []; selectedIdx = -1; if (box) { box.innerHTML = ''; box.style.display = 'none'; } return; }
    /* 如果已经是合法代码，直接跳过搜索，submit 会处理 */
    const direct = normalizeCode(v);
    if (direct) { currentMatches = [{ code: direct, name: state.meta[direct] ? state.meta[direct].name : v, ind: (state.meta[direct] && state.meta[direct].ind) || '' }]; selectedIdx = 0; renderMatches(); return; }
    currentMatches = matchWatchInput(v);
    selectedIdx = currentMatches.length ? 0 : -1;
    renderMatches();
  };

  /* 键盘导航 */
  input.onkeydown = e => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (currentMatches.length) { selectedIdx = (selectedIdx + 1) % currentMatches.length; renderMatches(); }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (currentMatches.length) { selectedIdx = (selectedIdx - 1 + currentMatches.length) % currentMatches.length; renderMatches(); }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      currentMatches = []; selectedIdx = -1; if (box) { box.innerHTML = ''; box.style.display = 'none'; }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (selectedIdx >= 0 && currentMatches[selectedIdx]) { addWatchByCode(currentMatches[selectedIdx].code); }
      else {
        const direct = normalizeCode(input.value);
        if (direct) addWatchByCode(direct);
        else { toast('未找到匹配标的，试试输入完整代码或名称', 1800); }
      }
    }
  };

  /* 点击外部关闭下拉 */
  document.addEventListener('click', (ev) => {
    if (!box) return;
    if (!box.parentElement || box.parentElement.contains(ev.target)) return;
    box.innerHTML = ''; box.style.display = 'none';
  }, { once: true });   /* renderWatch 会重建 DOM，每次重新绑定 */

  btn.onclick = () => {
    const v = input.value.trim();
    if (!v) return;
    const direct = normalizeCode(v);
    if (direct) { addWatchByCode(direct); return; }
    if (currentMatches.length) { addWatchByCode(currentMatches[0].code); return; }
    toast('未找到匹配标的，请输入代码或名称', 1800);
  };

  /* focus 时重渲染已有下拉 */
  input.addEventListener('focus', () => {
    if (currentMatches.length) renderMatches();
  });
}

function toggleWatch(code) {

/* ---------------- 渲染：市场 / 工具栏 ---------------- */
function indexInfo(ix) {
  if (!ix || !ix.ind) return null;
  const I = ix.ind, c = last(I.c), prev = I.c[I.c.length - 2] || c;
  const ma20 = last(I.ma20), ma60 = last(I.ma60);
  return {
    c, pct: prev ? (c / prev - 1) * 100 : 0, ma20, ma60,
    above20: c >= ma20, bull: ma20 >= ma60
  };
}

function renderRegime() {
  const box = $('#regime');
  const sh = indexInfo(state.indexes['sh000001']);

function renderIndustryRow() {
  const row = $('#industryRow');
  const list = Object.values(state.data);

    .sort((a, b) => cnt[b] - cnt[a]).slice(0, 22);
  const sig = sectors.join('|');
  if (row.dataset.sig !== sig) {
    if (state.ind !== '全部' && sectors.indexOf(state.ind) < 0) state.ind = '全部';

      '<button class="fchip' + (i === state.ind ? ' active' : '') + '" data-ind="' + i + '">' + i + '</button>'
    ).join('');

    return;
  }
  $$('.fchip', row).forEach(b => b.classList.toggle('active', b.dataset.ind === state.ind));

/* ---------------- 列表 ---------------- */
function matchQuery(x, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return x.name.toLowerCase().includes(q) || x.code.includes(q) || x.sector.toLowerCase().includes(q);
}

function diversify(arr) {
  if (state.ind !== '全部' || state.search) return arr;
  const seen = {}, out = [];
  for (const x of arr) {
    if ((seen[x.sector] || 0) >= 2) continue;
    seen[x.sector] = (seen[x.sector] || 0) + 1;
    out.push(x);
  }
  return out;
}

function sortedList(mode) {
  let arr = Object.values(state.data).filter(x => x.long && x.short);
  arr = arr.filter(x => matchQuery(x, state.search) && (state.ind === '全部' || x.sector === state.ind));
  arr.sort((a, b) => mode === 'long' ? b.long.score - a.long.score : b.short.score - a.short.score);
  return arr;
}

function scoreMode(mode) { return mode === 'short' ? 'short' : 'long'; }

function cardHTML(x, mode, rank) {
  const m = scoreMode(mode);
  const s = m === 'short' ? x.short : x.long;

  const pctCls = x.pct >= 0 ? 'up' : 'down';
  const reasons = s.reasons.slice(0, 4);
  const chipCls = m === 'short' ? 'c' : 'g';
  const ringLen = 2 * Math.PI * 27;

  const bearGoldMark = (m === 'short' && state.bearGold) ? '<em style="color:var(--gold);font-weight:600">🔥黄金窗口</em>' : '';

  /* 换手率粗估（日线替代因子） */
  const estTR = (x.amount && x.mcap && x.mcap > 0) ? (x.amount / (x.mcap * 1e8) / 0.5 * 100) : null;
  const trMark = (estTR != null) ? ' · 换手≈' + estTR.toFixed(1) + '%' : '';
  /* 分钟级信号（VWAP 偏离、早盘强弱、尾盘抢筹）—— 均价按分钟数据所属交易日展示，过期置灰 */
  const minute = x.minute;
  let minuteMark = '';
  if (minute && minute.score) {
    const ms = minute.score;
    const stale = ms.date && ms.date !== shToday();
    const dimDate = ms.date ? ' <span class="dim" style="font-weight:400">' + ms.date.slice(5) + (stale ? ' 旧' : '') + '</span>' : '';
    if (stale) minuteMark = '<em class="dim">VWAP' + (ms.vwapDivPct >= 0 ? '+' : '') + ms.vwapDivPct + '%' + dimDate + '</em>';
    else if (ms.score >= 5) minuteMark = '<em style="color:var(--green);font-weight:600">VWAP+' + ms.vwapDivPct + '%' + (ms.maxUpRun >= 3 ? ' · ↑' + ms.maxUpRun : '') + dimDate + '</em>';
    else if (ms.score >= 1) minuteMark = '<em style="color:var(--green)">VWAP+' + ms.vwapDivPct + '%' + dimDate + '</em>';
    else if (ms.score <= -3) minuteMark = '<em style="color:var(--red)">VWAP' + ms.vwapDivPct + '%' + dimDate + '</em>';
    else if (ms.date) minuteMark = '<em class="dim">VWAP' + (ms.vwapDivPct >= 0 ? '+' : '') + ms.vwapDivPct + '%' + dimDate + '</em>';
  }
  /* 次日方向概率（12 年条件概率实测，非预测保证） */
  let nextDayMark = '';
  if (m === 'short' && s.nextDay) {
    const nd = s.nextDay;
    const ndColor = nd.prob >= 55 ? 'var(--green)' : nd.prob >= 50 ? 'var(--yellow)' : 'var(--red)';
    nextDayMark = '<em style="color:' + ndColor + ';font-weight:600" title="次日收阳概率（12年实测条件概率）">次日↑' + nd.prob.toFixed(0) + '%</em>';
  }
  const footExtra = bearGoldMark + (bearGoldMark && (aShareMark || regimeMark || minuteMark) ? ' ' : '') + aShareMark + (aShareMark && (regimeMark || minuteMark) ? ' ' : '') + regimeMark + (regimeMark && minuteMark ? ' ' : '') + minuteMark + (minuteMark && nextDayMark ? ' ' : '') + nextDayMark;
  const footShort = '短线 ' + fmt(score, 1) + ' · ' + (s.setupName || '') +
    (s.winRate3 != null && s.winRate != null
      ? ' · 3日胜率 ' + s.winRate3 + '% / 5日胜率 ' + s.winRate + '%'
      : (s.winRate ? ' · 胜率 ' + s.winRate + '%' : '')) +
    ' · 5日均 ' + (s.avgRet != null ? (s.avgRet >= 0 ? '+' : '') + s.avgRet.toFixed(2) + '%' : '—');
  const footLong = '长线 ' + fmt(score, 1) + ' · 趋势与质量';

        '<span class="num">' + Math.round(score) + '</span></div>' +

        '<div class="meta">' + x.sector + ' · ' + capTxt(x.mcap) + (m === 'short' && x.amount > 0 ? ' · ' + amtTxt(x.amount) : '') + trMark + '</div></div>' +
