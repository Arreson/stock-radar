<title>量策 · 双策略选股雷达</title>
<style>
:root{
  --bg:#060910;
  --panel:rgba(255,255,255,.045);
  --panel2:rgba(255,255,255,.065);
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.16);
  --txt:#E9EEF7;
  --muted:#8792A6;
  --dim:#5C6678;
  --gold:#E5B45B;
  --cyan:#4CC9F0;
  --up:#FF5C5C;
  --down:#22C58B;
  --purple:#B98CF6;
  --accent:var(--gold);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:
    radial-gradient(1100px 520px at 50% -12%,rgba(76,201,240,.10),transparent 62%),
    radial-gradient(900px 520px at 100% 0%,rgba(229,180,91,.07),transparent 58%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
body[data-tab="short"]{--accent:var(--cyan)}
body[data-tab="review"]{--accent:var(--gold)}
body[data-tab="auction"]{--accent:#ff7a45}
body[data-tab="watch"]{--accent:var(--purple)}
body[data-tab="strategy"]{--accent:var(--gold)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
b,strong{font-weight:600}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)}
.down{color:var(--down)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.hide{display:none!important}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;color:var(--gold);letter-spacing:.5px;
  background:linear-gradient(145deg,rgba(229,180,91,.16),rgba(76,201,240,.10));
  border:1px solid rgba(229,180,91,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px -8px rgba(229,180,91,.5);
}
.brand h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:10.5px;color:var(--muted);letter-spacing:.6px;white-space:nowrap}
.refresh{
  display:flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:16px;
  border:1px solid var(--line2);color:var(--txt);font-size:12px;background:rgba(255,255,255,.04);
  transition:.2s;white-space:nowrap;
}
.refresh:active{transform:scale(.96)}
.refresh.busy{opacity:.55;pointer-events:none}
.refresh svg{width:13px;height:13px;opacity:.8}
.refresh.busy svg{animation:spin 1s linear infinite}

/* ---------- 市场状态 ---------- */
.regime{
  margin:10px 14px 0;padding:11px 12px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(135deg,rgba(229,180,91,.06),rgba(76,201,240,.045));
  display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;
}
.idx{min-width:0}
.idx .l{font-size:10px;color:var(--muted);letter-spacing:.5px;display:flex;align-items:center;gap:4px}
.idx .v{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.idx .v b{font-size:15px;font-weight:600}
.idx .v small{font-size:11px}
.idx .t{font-size:9.5px;margin-top:1px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breadth{grid-column:1/-1;display:flex;align-items:center;gap:9px;padding-top:8px;border-top:1px solid var(--line)}
.breadth .bl{font-size:10px;color:var(--muted);white-space:nowrap}
.bbar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--down),var(--gold),var(--up));border-radius:3px;transition:width .4s}
.breadth .bv{font-size:10.5px;color:var(--txt);white-space:nowrap}

/* ---------- 标签栏 ---------- */
.tabs{
  position:sticky;top:0;z-index:30;display:flex;gap:4px;padding:10px 14px;
  margin-top:10px;background:rgba(6,9,16,.86);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1;height:34px;border-radius:9px;font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:4px;position:relative;transition:.18s;
}
.tab.active{color:var(--txt);background:rgba(255,255,255,.06);font-weight:600}
.tab.active::after{content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:22px;height:2px;background:var(--accent);border-radius:2px}
.tab em{font-style:normal;font-size:9px;padding:1px 4px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--muted)}

/* ---------- 工具栏 ---------- */
.toolbar{padding:12px 14px 2px}
.search{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;
  border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.035);
}
.search svg{width:14px;height:14px;color:var(--dim);flex:0 0 auto}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13px;color:var(--txt)}
.search input::placeholder{color:var(--dim)}
.chips-row{display:flex;gap:7px;overflow-x:auto;padding:9px 0 3px;scrollbar-width:none;-ms-overflow-style:none}
.chips-row::-webkit-scrollbar{display:none}
.fchip{
  flex:0 0 auto;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);
  font-size:11px;color:var(--muted);background:rgba(255,255,255,.03);transition:.15s;
}
.fchip.active{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:14px 14px 9px}
.sec b{font-size:13px;font-weight:600;letter-spacing:.3px}
.sec span{font-size:10.5px;color:var(--muted)}

/* ---------- 卡片 ---------- */
.list{padding:0 14px}
.card{
  position:relative;margin:0 0 10px;padding:12px 12px 9px;border-radius:16px;
  border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.018) 48%,rgba(255,255,255,.03));
  box-shadow:0 10px 26px -22px rgba(0,0,0,.9);
  transition:.18s;overflow:hidden;
}
.card:active{transform:scale(.992)}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--accent);opacity:.35}
.card.long::before{background:var(--gold)}
.card.short::before{background:var(--cyan)}
.card.watch::before{background:var(--purple)}
.card.top::before{opacity:.85;width:3px}
.card-head{display:flex;align-items:center;gap:10px}
.ring{width:50px;height:50px;flex:0 0 50px;position:relative;display:flex;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:4}
.ring .rv{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dasharray .5s}
.ring span{font-size:16px;font-weight:600;letter-spacing:-.5px;color:var(--txt);z-index:1}
.card.long .ring .rv{stroke:var(--gold)}
.card.short .ring .rv{stroke:var(--cyan)}
.card.watch .ring .rv{stroke:var(--purple)}
.ci{flex:1;min-width:0}
.nm{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;letter-spacing:.2px}
.nm .cd{font-size:9.5px;font-weight:400;color:var(--dim);letter-spacing:.4px}
.nm .badge{font-size:8.5px;font-weight:600;color:var(--gold);background:rgba(229,180,91,.12);border:1px solid rgba(229,180,91,.3);border-radius:4px;padding:0 4px;line-height:14px;letter-spacing:.5px}
.meta{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{text-align:right;flex:0 0 auto}
.px b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.2px}
.px small{font-size:11px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 7px}
.chip{font-size:10px;line-height:18px;padding:0 7px;border-radius:5px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);white-space:nowrap}
.chip.g{color:var(--gold);background:rgba(229,180,91,.09);border-color:rgba(229,180,91,.18)}
.chip.c{color:var(--cyan);background:rgba(76,201,240,.08);border-color:rgba(76,201,240,.18)}
.chip.r{color:var(--up);background:rgba(255,92,92,.08);border-color:rgba(255,92,92,.16)}
canvas.spark{display:block;width:100%;height:38px}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--dim)}
.card-foot .go{color:var(--accent);font-size:10.5px}

/* —— 自选徽章 + 建议行 —— */
.watch-badge-pos, .watch-badge-big, .watch-badge-neg, .watch-badge-neutral{
  position:absolute;top:10px;right:-32px;transform:rotate(45deg);
  font-size:9px;font-weight:700;padding:2px 36px;color:#fff;
  z-index:3;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.watch-badge-pos{background:linear-gradient(135deg,#22c55e,#16a34a)}
.watch-badge-big{background:linear-gradient(135deg,#ef4444,#dc2626)}
.watch-badge-neg{background:linear-gradient(135deg,#14b8a6,#0d9488)}
.watch-badge-neutral{background:rgba(255,255,255,.15);color:var(--dim);box-shadow:none}
.card.watch{overflow:visible}
.card.watch .watch-badge-pos, .card.watch .watch-badge-big, .card.watch .watch-badge-neg, .card.watch .watch-badge-neutral{top:-1px;right:24px}
.watch-advice{
  margin-top:8px;padding:8px 10px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.09);
  font-size:11px;line-height:1.5;color:var(--txt);
}
.watch-advice .wa-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.watch-advice .wa-top .wa-score{font-size:10px;color:var(--dim)}
.watch-advice .wa-sub{color:var(--muted);font-size:10px;margin-bottom:2px}
.watch-advice .wa-sub .anchor-edit{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.28);padding-bottom:1px}
.watch-advice .wa-sub .anchor-edit:hover{color:var(--txt)}
.anchor-row{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 2px}
.anchor-row input{flex:1 1 84px;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:12px;padding:5px 8px;outline:none}
.anchor-row input:focus{border-color:#58a6ff}
.anchor-row .btn{padding:4px 10px;font-size:11px}
.watch-advice .wa-suggestion{color:var(--txt);font-size:11px;line-height:1.55}
.watch-advice .wa-pos{font-size:10px;color:var(--muted);margin:3px 0;padding:4px 7px;background:rgba(255,255,255,.045);border-radius:6px;line-height:1.5}

/* 紧凑排名行 */
.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.025);margin:2px 0 4px}
.row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:0}
.row .rk{width:16px;font-size:10px;color:var(--dim);text-align:center;flex:0 0 16px}
.row .rn{flex:1;min-width:0}
.row .rn b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rn i{font-style:normal;font-size:9.5px;color:var(--dim)}
.row .rs{font-size:12px;font-weight:600;color:var(--accent);width:34px;text-align:right;flex:0 0 34px}
.row .rp{font-size:11px;width:50px;text-align:right;flex:0 0 50px}
.row .bar{width:40px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;flex:0 0 40px}
.row .bar i{display:block;height:100%;background:var(--accent);opacity:.7}

/* 空状态 / 错误 */
.empty{padding:54px 24px;text-align:center;color:var(--muted)}
.empty .ico{font-size:26px;color:var(--dim);margin-bottom:8px}
.empty p{margin:4px 0;font-size:12px;line-height:1.7}
.empty button{margin-top:14px;height:34px;padding:0 18px;border-radius:17px;border:1px solid var(--line2);font-size:12px;background:rgba(255,255,255,.05)}

.disc{margin:16px 14px 0;padding:11px 12px;border:1px dashed rgba(255,255,255,.12);border-radius:12px;font-size:10px;line-height:1.7;color:var(--dim)}
.notice{margin:12px 14px 0;padding:10px 12px;border-radius:12px;font-size:11px;line-height:1.65;color:var(--muted);background:rgba(76,201,240,.06);border:1px solid rgba(76,201,240,.18)}
.notice.warn{background:rgba(255,92,92,.06);border-color:rgba(255,92,92,.22);color:#e9b3b3}
.notice b{color:var(--txt)}
.sigrow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 14px 0}
.sig{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 5px;text-align:center}
.sig .sk{font-size:9px;color:var(--muted);margin-bottom:4px;letter-spacing:.2px}
.sig .sv{font-size:10.5px;font-weight:600;white-space:nowrap}
.sig.on .sv{color:#FF5C5C}
.sig.off .sv{color:#22C58B}
.sig.mid .sv{color:#8C97A8}
.depth{margin:10px 14px 0;padding:10px 11px 11px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
.depth-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.depth-head .dp{font-size:21px;font-weight:700;line-height:1.1}
.depth-head small{display:block;font-size:10px;margin-top:3px}
.dtime{font-size:9px;color:var(--muted);text-align:right;line-height:1.5}
.dref{font-size:9px;color:#4CC9F0;background:transparent;border:1px solid rgba(76,201,240,.32);border-radius:6px;padding:2px 7px;margin-top:4px}
.dq{display:flex;align-items:center;height:17px;position:relative;font-size:10px}
.dq .lb{width:24px;flex:0 0 24px;color:var(--muted)}
.dq b{width:46px;flex:0 0 46px;text-align:right;font-weight:600}
.dq .bar{position:absolute;right:46px;height:11px;border-radius:2px;opacity:.15}
.dq.s .bar{background:#FF5C5C}
.dq.b .bar{background:#22C58B}
.dq .qv{width:42px;flex:0 0 42px;text-align:right;color:var(--muted)}
.dq.s b{color:#FF5C5C}
.dq.b b{color:#22C58B}
.dstats{margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06);font-size:9.5px;color:var(--muted);line-height:1.75}
.disc b{color:var(--muted)}

/* 盘后复盘 */
.review-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 14px 0}
.rv-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;text-align:center}
.rv-k{font-size:10px;color:var(--muted);margin-bottom:4px}
.rv-v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.rv-s{font-size:9.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-groups{display:flex;flex-direction:column;gap:7px;margin:4px 14px 0}
.rv-group{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:9px 12px}
.rv-g-name{font-size:12px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:6px}
.rv-g-name .mode{font-size:9.5px;padding:1px 5px;border-radius:5px;font-weight:600}
.rv-g-name .mode.short{background:rgba(76,201,240,.15);color:var(--cyan)}
.rv-g-name .mode.long{background:rgba(255,184,76,.15);color:var(--gold)}
.rv-g-stat{display:flex;flex-direction:column;align-items:flex-end;min-width:56px}
.rv-g-stat span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.rv-g-stat small{font-size:9px;color:var(--dim)}
.rv-list{display:flex;flex-direction:column;gap:6px;margin:4px 14px 0}
.rv-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:10px 12px;cursor:pointer;transition:.15s}
.rv-row:hover{border-color:var(--accent)}
.rv-left{min-width:0}
.rv-nm{font-size:13px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:6px}
.rv-nm .cd{font-size:10px;color:var(--dim);font-weight:400}
.rv-meta{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px}
.rv-meta .mode{font-size:9px;padding:0 4px;border-radius:4px;font-weight:600}
.rv-meta .mode.short{background:rgba(76,201,240,.15);color:var(--cyan)}
.rv-meta .mode.long{background:rgba(255,184,76,.15);color:var(--gold)}
.rv-right{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.rv-pct{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.rv-intra{font-size:10px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
@media(max-width:380px){.review-grid{grid-template-columns:repeat(2,1fr)}}

/* ---------- 加载 ---------- */
#loading{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,9,16,.96);backdrop-filter:blur(8px);padding:24px}
#loading[hidden]{display:none}
.scan{width:88px;height:88px;border-radius:50%;position:relative;overflow:hidden;border:1px solid rgba(76,201,240,.25);background:radial-gradient(circle,rgba(76,201,240,.12),transparent 68%)}
.scan::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,rgba(76,201,240,0),rgba(76,201,240,.32),rgba(76,201,240,0) 32%);animation:spin 1.7s linear infinite}
.scan::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.scan i{position:absolute;border:1px solid rgba(255,255,255,.09);border-radius:50%}
.scan i:nth-child(1){inset:17px}
.scan i:nth-child(2){inset:31px}
#loading h3{margin:6px 0 0;font-size:15px;font-weight:600;letter-spacing:.4px}
#loading .st{font-size:11.5px;color:var(--muted);height:16px}
#loading .pb{width:190px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
#loading .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--cyan));transition:width .25s}
#loading .tip{font-size:10px;color:var(--dim);max-width:280px;text-align:center;line-height:1.6}
#loading .cancel{margin-top:2px;font-size:11px;color:var(--muted);border:1px solid var(--line);padding:5px 14px;border-radius:14px}
#syncbar{position:fixed;left:0;top:0;height:2px;width:0;z-index:90;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .2s;box-shadow:0 0 8px rgba(76,201,240,.5)}

/* ---------- 详情面板 ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:70;display:none}
.sheet-wrap.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(2,4,9,.62);backdrop-filter:blur(4px);animation:fade .2s ease}
.sheet-panel{
  position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  border-radius:20px 20px 0 0;border-top:1px solid var(--line2);
  background:linear-gradient(180deg,#0C1220,#080C15 40%,#070A12);
  box-shadow:0 -20px 50px -20px rgba(0,0,0,.9);
  padding:0 14px calc(22px + var(--safe-b));
  animation:up .28s cubic-bezier(.2,.8,.2,1);
}
.grip{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:8px auto 4px}
.sh-head{display:flex;align-items:flex-start;gap:8px;padding:6px 0 2px}
.sh-head .h{flex:1;min-width:0}
.sh-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.sh-head h2 small{font-size:10px;font-weight:400;color:var(--dim);letter-spacing:.6px}
.sh-head p{margin:3px 0 0;font-size:10.5px;color:var(--muted)}
.sh-px{text-align:right;margin-right:2px}
.sh-px b{font-size:17px;font-weight:600;display:block}
.sh-px small{font-size:11px}
.star-btn{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim);margin-top:2px}
.star-btn.on{color:var(--gold);border-color:rgba(229,180,91,.45);background:rgba(229,180,91,.1)}
.sheet-close{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.seg{display:flex;gap:4px;margin:11px 0 0;padding:3px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{flex:1;height:30px;border-radius:8px;font-size:12px;color:var(--muted)}
.seg button.on{background:rgba(255,255,255,.09);color:var(--txt);font-weight:600}
.seg button.on.long{color:var(--gold)}
.seg button.on.short{color:var(--cyan)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}
.stat{background:#0A0F1A;padding:8px 9px}
.stat .k{font-size:9.5px;color:var(--dim);letter-spacing:.3px}
.stat .v{font-size:12px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv-mini{background:rgba(255,255,255,.04);border-radius:6px;padding:6px 8px;text-align:center}
.kv-mini span{display:block;font-size:9.5px;color:var(--muted);margin-bottom:1px}
.kv-mini b{font-size:12px;font-weight:600;color:var(--txt)}
.scorebox{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(150deg,rgba(255,255,255,.05),rgba(255,255,255,.02))}
.sb-top{display:flex;align-items:center;gap:12px}
.sb-score{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1;color:var(--accent)}
.sb-score small{font-size:11px;font-weight:400;color:var(--dim);letter-spacing:0;margin-left:2px}
.sb-lb{flex:1}
.sb-lb b{font-size:12px;font-weight:600}
.sb-lb p{margin:2px 0 0;font-size:9.5px;color:var(--muted)}
.parts{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.part{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted)}
.part .pl{width:58px;flex:0 0 58px}
.part .pb{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.part .pb i{display:block;height:100%;background:var(--accent);opacity:.75;border-radius:2px}
.part .pv{width:36px;text-align:right;color:var(--txt);flex:0 0 36px}
.chart-t{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 4px;font-size:10px;color:var(--muted)}
.chart-t em{font-style:normal;color:var(--dim);font-size:9px}
.chart-t .lg{display:flex;gap:9px;font-size:9px;color:var(--dim)}
.chart-t .lg i{font-style:normal;display:flex;align-items:center;gap:3px}
.chart-t .lg i::before{content:"";width:6px;height:2px;border-radius:1px;background:currentColor}
.chart-t .lg .d{color:var(--gold)}
.chart-t .lg .e{color:var(--cyan)}
canvas.chart{width:100%;display:block;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
.rr{margin-top:14px}
.rr h4{margin:0 0 7px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.rr h4::before{content:"";width:2px;height:10px;background:var(--accent);border-radius:1px;opacity:.8}
.rr .chips{margin:0}
.rr .risks .chip{color:var(--up);background:rgba(255,92,92,.07);border-color:rgba(255,92,92,.14)}
.chip.c{color:#ff8a65;background:rgba(255,122,69,.1);border-color:rgba(255,122,69,.2)}
.auc-plan{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;padding:10px 11px;background:rgba(255,122,69,.05);border:1px solid rgba(255,122,69,.15);border-radius:10px}
.auc-plan>div{display:flex;flex-direction:column;font-size:10px;line-height:1.5}
.auc-plan>div span{color:var(--muted)}
.auc-plan>div b{font-size:13px}
.plan{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plan .pr{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.05);font-size:11.5px}
.plan .pr:last-child{border-bottom:0}
.plan .pr span{color:var(--muted)}
.plan .pr b{font-weight:600;color:var(--txt);text-align:right}
.plan .pr b.up{color:var(--up)}
.plan .pr b.dn{color:var(--down)}
.snap{margin-top:14px}
.snap table{width:100%;border-collapse:collapse;font-size:10.5px}
.snap td{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);color:var(--muted)}
.snap td:last-child{text-align:right;color:var(--txt)}
.sh-disc{margin-top:14px;font-size:9.5px;color:var(--dim);line-height:1.7}

/* ---------- 策略页 ---------- */
.art{padding:4px 14px 0}
.art section{margin:16px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.028)}
.art h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.art h3 em{font-style:normal;font-size:9px;color:var(--dim);font-weight:400;letter-spacing:.5px}
.art p{margin:6px 0;font-size:11.5px;line-height:1.75;color:var(--muted)}
.art p b{color:var(--txt)}
.art .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px}
.art .kv:last-child{border-bottom:0}
.art .kv span{color:var(--muted)}
.art .kv b{color:var(--txt);font-weight:500;text-align:right}
.art .bt{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;margin:6px 0}
.art .bt th,.art .bt td{padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
.art .bt th{color:var(--dim);font-weight:500;font-size:10px;background:rgba(255,255,255,.03)}
.art .bt tbody tr:hover td{background:rgba(255,255,255,.03)}
.art .tag{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:4px;margin-right:4px;color:var(--gold);border:1px solid rgba(229,180,91,.25);background:rgba(229,180,91,.08)}
.art .tag.c{color:var(--cyan);border-color:rgba(76,201,240,.25);background:rgba(76,201,240,.07)}
.art ul{margin:6px 0;padding-left:16px}
.art li{font-size:11.5px;line-height:1.75;color:var(--muted);margin:3px 0}
.art li b{color:var(--txt)}

.toast{
  position:fixed;left:16px;right:16px;margin:0 auto;width:max-content;max-width:calc(100vw - 40px);
  bottom:calc(26px + var(--safe-b));transform:translateY(10px);
  z-index:95;padding:8px 15px;border-radius:18px;text-align:center;
  background:rgba(18,26,42,.96);border:1px solid var(--line2);color:var(--txt);
  font-size:11.5px;opacity:0;transition:.25s;pointer-events:none;
  backdrop-filter:blur(10px);box-shadow:0 12px 30px -14px rgba(0,0,0,.8);
}
.toast.show{opacity:1;transform:translateY(0)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>

function SMA(arr, p) {
  const o = new Array(arr.length).fill(null);
  let s = 0;
  for (let i = 0; i < arr.length; i++) {
    s += arr[i];
    if (i >= p) s -= arr[i - p];
    if (i >= p - 1) o[i] = s / p;
  }
  return o;
}

function EMA(arr, p) {
  const o = new Array(arr.length);
  const k = 2 / (p + 1);
  let prev = arr[0];
  for (let i = 0; i < arr.length; i++) {
    prev = i ? arr[i] * k + prev * (1 - k) : arr[i];
    o[i] = prev;
  }
  return o;
}

function MACD(close) {
  const ef = EMA(close, 12), es = EMA(close, 26);
  const dif = close.map((_, i) => ef[i] - es[i]);
  const dea = EMA(dif, 9);
  const hist = dif.map((v, i) => (v - dea[i]) * 2);
  return { dif, dea, hist };
}

function KDJ(h, l, c, n = 9) {
  const K = [], D = [], J = [];
  let pk = 50, pd = 50;
  for (let i = 0; i < c.length; i++) {
    const lo = Math.min(...l.slice(Math.max(0, i - n + 1), i + 1));
    const hi = Math.max(...h.slice(Math.max(0, i - n + 1), i + 1));
    const rsv = hi === lo ? 50 : (c[i] - lo) / (hi - lo) * 100;
    pk = 2 / 3 * pk + 1 / 3 * rsv;
    pd = 2 / 3 * pd + 1 / 3 * pk;
    K.push(pk); D.push(pd); J.push(3 * pk - 2 * pd);
  }
  return { K, D, J };
}

function RSI(c, p = 14) {
  const o = new Array(c.length).fill(null);
  let up = 0, dn = 0, au = 0, ad = 0;
  for (let i = 1; i < c.length; i++) {
    const ch = c[i] - c[i - 1];
    const u = Math.max(ch, 0), d = Math.max(-ch, 0);
    if (i <= p) {
      up += u; dn += d;
      if (i === p) { au = up / p; ad = dn / p; o[i] = au + ad ? 100 * au / (au + ad) : 50; }
    } else {
      au = (au * (p - 1) + u) / p;
      ad = (ad * (p - 1) + d) / p;
      o[i] = au + ad ? 100 * au / (au + ad) : 50;
    }
  }
  return o;
}

function ATR(h, l, c, p = 14) {
  const tr = [h[0] - l[0]];
  for (let i = 1; i < c.length; i++) {
    tr.push(Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])));
  }
  const o = new Array(c.length).fill(null);
  let a = null;
  for (let i = p - 1; i < tr.length; i++) {
    if (a === null) a = tr.slice(0, p).reduce((x, y) => x + y, 0) / p;
    else a = (a * (p - 1) + tr[i]) / p;
    o[i] = a;
  }
  return o;
}

function BOLL(c, n = 20, k = 2) {
  const mid = SMA(c, n);

  const low = new Array(c.length).fill(null);
  for (let i = n - 1; i < c.length; i++) {
    const seg = c.slice(i - n + 1, i + 1);
    const m = mid[i];
    const sd = Math.sqrt(seg.reduce((s, v) => s + (v - m) ** 2, 0) / n);
    up[i] = m + k * sd;
    low[i] = m - k * sd;
  }
  return { mid, up, low };
}

function OBV(c, v) {

  const m = vs.length, xm = (m - 1) / 2, ym = vs.reduce((a, b) => a + b, 0) / m;
  let num = 0, den = 0;
  vs.forEach((v, i) => { num += (i - xm) * (v - ym); den += (i - xm) ** 2; });

}

  const limitThresh = 0.095;
  for (let i = 1; i < c.length; i++) {
    const pct = (c[i] - c[i - 1]) / c[i - 1];
    upLimitArr.push(pct >= 0.095 && closeEqHigh(c[i], h[i]));
    downLimitArr.push(pct <= -0.095 && closeEqLow(c[i], l[i]));
    /* 向上缺口：今日 open > 昨日 high * 1.015 算有效跳空 */
    if (bars[i] && bars[i].o && h[i - 1] > 0) {
      gapUpArr.push(bars[i].o > h[i - 1] * 1.015 ? (bars[i].o - h[i - 1]) / h[i - 1] : 0);
    } else {
      gapUpArr.push(0);
    }
    /* ATR 比例序列（取 90 日滚动窗口填充） */
    if (atr[i] > 0 && c[i] > 0) atrPctArr.push(atr[i] / c[i]);
  }

  /* 连板计数：从倒数第一天往前数连续涨停天数 */
  let limitStreak = 0;
  for (let i = upLimitArr.length - 1; i >= 0; i--) {
    if (upLimitArr[i]) limitStreak++;
    else break;
  }

  /* 近 N 日涨停次数（含今日） */
  const upLimit20 = upLimitArr.slice(-20).filter(Boolean).length;
  const downLimit20 = downLimitArr.slice(-20).filter(Boolean).length;

  /* 最近一次涨停的封板强度：close/high（1.0=一字板没开过，越低说明炸板越狠）
     取最近一次涨停日的 seal，如果最近没涨停则为 null */
  let sealStrength = null;
  let lastLimitIdx = -1;
  for (let i = upLimitArr.length - 1; i >= Math.max(0, upLimitArr.length - 10); i--) {
    if (upLimitArr[i]) { lastLimitIdx = i; break; }
  }
  if (lastLimitIdx >= 0) {
    const hi = h[lastLimitIdx + 1], lo = l[lastLimitIdx + 1], cl = c[lastLimitIdx + 1];
    const range = hi - lo;
    sealStrength = range > 0 ? (cl - lo) / range : 1.0;  /* 0~1，越接近 1 封板越死 */
  }

  /* 向上缺口（今日有效 + 3 日内未回补 = gapTrend）
     回补定义：3 日内 low <= 缺口起点（昨日 high） */
  let gapUpToday = 0, gapUnfilled = false, gapTrend = 0;
  if (gapUpArr.length > 0) {
    gapUpToday = gapUpArr[gapUpArr.length - 1];
    if (gapUpToday > 0) {
      /* 检查缺口是否是真的没回补：向后看 3 天内 low 是否回到 gap 起点 */
      const gapStart = h[c.length - 2];  /* 缺口起点 = 昨日 high */
      let unfilled = true;
      const checkN = Math.min(3, c.length - 1 - (c.length - 1));
      /* gap 在 i = c.length-1 处（即 today），所以看 today、today+1、today+2 的 low */
      for (let k = 0; k < 3; k++) {
        const idx = c.length - 1 + k;
        if (idx >= l.length) break;
        if (l[idx] <= gapStart) { unfilled = false; break; }
      }
      gapUnfilled = unfilled;
      gapTrend = gapUnfilled ? gapUpToday : 0;
    }
  }

  /* 波动率聚集：当前 ATR/close 在过去 90 日的分位数 */
  let atrRank = 0.5;
  if (atrPctArr.length >= 30) {
    const win = atrPctArr.slice(-90);
    const cur = atrPctArr[atrPctArr.length - 1];
    atrRank = win.sort((a, b) => a - b).reduce((acc, v) => acc + (v <= cur ? 1 : 0), 0) / win.length;
  }

  /* 量比分位数（当前 vol5 比 vol20 在过去 60 日的分位） */
  let volRatioRank = 0.5;
  const vrHist = [];
  for (let i = 1; i < v.length; i++) {
    if (vol5[i] > 0 && vol20[i] > 0) vrHist.push(vol5[i] / vol20[i]);
  }
  if (vrHist.length >= 30) {
    const cur = vrHist[vrHist.length - 1];
    volRatioRank = vrHist.slice(-60).sort((a, b) => a - b).reduce((acc, v) => acc + (v <= cur ? 1 : 0), 0) / Math.min(60, vrHist.length);
  }

  function closeEqHigh(cl, hi) { return cl > 0 && hi > 0 && cl >= hi * 0.998; }
  function closeEqLow(cl, lo) { return cl > 0 && lo > 0 && cl <= lo * 1.002; }

  return {
    o, c, h, l, v,
    ma5, ma10, ma20, ma60, ma120, ma250,
    dif: m.dif, dea: m.dea, hist: m.hist,
    K: kd.K, D: kd.D, J: kd.J,
    r6, r14, atr, boll, vol5, vol20, vol60, obv, obv20,
    wDif: wm.dif, wDea: wm.dea, wHist: wm.hist,
    wK: wkd.K, wD: wkd.D, wJ: wkd.J,
    mdd: maxDD(c), volAnn, ret20, ret60, ret120, ret250,
    r2: r2(c, 120),
    hi250: Math.max(...h.slice(-250)), lo250: Math.min(...l.slice(-250)),
    structure, swingLow, swingHigh, brkVol, pNewHi, volDiverge,
    /* —— A 股日线独有 —— */
    limitStreak, upLimit20, downLimit20, sealStrength,
    gapUpToday, gapUnfilled, gapTrend, atrRank, volRatioRank
  };
}

/* ---------------- 评分模型 ---------------- */
function sortedNum(list, f) {
  return list.map(f).filter(isNum).sort((a, b) => a - b);
}

function pctRank(arr, v) {
  if (!arr.length || !isNum(v)) return 0.5;
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] <= v) lo = m + 1; else hi = m; }
  return lo / arr.length;
}

function buildContext(list) {
  return {
    ret60: sortedNum(list, x => x.ind.ret60),
    ret120: sortedNum(list, x => x.ind.ret120),
    ret250: sortedNum(list, x => x.ind.ret250),
    vol: sortedNum(list, x => x.ind.volAnn),
    mdd: sortedNum(list, x => x.ind.mdd),
    r2: sortedNum(list, x => x.ind.r2)
  };
}

// 行业动量 + 趋势：各行业近 20 日等权涨幅排名，及行业是否上行
function sectorStats(list) {
  const map = {};
  for (const x of list) {
    const s = x.sector || '其他';
    if (!map[s]) map[s] = [];
    map[s].push(x);
  }
  const rets = {};
  for (const s in map) {
    const arr = map[s].filter(x => x.ind && x.ind.c.length > 21);
    if (!arr.length) continue;
    rets[s] = arr.reduce((sum, x) => sum + x.ind.ret20, 0) / arr.length;
  }
  const sorted = Object.entries(rets).sort((a, b) => b[1] - a[1]);
  const rank = {};
  sorted.forEach(([s], i) => { rank[s] = i / sorted.length; });
  const up = {};
  for (const s in rets) up[s] = rets[s] > 0;
  return { rank, up, rets };
}

// 大盘趋势：上证指数 20 日均线斜率
function marketTrendUp() {
  const ix = state.indexes && state.indexes['sh000001'];
  if (!ix || !ix.bars || ix.bars.length < 60) return true;
  const c = ix.bars.map(b => b.c);
  const ma20 = SMA(c, 20), ma60 = SMA(c, 60);
  const n20 = ma20.length;
  if (n20 < 11) return true;
  const lastC = c[c.length - 1];
  const lastMa20 = ma20[n20 - 1];
  const lastMa60 = ma60[ma60.length - 1];
  /* 条件组合：至少满足两个视为下行 */
  let bear = 0;
  // 1. MA20 最近 10 根斜率为负
  const recent = ma20.slice(-10);
  const xm = (recent.length - 1) / 2, ym = recent.reduce((a, b) => a + b, 0) / recent.length;
  let num = 0, den = 0;
  recent.forEach((v, i) => { num += (i - xm) * (v - ym); den += (i - xm) ** 2; });
  if (den && num / den < 0) bear++;
  // 2. 现价在 MA60 下方
  if (lastC < lastMa60) bear++;
  // 3. MA20 < MA60（死叉结构）
  if (lastMa20 < lastMa60) bear++;
  return bear < 2;
}

function scoreLong(x, ctx) {
  const I = x.ind, c = last(I.c), ma20 = last(I.ma20), ma60 = last(I.ma60), ma120 = last(I.ma120), ma250 = last(I.ma250);
  const s20 = slope(I.ma20, 20);
  const parts = [];

  // 趋势结构（22）：站上均线 + 动能切换
  let v = 0;
  if (c > ma20) v += 3;
  if (c > ma60) v += 4;
  if (c > ma120) v += 4;
  if (ma60 > ma120) v += 5;
  if (slope(I.ma120, 20) > 0) v += 6;
  // 动能切换：站上中短期均线但未到年线，且 20 日斜率向上
  if (c > ma20 && c > ma60 && c < ma120 && s20 > 0) v += 5;
  if (I.structure === 'up') v += 4;            /* 道氏：更高高点 + 更高低点 */
  else if (I.structure === 'down') v -= 3;
  parts.push({ k: '趋势结构', v: clamp(v, 0, 22), max: 22 });

  v = 0;
  if (last(I.wDif) > 0) v += 6;
  if (last(I.wHist) > 0) v += 6;
  if (last(I.wDif) > last(I.wDea)) v += 6;
  parts.push({ k: '周线动能', v, max: 18 });

  /* 相对强度（18）：横截面分位（14）+ 相对上证超额收益（4，O'Neil RS 口径） */
  const ixC = (state.indexes && state.indexes['sh000001'] && state.indexes['sh000001'].bars || []).map(b => b.c);
  const mktRet60 = ixC.length > 61 ? last(ixC) / ixC[ixC.length - 61] - 1 : 0;
  const rs60 = I.ret60 - mktRet60;
  v = (pctRank(ctx.ret60, I.ret60) + pctRank(ctx.ret120, I.ret120)) * 7
    + clamp((rs60 / 0.15) * 4, -2, 4);
  parts.push({ k: '相对强度', v: clamp(v, 0, 18), max: 18 });

  // 趋势稳定（12）：r2 降权，回撤加权
  v = pctRank(ctx.r2, I.r2) * 4 + (1 - pctRank(ctx.mdd, I.mdd)) * 8;
  parts.push({ k: '趋势稳定', v, max: 12 });

  v = (1 - pctRank(ctx.vol, I.volAnn)) * 10;
  parts.push({ k: '波动控制', v, max: 10 });

  v = 0;
  if (x.pe > 0 && x.pe <= 40) v += 4; else if (x.pe > 0 && x.pe <= 60) v += 2;
  if (x.pb > 0 && x.pb <= 6) v += 3; else if (x.pb > 0 && x.pb <= 10) v += 1.5;
  if (x.mcap >= 500) v += 3; else if (x.mcap >= 200) v += 2; else if (x.mcap >= 80) v += 1;
  parts.push({ k: '估值规模', v, max: 10 });

  const vr = last(I.vol60) > 0 ? last(I.vol20) / last(I.vol60) : 1;
  v = clamp(vr * 4, 0, 7) + (last(I.obv) > last(I.obv20) ? 2 : 0);
  if (I.brkVol >= 1.5) v += 1;                    /* 突破日显著放量 → 确认 */
  parts.push({ k: '量能资金', v: clamp(v, 0, 10), max: 10 });

  // 行业动量加分
  let secBonus = 0;
  const sr = ctx.secRank ? ctx.secRank[x.sector] : 0.5;
  if (sr < 0.25) secBonus = 5;
  else if (sr < 0.5) secBonus = 2;
  else if (sr > 0.8) secBonus = -2;

  let pen = 0;
  const risks = [];
  if (ma250 && c < last(I.ma250)) { pen += 4; risks.push('股价仍处年线下方'); }
  if (I.volDiverge) { pen += 5; risks.push('量价顶背离：价创新高但 OBV 未创新高'); }
  if (I.structure === 'down') { pen += 4; risks.push('道氏结构转弱（更低高点 + 更低低点）'); }
  if (last(I.r14) > 80) { pen += 6; risks.push('RSI(14) 超买 ' + fmt(last(I.r14), 0)); }
  if (last(I.wJ) > 105) { pen += 5; risks.push('周线 KDJ 处于高位'); }
  if (I.mdd > 0.45) { pen += 6; risks.push('近一年最大回撤 ' + yr(I.mdd * 100, 1)); }
  if (ma60 && c / ma60 - 1 > 0.45) { pen += 6; risks.push('显著偏离 60 日线'); }
  if (x.mcap && x.mcap < 100) risks.push('市值偏小，流动性风险');

  const raw = parts.reduce((s, p) => s + p.v, 0) + secBonus - pen;
  const score = clamp(raw, 0, 100);

  const reasons = [];
  if (c > ma20) reasons.push('站上20日线');
  if (ma60 > ma120) reasons.push('中期多头排列');
  if (slope(I.ma120, 20) > 0) reasons.push('年线上行');
  if (c > ma20 && c > ma60 && c < ma120 && s20 > 0) reasons.push('动能切换中');
  if (last(I.wDif) > 0 && last(I.wHist) > 0) reasons.push('周线MACD多头');
  else if (last(I.wHist) > 0) reasons.push('周线动能转正');
  if (I.ret60 > 0.05) reasons.push('60日 ' + yr(I.ret60 * 100, 1));
  if (I.mdd < 0.18) reasons.push('回撤仅 ' + yr(I.mdd * 100, 1));
  if (x.pe > 0 && x.pe < 30) reasons.push('PE ' + fmt(x.pe, 1) + '倍');
  if (last(I.obv) > last(I.obv20)) reasons.push('资金净流入');
  if (I.structure === 'up') reasons.push('道氏上升结构');
  if (rs60 > 0.05) reasons.push('跑赢大盘 ' + yr(rs60 * 100, 1));
  if (secBonus > 0) reasons.push('行业强势');

  return {
    score, parts, reasons: reasons.slice(0, 5), risks: risks.slice(0, 4),
    plan: longPlan(x)
  };
}

function goldenDays(K, D) {
  for (let i = K.length - 1; i >= Math.max(1, K.length - 5); i--) {
    if (K[i] > D[i] && K[i - 1] <= D[i - 1]) return K.length - 1 - i;
  }
  return -1;
}

function scoreShort(x, ctx) {
  const I = x.ind, c = last(I.c), cPrev = I.c[I.c.length - 2];
  const K = last(I.K), D = last(I.D), J = last(I.J);
  const r6 = last(I.r6), r14 = last(I.r14);
  const hist = last(I.hist), histPrev = I.hist[I.hist.length - 2];
  const vr = last(I.vol5) > 0 ? last(I.v) / last(I.vol5) : 1;
  const hit20 = Math.max(...I.h.slice(-21, -1));
  const r5 = I.c.length > 6 ? c / I.c[I.c.length - 6] - 1 : 0;
  const r10 = I.c.length > 11 ? c / I.c[I.c.length - 11] - 1 : 0;
  const atrp = c > 0 ? last(I.atr) / c : 0;
  const gd = goldenDays(I.K, I.D);
  const s20 = slope(I.ma20, 20);
  const slopeUp = s20 > 0;
  const aboveMa20 = c > last(I.ma20);
  const uptrend = slopeUp && aboveMa20;
  const weakTrend = !uptrend;
  const oversold = J < 30 && r6 < 35;                       /* 超卖信号（用于弱趋势反弹） */
  const aboveMa60 = isNum(last(I.ma60)) && c > last(I.ma60);
  const parts = [];

  /* KDJ（22）：趋势向上给满分；弱趋势+超卖给反弹分；其余给低位金叉分 */
  let v = 0;
  if (uptrend) {
    if (gd >= 0 && gd <= 3) v += (gd === 0 ? 10 : gd === 1 ? 9 : 8);
    if (K > D) v += 6;
    if (J < 25 || (J < 40 && J > I.J[I.J.length - 2])) v += 6;
  } else if (oversold) {
    /* 超卖反弹：J 触底且出现拐头，视为短线反转信号 */
    if (gd >= 0 && gd <= 3) v += 8;                           /* 低位金叉 */
    else if (J > I.J[I.J.length - 2] && J < I.J[I.J.length - 3]) v += 6; /* J 拐头 */
    if (K > D) v += 5;
    if (J < 15) v += 3;                                       /* 极端超卖 */
  } else {
    /* 弱趋势但非超卖：只给低位金叉少量分，其余风险项会扣分 */
    if (gd >= 0 && gd <= 3 && gd !== -1) v += 4;
    if (J < 25) v += 2;
  }
  parts.push({ k: 'KDJ', v: clamp(v, 0, 22), max: 22 });

  /* MACD（20）：趋势向上给满分；弱趋势给柱线收敛/翻红分（最多 10） */
  v = 0;
  const crossUp = hist > 0 && histPrev <= 0;
  if (uptrend) {
    if (crossUp) v += 8;
    else if (hist > 0 && hist > histPrev) v += 6;
    else if (hist < 0 && hist > histPrev) v += 4;
    if (last(I.dif) > last(I.dea)) v += 6;
    if (hist > 0) v += 6;
    if (last(I.dif) > 0) v += 2;
  } else {
    /* 弱趋势：允许捕捉底部柱线收敛/翻红（典型的超卖后动能修复） */
    if (crossUp) v += 6;
    else if (hist > 0 && hist > histPrev) v += 4;
    else if (hist < 0 && hist > histPrev) v += 5;             /* 绿柱收敛（最典型的底部信号） */
    else if (hist < 0 && Math.abs(hist) < 0.015 * c) v += 3; /* 绿柱极度缩短/零轴附近 */
    if (last(I.dif) > last(I.dea)) v += 3;
    if (hist > 0) v += 2;
    v = Math.min(v, 12);                                      /* 弱趋势 MACD 封顶 12 */
  }
  parts.push({ k: 'MACD', v: clamp(v, 0, 20), max: 20 });

  v = 0;
  if (vr >= 1.3 && vr <= 2.5) v += 10; else if (vr > 1.05) v += 6;
  if (vr >= 1 && c > cPrev) v += 8; else if (vr >= 1) v += 3;
  parts.push({ k: '量能', v, max: 18 });

  v = 0;
  if (c >= hit20 * 0.995) v += I.brkVol >= 1.5 ? 8 : 5;   /* 放量突破才算有效，缩量突破打折 */
  if (c > last(I.ma20)) v += 4;
  if (last(I.ma5) > last(I.ma20)) v += 3;
  parts.push({ k: '突破位置', v, max: 15 });

  v = 0;
  if (r5 > 0 && r5 < 0.15) v += 6; else if (r5 >= 0.15) v += 3;
  if (r10 > 0 && r10 < 0.2) v += 6; else if (r10 >= 0.2) v += 3;
  parts.push({ k: '动量', v, max: 12 });

  v = 0;
  if (r6 >= 30 && r6 <= 68 && r6 > I.r6[I.r6.length - 2]) v += 8;
  else if (r6 >= 30 && r6 <= 75) v += 5;
  parts.push({ k: 'RSI', v, max: 8 });

  v = 0;
  v += x.amount >= 50000 ? 3 : x.amount >= 10000 ? 1.5 : 0;
  v += atrp >= 0.015 && atrp <= 0.055 ? 2 : atrp <= 0.08 ? 1 : 0;
  parts.push({ k: '流动性', v, max: 5 });

  /* —— A 股日线因子（连板/缺口/量比分位）—— */
  v = 0;
  if (I.limitStreak >= 2) v += 10;           /* 连板延续，A 股连板效应强 */
  else if (I.limitStreak === 1) v += 5;      /* 首板 */
  if (I.gapTrend > 0) v += 5;                 /* 向上未回补缺口，强势确认 */
  else if (I.gapUpToday > 0) v += 2;         /* 向上缺口但已回补 */
  if (I.upLimit20 >= 3 && I.limitStreak === 0) v += 4;  /* 多日涨停但没连板=板块热度 */
  if (I.volRatioRank >= 0.7) v += 3;          /* 量比偏高（但已在安全区间） */
  /* 换手率粗估 + 板块共振（日线替代因子：解决缺分钟级数据） */
  const estTR = x.mcap && x.amount && x.amount > 0 ? (x.amount / (x.mcap * 1e8) / 0.5 * 100) : null;
  if (estTR != null) {
    if (estTR >= 2 && estTR <= 8) v += 3;      /* 温和换手 2-8% */
    else if (estTR > 8) v += 1;                 /* 高换手（博弈） */
    else if (estTR < 0.5) v -= 1;               /* 地量 */
  }
  /* 板块共振：行业整体上涨 → 加分（ctx.secRank[x.sector] 已有，用 1-secRank 做共振度） */
  const resRank = ctx.secRank && ctx.secRank[x.sector] != null ? 1 - ctx.secRank[x.sector] : 0.5;
  if (resRank >= 0.75) v += 3;                 /* 板块共振强 */
  parts.push({ k: 'A股因子', v: clamp(v, 0, 20), max: 20 });

  let pen = 0;
  const risks = [];
  if (r6 > 85) { pen += 10; risks.push('RSI(6) 超买 ' + fmt(r6, 0)); }
  if (J > 110) { pen += 8; risks.push('KDJ-J 高位钝化'); }
  if (c / last(I.ma20) - 1 > 0.15) { pen += 6; risks.push('偏离20日线过远，追高风险'); }
  if (r5 > 0.30) { pen += 6; risks.push('5日涨幅过大，注意回吐'); }
  /* 20 日跌幅过大惩罚仅对"追跌非超卖"严厉；真正超卖反弹的票反而是目标，降低惩罚 */
  if (I.ret20 < -0.10) {
    pen += oversold ? 2 : 6;
    risks.push('20日跌幅过大，接飞刀风险');
  } else if (I.ret20 < -0.05) {
    pen += oversold ? 0 : 2;
  }
  if (atrp > 0.06) risks.push('波动率偏高，需严控仓位');
  if (x.amount > 0 && x.amount < 10000) risks.push('成交清淡，流动性不足');
  if (!uptrend) risks.push('中期趋势下行，短线谨慎');

  /* —— A 股专属风险项 —— */
  if (I.sealStrength != null && I.sealStrength < 0.5) { pen += 3; risks.push('近期涨停曾严重炸板（封板强度 ' + fmt(I.sealStrength * 100, 0) + '%）'); }
  if (I.atrRank > 0.8) { pen += 2; risks.push('波动率近 90 日高位（分位 ' + Math.round(I.atrRank * 100) + '%）'); }
  if (I.downLimit20 >= 2) { pen += 4; risks.push('近 20 日 ' + I.downLimit20 + ' 次跌停，流动性恶化'); }

  /* 精细量价背离（日线序列）：用 checkDivergence 比 analyze 里 volDiverge 更细 */
  const div = checkDivergence(I, 20);
  if (div.topDiverge) { pen += 3; risks.push('精细顶背离：价近新高但 OBV 未跟上'); }
  if (div.botDiverge && !oversold) { pen -= 2; /* 底背离加分（仅非超卖时，超卖已经单独处理） */ }

  /* Elder 三重滤网：第一滤网=周线方向，第二=日线回调位置，第三=日线触发 */
  const wUp = last(I.wHist) > 0 || last(I.wDif) > last(I.wDea);
  if (!wUp) { pen += oversold ? 2 : 4; risks.push('周线动能向下，反弹级别有限'); }
  if (I.volDiverge) { pen += 4; risks.push('量价顶背离，突破可靠性下降'); }

  const marketDown = ctx.marketUp === false;
  const resilient = marketDown && uptrend && aboveMa60 && I.ret20 > 0 && (!ctx.secUp || ctx.secUp[x.sector] !== false);

  if (marketDown) {
    let v2 = 0;
    if (I.ret20 > 0) v2 += 4;
    if (I.ret20 > 0.08) v2 += 3;
    if (ctx.secUp && ctx.secUp[x.sector]) v2 += 3;
    parts.push({ k: '逆势强度', v: clamp(v2, 0, 10), max: 10 });
  }

  let raw = parts.reduce((s, p) => s + p.v, 0) - pen;
  // 道氏上升结构（更高高点 + 更高低点）对短线延续性有正贡献
  if (I.structure === 'up') raw += 2;
  else if (I.structure === 'down') raw -= 2;
  // 行业下行重罚
  if (ctx.secUp && ctx.secUp[x.sector] === false) raw -= oversold ? 2 : 5;
  // 未站上 60 日线：轻微降权
  if (!aboveMa60) raw *= 0.75;
  // 弱趋势再次降权；超卖反弹豁免
  if (weakTrend && !oversold) raw *= 0.9;
  // 超卖反弹最低保护：防多重惩罚叠加清零（最低 6 分）
  if (oversold && raw > 0 && raw < 6) raw = 6;

  /* 大盘环境分层降权：
     下行市场“逆势强势”结构 53% 胜率保留；
     其余非逆势但技术形态尚可的标的，给予 0.55 系数、上限 58，避免分数集体归零 */
  let rawFinal = raw;

  /* ★ bearGold / bearTight 分数调整（必须在 score 计算之前）——
     熊市放量反弹黄金窗口 +5 分；缩量阴跌 -4 分 */
  if (ctx.bearGold) { rawFinal += 5; }
  if (ctx.bearTight) { rawFinal -= 4; }

  let score = marketDown
    ? clamp(Math.min(resilient ? rawFinal * 0.95 : rawFinal * 0.55, resilient ? 85 : 58), 0, 100)
    : clamp(rawFinal, 0, 100);

  /* 形态归类 + 回测统计（用于卡片与详情的"胜率参考"） */
  const si = setupInfoForShort(x, ctx);
  const setup = si.setup;
  const S = SHORT_SETUP[setup] || SHORT_SETUP.weak;

  /* —— 分数校准：让分数真正反映"形态 × 市场环境"的回测期望 ——
     现有 score 逻辑默认"技术越强分越高"，但熊市里 bounce/weak 是赢家、breakout 是输家，
     牛市里 breakout/trend/limitup 才是正期望。这里做 setup 级校准。
     ⚠️ 关键修复：熊市白名单形态分数必须 ≥50 才能过 renderList 的分数门槛，
        之前 bounce/weak 因"弱趋势降权 0.9 × 未站上 MA60 降权 0.75 × 0.55 系数"
        导致分数只有 5~20 分，白名单形同虚设（后台实跑 2420 个熊市 bounce 样本 0 个过 50！） */
  if (marketDown) {
    if (setup === 'bounce') score = Math.max(score, 60);       /* 熊市最好的形态，保底 60 */
    else if (setup === 'weak') score = Math.max(score, 55);    /* 熊市次好，保底 55 */
    else if (setup === 'trend') score = Math.max(score, 52);
    else if (setup === 'resilient') score = Math.max(score, 52);
    else if (setup === 'limitup') score = Math.max(score, 52); /* 熊市连板（游资接力） */
    else if (setup === 'gap') score = Math.max(score, 50);     /* 熊市向上缺口 */
    else if (setup === 'kdj') score = Math.max(score, 50);
    else if (setup === 'breakout') score = Math.min(score, 30); /* 熊市追高被套，封顶 30 */
    /* bearGold 时段再加 5 分黄金窗口加分 */
    if (ctx.bearGold) score = Math.min(100, score + 5);
  } else {
    /* 牛市：breakout/trend/limitup/gap 是正期望 */
    if (setup === 'limitup') score = Math.max(score, 55);       /* 牛市连板效应最强 */
    else if (setup === 'breakout') score = Math.max(score, 50);
    else if (setup === 'gap') score = Math.max(score, 48);
    else if (setup === 'trend') score = Math.max(score, 45);
    else if (setup === 'resilient') score = Math.max(score, 42);
    /* bounce/weak/kdj 牛市里博弈性质，限制上限 */
    else if (setup === 'bounce') score = Math.min(score, 40);
    else if (setup === 'weak') score = Math.min(score, 32);
  }
  score = clamp(score, 0, 100);

  const reasons = [];
  if (ctx.bearGold) reasons.push('🔥放量反弹·黄金窗口');
  if (ctx.bearTight) reasons.push('⚠️缩量阴跌中谨慎');
  /* 融资融券杠杆情绪（A股特有·T+1披露）：5日融资余额变化 > +0.5% = 杠杆资金进场 */
  if (isNum(ctx.margin5d)) {
    if (ctx.margin5d >= 0.5) { score = clamp(score + 2, 0, 100); reasons.push('融资余额5日+' + ctx.margin5d.toFixed(1) + '%·杠杆进场'); }
    else if (ctx.margin5d <= -1.5) { score = clamp(score - 2, 0, 100); risks.push('融资余额5日' + ctx.margin5d.toFixed(1) + '%·杠杆撤退'); }
  }
  /* 北向十大活跃股（披露新政后仅热度口径）：命中 +2 */
  if (ctx.north10) {
    const nb = ctx.north10[x.code.slice(2)];
    if (nb) { score = clamp(score + 2, 0, 100); reasons.push('北向十大活跃·' + nb.side + '第' + nb.rank + '名·成交' + nb.dealYi + '亿'); }
  }
  if (setup === 'resilient') reasons.push('逆势强势');
  if (I.limitStreak >= 2) reasons.push('连板 ' + I.limitStreak + ' 天');
  else if (I.limitStreak === 1) reasons.push('涨停首板');
  if (I.gapTrend > 0) reasons.push('向上未补缺口');
  if (gd >= 0 && gd <= 3) reasons.push('KDJ金叉' + (gd === 0 ? '当日' : gd + '日前'));
  else if (J < 25) reasons.push('KDJ超卖 ' + fmt(J, 0));
  if (vr >= 1.3) reasons.push('放量 ' + fmt(vr, 1) + '倍');
  if (I.brkVol >= 1.5) reasons.push('突破量达20日均量 ' + fmt(I.brkVol, 1) + '倍');
  if (wUp) reasons.push('周线动能配合');
  if (I.structure === 'up') reasons.push('道氏上升结构');
  if (c >= hit20 * 0.995) reasons.push('突破20日新高');
  if (c > last(I.ma20)) reasons.push('站上20日线');
  if (hist < 0 && hist > histPrev) reasons.push('MACD柱线收敛');
  else if (hist > 0) reasons.push('MACD红柱');
  if (r6 > 45) reasons.push('RSI6 回升 ' + fmt(r6, 0));
  if (r5 > 0) reasons.push('5日 ' + yr(r5 * 100, 1));
  if (x.amount >= 50000) reasons.push('成交额 ' + amtTxt(x.amount));

  if (marketDown && !si.resilient && setup === 'breakout') risks.push('⚠️熊市追高被套，历史胜率低');
  if (marketDown && setup !== 'bounce' && setup !== 'weak' && setup !== 'resilient') risks.push('大盘下行，非最佳形态');
  if (I.sealStrength != null && I.sealStrength < 0.5 && setup === 'breakout') risks.push('封板强度 ' + fmt(I.sealStrength * 100, 0) + '%，炸板较多');

  return {
    score, parts, reasons: reasons.slice(0, 5), risks: risks.slice(0, 4),
    setup, setupName: S.name, setupNote: S.note,
    winRate: si.wr, avgRet: si.avgRet, winRate3: si.wr3, avgRet3: si.avgRet3,
    hold: S.hold, samples: (state.backtest && state.backtest[setup] && state.backtest[setup].samples) || 0,
    regime: marketDown ? 'down' : 'up',
    nextDay: nextDayForecast(x, ctx, setup),
    plan: shortPlan(x, { marketDown, marketUp: ctx.marketUp, setup })
  };

}

/* 短线形态基准统计（已按实盘同口径：20 日冷却 + 量比≥1.2 + J<80 过滤）
   数据口径 = 11 年 · 91 只 · 8,733 信号（过滤后 1,410）· T+1 开盘成交 · 双边 0.3% 成本
   3=3日胜率/均收，5=5日 ------------------------------------------------------------ */
const SHORT_SETUP = {
  limitup:   { name: '连板接力',   wrBull: 45, wrBear: 50, avgBull: -0.20, avgBear: 0.50, hold: '≤3 日', note: 'A 股独有：连续涨停 ≥2 天。样本稀少，低于 30 样本门槛，暂列低置信' },
  gap:       { name: '缺口突破',   wrBull: 41, wrBear: 51, avgBull: -2.21, avgBear: 1.06, hold: '3–5 日', note: 'A 股缺口理论：向上跳空 3 日未回补。量价确认后极少触发（过滤后 0 样本），保留形态标注' },
  resilient: { name: '逆势强势',   wrBull: 50, wrBear: 49, avgBull: 0.58, avgBear: 1.02, hold: '5–10 日', note: '大盘下行仍站上 20/60 日线。过滤后熊市 49%/+1.02%（n=100，低置信）' },
  breakout:  { name: '放量突破',   wrBull: 55, wrBear: 49, avgBull: 1.36, avgBear: -0.35, hold: '5 日', note: '突破 20 日新高 + 量价确认。牛市过滤后 55.5%/+1.36%，为最强形态；熊市追高 -0.35% 已剔除' },
  kdj:       { name: 'KDJ 拐点',   wrBull: 46, wrBear: 48, avgBull: 0.01, avgBear: -0.07, hold: '≤3 日', note: '低位金叉。两市期望≈0，无统计优势，已剔除白名单' },
  bounce:    { name: '超卖反弹',   wrBull: 43, wrBear: 54, avgBull: -0.51, avgBear: 1.98, hold: '3–5 日', note: '超卖 + MACD 收敛。过滤后熊市 5 日 54.2%/+1.98%、3 日 63.6%（n=107，样本偏少）' },
  trend:     { name: '趋势延续',   wrBull: 52, wrBear: 49, avgBull: 1.49, avgBear: 0.60, hold: '5–10 日', note: '均线多头但未突破。过滤后牛市 51.7%/+1.49%；熊市过滤后样本不足 100，参考值低置信' },
  weak:      { name: '弱势反抽',   wrBull: 44, wrBear: 52, avgBull: -0.40, avgBear: 0.62, hold: '5 日（熊市）', note: '中期均线未站上。过滤后熊市 5 日 51.7%/+0.62%（n=534），3 日仅 49.1% → 建议持满 5 日' }
};

/* 形态白名单：按 12 年实测净期望分池（成本已计入）——
   熊市（上证在 MA20 下方）：resilient +0.58% / gap +1.06% / weak +0.42% / trend +0.29% / bounce +0.24%
   牛市（上证在 MA20 上方）：breakout +0.25% / trend +0.14%
   剔除依据：kdj 熊 -0.07% / gap 牛 -2.21% / breakout 熊 -0.35% / weak 牛 -0.40% / bounce 牛 -0.51%；
   limitup 牛 28 样本、熊 8 样本，低于 30 样本门槛 → 不进白名单（仍会标注形态，但不入推荐） */
const SHORT_WHITELIST_BULL = { breakout: true, trend: true, resilient: true, limitup: false, gap: false, bounce: false, kdj: false, weak: false };
const SHORT_WHITELIST_BEAR = { weak: true, bounce: true, trend: true, resilient: true, gap: true, limitup: false, kdj: false, breakout: false };
function shortWhitelistFor(bull) { return bull === true ? SHORT_WHITELIST_BULL : SHORT_WHITELIST_BEAR; }
/* 同股票冷却期：上次出现任一短线 setup 后 N 天内不再重复提示（减少同一下跌反复计入） */
const SHORT_COOLDOWN_DAYS = 20;

/* —— 形态归类（唯一实现）：回测引擎与实盘 scoreShort 共用同一套判定，避免双轨口径 —— */
function classifySetup(I, x, ctx) {
  ctx = ctx || {};
  const c = last(I.c), J = last(I.J);
  const r6 = last(I.r6), hist = last(I.hist), histPrev = I.hist[I.hist.length - 2];
  const s20 = slope(I.ma20, 20);
  const aboveMa20 = c > last(I.ma20);
  const aboveMa60 = isNum(last(I.ma60)) && c > last(I.ma60);
  const uptrend = s20 > 0 && aboveMa20;          /* 原文 slopeUp && aboveMa20 */
  const oversold = J < 30 && r6 < 35;
  const gd = goldenDays(I.K, I.D);
  const vr = last(I.vol5) > 0 ? last(I.v) / last(I.vol5) : 1;
  const hit20 = Math.max(...I.h.slice(-21, -1));
  const marketDown = ctx.marketUp === false;
  const sector = x && x.sector;
  /* resilient：大盘下行、个股仍多头 + 行业不弱（回测无行业数据时 secUp 缺省视为不弱） */
  const resilient = marketDown && uptrend && aboveMa60 && I.ret20 > 0 && (!ctx.secUp || !sector || ctx.secUp[sector] !== false);

  /* ★ A 股独有形态优先判定：连板 > 缺口 > 原有形态 */
  if (I.limitStreak >= 2 && aboveMa20) return 'limitup';   /* 连板接力：连续涨停 + 站上 MA20 */
  if (I.gapTrend > 0 && uptrend) return 'gap';             /* 向上未补缺口 + 多头 */
  if (resilient && vr >= 1.1) return 'resilient';
  if (c >= hit20 * 0.995 && (vr >= 1.1 || I.brkVol >= 1.5)) return 'breakout';
  if (oversold && (gd >= 0 && gd <= 3 || (hist < 0 && hist > histPrev))) return 'bounce';
  if (gd >= 0 && gd <= 3) return 'kdj';
  if (uptrend) return 'trend';
  return 'weak';
}

/* —— 滚动回测引擎 ——
   对 state.data 每只股票，在历史 bars 上每隔 STEP 日识别 setup，
   按 T+1 下一日开盘买入，统计 2/3/5 日后的收益与胜率。 */
function runBacktest() {
  const list = Object.values(state.data).filter(x => x.bars && x.bars.length >= 260);
  if (!list.length) return { ok: false, reason: '暂无足够数据（需先跑一次全市场扫描）' };

  /* 大盘 bull20 滚动序列：上证 MA20 按「日期」对齐（不能按数组下标，个股上市晚/停牌会整体错位） */
  const idx = state.indexes && state.indexes['sh000001'];
  const idxBars = idx && idx.bars ? idx.bars : null;
  const idxC = idxBars ? idxBars.map(b => b.c) : null;
  const idxMa20 = idxC && idxC.length >= 20 ? SMA(idxC, 20) : null;
  const idxPosByDate = new Map();
  if (idxBars) idxBars.forEach((b, k) => idxPosByDate.set(b.d, k));

  const COST = clamp(isNum(state.btCost) ? state.btCost : 0.3, 0, 3) / 100;
  const STEP = 5;        /* 每 5 天采样一次 */
  const START = 260;     /* 信号起点：至少 260 根 bar 才能稳定计算 120/250 指标 */
  const HOLD_DAYS = [2, 3, 5];
  const RULE_MAX = 10;   /* 规则离场：最长持有天数 */
  const RULE_STOP = 0.07;/* 规则离场：浮亏 7% 止损 */
  const TP_LEVELS = [0.05, 0.08]; /* 主动止盈：盘中触及 +5% / +8% 即按止盈价卖出 */
  /* 累加器（含牛/熊分池：实盘卡片按当前市场状态取对应池的胜率） */
  const mkReg = () => ({ n: 0, win: [0, 0, 0], sum: [0, 0, 0] });
  const agg = {};
  for (const k of Object.keys(SHORT_SETUP)) {
    agg[k] = { count: 0, win: [0, 0, 0], sumRet: [0, 0, 0], rN: 0, rWin: 0, rSum: 0, rHold: 0, tpN: 0, tpWin: [0, 0], tpSum: [0, 0], reg: { bull: mkReg(), bear: mkReg() } };
  }

  let totalSignals = 0;
  let minDate = '', maxDate = '';
  for (const x of list) {
    const bars = x.bars;
    const N = bars.length;
    if (N < START + 6) continue;
    const c = bars.map(b => b.c), o = bars.map(b => b.o);
    const ma3 = SMA(c, 3);

    for (let i = START; i <= N - 6; i += STEP) {
      /* 只取 bar[0..i] 做 analyze，严格防止未来函数 */
      const win = bars.slice(0, i + 1);
      const I = analyze(win);
      /* ★ 与实盘同口径的量价确认（量比≥1.2 且 J<80），否则卡片胜率会虚高于实盘筛选后的真实表现 */
      const v20b = I.vol20[I.vol20.length - 1];
      const vrB = isNum(v20b) && v20b > 0 ? last(I.v) / v20b : 1;
      const Jb = last(I.J);
      if (vrB < 1.2) continue;
      if (isFinite(Jb) && Jb >= 80) continue;
      /* bull20：按日期定位该交易日在上证序列中的位置 */
      let bull20 = true;
      const idxPos = idxPosByDate.get(bars[i].d);
      if (idxC && idxMa20 && idxPos != null && idxPos >= 20) {
        bull20 = idxC[idxPos] >= idxMa20[idxPos];
      }
      const sk = classifySetup(I, x, { marketUp: bull20 });
      const op = agg[sk];
      if (!op) continue;

      /* T+1：下一日开盘买入，HOLD_DAYS 日收盘卖出；上限不越界 */
      const buy = i + 1 < N ? o[i + 1] : NaN;
      if (!isNum(buy) || buy <= 0) continue;
      let valid = true;
      for (let h = 0; h < HOLD_DAYS.length; h++) {
        if (i + 1 + HOLD_DAYS[h] >= N) { valid = false; break; }
      }
      if (!valid) continue;

      op.count++;
      totalSignals++;
      const rg = bull20 ? op.reg.bull : op.reg.bear;
      rg.n++;
      for (let h = 0; h < HOLD_DAYS.length; h++) {
        const sell = c[i + 1 + HOLD_DAYS[h]];   /* 第 HOLD_DAYS[h] 日收盘 */
        const ret = sell / buy - 1 - COST;      /* 扣双边成本 */
        op.sumRet[h] += ret;
        if (ret > 0) op.win[h]++;
        rg.sum[h] += ret;
        if (ret > 0) rg.win[h]++;
      }

      /* 规则离场：跌破 3 日线（由上方跌破才算，避免首日就误判），或自买入价回撤 7%，最长持有 RULE_MAX 日 */
      let exitIdx = Math.min(i + 1 + RULE_MAX, N - 1);
      for (let k = i + 1; k <= Math.min(i + 1 + RULE_MAX, N - 1); k++) {
        const belowMa3 = k >= 3 && isNum(ma3[k]) && isNum(ma3[k - 1]) && c[k] < ma3[k] && c[k - 1] >= ma3[k - 1];
        if (belowMa3 || c[k] <= buy * (1 - RULE_STOP)) { exitIdx = k; break; }
      }
      const rret = c[exitIdx] / buy - 1 - COST;
      op.rN++;
      if (rret > 0) op.rWin++;
      op.rSum += rret;
      op.rHold += exitIdx - (i + 1);

      /* 主动止盈模拟：RULE_MAX 日内盘中最高价触及 +TP 即按止盈价卖出，否则最后一日收盘卖。
         回测结论（31,583 样本）：TP+8% 期望最优（bearGold 均收 +1.04% vs 持有5日 +0.67%），
         TP+2% 胜率虽达 74~80% 但均收≈0（赢小亏大陷阱）。 */
      const tpEnd = Math.min(i + 1 + RULE_MAX, N - 1);
      for (let t = 0; t < TP_LEVELS.length; t++) {
        const tp = TP_LEVELS[t];
        let tpRet = null;
        for (let k = i + 1; k <= tpEnd; k++) {
          if (bars[k].h >= buy * (1 + tp)) { tpRet = tp - COST; break; }
        }
        if (tpRet === null) tpRet = c[tpEnd] / buy - 1 - COST;
        op.tpN++;
        op.tpSum[t] += tpRet;
        if (tpRet > 0) op.tpWin[t]++;
      }

      if (!minDate || bars[i].d < minDate) minDate = bars[i].d;
      if (bars[i].d > maxDate) maxDate = bars[i].d;
    }
  }

  /* 聚合 → state.backtest */
  const result = {};
  for (const k of Object.keys(SHORT_SETUP)) {
    const op = agg[k];
    result[k] = {
      samples: op.count,
      wr2:   op.count >= 5 ? Math.round(op.win[0] / op.count * 100) : 0,
      wr3:   op.count >= 5 ? Math.round(op.win[1] / op.count * 100) : 0,
      wr5:   op.count >= 5 ? Math.round(op.win[2] / op.count * 100) : 0,
      avgRet2: op.count >= 5 ? +(op.sumRet[0] / op.count * 100).toFixed(2) : 0,
      avgRet3: op.count >= 5 ? +(op.sumRet[1] / op.count * 100).toFixed(2) : 0,
      avgRet5: op.count >= 5 ? +(op.sumRet[2] / op.count * 100).toFixed(2) : 0,
      /* 规则离场（贴近实盘的退出方式） */
      ruleSamples: op.rN,
      ruleWr: op.rN >= 5 ? Math.round(op.rWin / op.rN * 100) : 0,
      ruleAvg: op.rN >= 5 ? +(op.rSum / op.rN * 100).toFixed(2) : 0,
      ruleHold: op.rN >= 5 ? +(op.rHold / op.rN).toFixed(1) : 0,
      /* 主动止盈（TP+5% / TP+8%，盘中触及即卖，最长 10 日） */
      tpN: op.tpN,
      tp5Wr: op.tpN >= 5 ? Math.round(op.tpWin[0] / op.tpN * 100) : 0,
      tp5Avg: op.tpN >= 5 ? +(op.tpSum[0] / op.tpN * 100).toFixed(2) : 0,
      tp8Wr: op.tpN >= 5 ? Math.round(op.tpWin[1] / op.tpN * 100) : 0,
      tp8Avg: op.tpN >= 5 ? +(op.tpSum[1] / op.tpN * 100).toFixed(2) : 0,
      /* 牛/熊分池（wr、avg 按 2/3/5 日顺序） */
      reg: {
        bull: op.reg.bull.n >= 5 ? { n: op.reg.bull.n, wr: op.reg.bull.win.map((w, h) => +(w / op.reg.bull.n * 100).toFixed(1)), avg: op.reg.bull.sum.map(s => +(s / op.reg.bull.n * 100).toFixed(2)) } : null,
        bear: op.reg.bear.n >= 5 ? { n: op.reg.bear.n, wr: op.reg.bear.win.map((w, h) => +(w / op.reg.bear.n * 100).toFixed(1)), avg: op.reg.bear.sum.map(s => +(s / op.reg.bear.n * 100).toFixed(2)) } : null
      },
    };
  }
  state.backtest = result;
  state.backtestTs = Date.now();
  state.backtestStocks = list.length;
  state.backtestSignals = totalSignals;
  state.btRange = minDate && maxDate ? [minDate, maxDate] : null;
  try { localStorage.setItem('qr_backtest', JSON.stringify({ ts: state.backtestTs, stocks: state.backtestStocks, signals: totalSignals, cost: state.btCost, range: state.btRange, result })); } catch (e) {}
  return { ok: true, stocks: list.length, signals: totalSignals, result };
}

/* —— 长期持有策略回测 ——
   每 STEP 天调仓一次：按 scoreLong 对所有股票打分取前 TOPN 名，
   T+1 开盘买入，固定持有 HOLD 天收盘卖出，双边按 state.btCost 扣费。
   防未来函数：每只股票的 ind 与指数 bars 都只看截至当日。
   估值与行业排名中性化（pe=20/pb=3/mcap=500/secRank=0.5），
   只让技术面 + 相对强度 + 趋势稳定 + 量能资金部分生效。
   输出 3 条错开 lane 的组合资金曲线 + 逐年统计。 */
function runLongBacktest() {
  const list = Object.values(state.data).filter(x => x.bars && x.bars.length >= 260);
  const idx = state.indexes && state.indexes['sh000001'];
  const idxBars = idx && idx.bars ? idx.bars : null;
  if (!list.length || !idxBars) return { ok: false, reason: '暂无足够数据' };

  const COST = clamp(isNum(state.btCost) ? state.btCost : 0.3, 0, 3) / 100;
  const TOPN = 10, HOLD = 60, STEP = 20, START = 260;
  const N = idxBars.length;
  const minDate = idxBars[START] && idxBars[START].d, maxDate = idxBars[N - 1] && idxBars[N - 1].d;

  const codes = list.map(x => x.code);
  /* 先给每只股票建日期 -> 在 bars 中的位置（应对个股停牌/上市时间差异）*/
  const datePos = {};
  for (const x of list) {
    const m = {}; x.bars.forEach((b, i) => m[b.d] = i); datePos[x.code] = m;
  }

  const trades = [];
  const tranches = [];
  const yearly = {};

  for (let i = START; i + HOLD + 1 < N; i += STEP) {
    const day = idxBars[i].d;
    /* 指数 bars 截断到当日 —— scoreLong 内部算 mktRet60 会读 state.indexes */
    state.indexes = { sh000001: { bars: idxBars.slice(0, i + 1) } };

    const scored = [];
    const candidates = [];
    for (const x of list) {
      const j = datePos[x.code] && datePos[x.code][day];
      if (j == null || j < 250) continue;
      if (j + 1 + HOLD >= x.bars.length) continue;
      candidates.push({ x, j });
    }
    if (candidates.length < TOPN * 3) continue;

    /* 为每个候选算 ind（只看 bars[0..j]），同时收集横截面数组 */
    const ctx = { ret60: [], ret120: [], r2: [], mdd: [], vol: [], secRank: {}, secUp: {} };
    for (const c of candidates) {
      const bars = c.x.bars.slice(0, c.j + 1);
      const I = analyze(bars);
      c.I = I;
      ctx.ret60.push(I.ret60);
      ctx.ret120.push(I.ret120);
      ctx.r2.push(I.r2);
      ctx.mdd.push(I.mdd);
      ctx.vol.push(I.volAnn);
    }

    for (const c of candidates) {
      /* 估值 + 行业排名全部中性化，防未来函数 */
      const fakeX = { ind: c.I, sector: c.x.sector, pe: 20, pb: 3, mcap: 500 };
      const s = scoreLong(fakeX, ctx);
      c.score = s.score;
    }
    candidates.sort((a, b) => b.score - a.score);
    const picks = candidates.slice(0, TOPN);

    let sum = 0, win = 0, n = 0;
    for (const p of picks) {
      const bars = p.x.bars;
      const buy = bars[p.j + 1].o;
      const sell = bars[p.j + 1 + HOLD].c;
      if (!(buy > 0) || !(sell > 0)) continue;
      const r = sell / buy - 1 - COST;
      const year = +day.slice(0, 4);
      if (!yearly[year]) yearly[year] = { n: 0, win: 0, sum: 0 };
      yearly[year].n++; yearly[year].sum += r; if (r > 0) yearly[year].win++;
      trades.push({ d: day, code: p.x.code, r });
      sum += r; n++;
    }
    if (n) tranches.push({ d: day, r: sum / n, n });
  }

  if (!tranches.length) return { ok: false, reason: '长期回测信号不足（至少需 80 天以上日线）' };

  /* 三条错开 lane（间隔 STEP 天，总持仓 = 3 × TOPN）*/
  const lanes = [[], [], []];
  tranches.forEach((t, k) => lanes[k % 3].push(t));

  let best = -Infinity, worst = Infinity, peak = 100;
  const eqByLane = lanes.map(L => {
    let eq = 100, maxDd = 0;
    for (const t of L) {
      eq *= 1 + t.r;
      if (eq > peak) peak = eq;
      const dd = (peak - eq) / peak;
      if (dd > maxDd) maxDd = dd;
    }
    return eq;
  });
  const startEq = 100, finalEq = eqByLane.reduce((a, b) => a + b, 0) / eqByLane.length;
  const years = (idxBars[N - 1].d.slice(0, 4) - idxBars[START].d.slice(0, 4)) + ((idxBars[N - 1].d.slice(5) >= idxBars[START].d.slice(5)) ? 0 : -1) + 1;
  const cagr = Math.pow(finalEq / startEq, 1 / Math.max(years, 1)) - 1;

  const allRs = trades.map(t => t.r);
  const idxC = idxBars.map(b => b.c);
  const idxRet = idxC[N - 1] / idxC[START] - 1;

  const out = {
    ok: true,
    range: [minDate, maxDate],
    topN: TOPN, hold: HOLD, step: STEP, cost: COST * 100,
    trades: trades.length, tranches: tranches.length,
    summary: {
      wr: +(trades.filter(t => t.r > 0).length / trades.length * 100).toFixed(1),
      avg: +(allRs.reduce((a, b) => a + b, 0) / allRs.length * 100).toFixed(2),
      best: +(Math.max(...allRs) * 100).toFixed(1),
      worst: +(Math.min(...allRs) * 100).toFixed(1),
      cagr: +(cagr * 100).toFixed(2),
      idxRet: +(idxRet * 100).toFixed(1),
      excess: +((cagr - idxRet / Math.max(years, 1)) * 100).toFixed(2),
      finalEquity: +finalEq.toFixed(1),
    },
    yearly: {},
  };
  for (const y of Object.keys(yearly).sort()) {
    const v = yearly[y];
    out.yearly[y] = { samples: v.n, wr: +(v.win / v.n * 100).toFixed(1), avg: +(v.sum / v.n * 100).toFixed(2) };
  }

  state.longBacktest = out;
  state.longBtTs = Date.now();
  try { localStorage.setItem('qr_long_backtest', JSON.stringify({ ts: state.longBtTs, cost: state.btCost, topN: TOPN, hold: HOLD, step: STEP, range: [minDate, maxDate], result: out })); } catch (e) {}
  return out;
}

function loadLongBacktest() {
  try {
    const raw = localStorage.getItem('qr_long_backtest');
    if (!raw) return false;
    const p = JSON.parse(raw);
    if (p && p.result && (Date.now() - p.ts) < 86400000) {
      state.longBacktest = p.result;
      state.longBtTs = p.ts;
      return true;
    }
  } catch (e) {}
  return false;
}

function loadBacktest() {
  try {
    const raw = localStorage.getItem('qr_backtest');
    if (!raw) return false;
    const p = JSON.parse(raw);
    if (p && p.result && (Date.now() - p.ts) < 86400000) {
      state.backtest = p.result;
      state.backtestTs = p.ts;
      state.backtestStocks = p.stocks;
      state.backtestSignals = p.signals;
      if (isNum(p.cost)) state.btCost = p.cost;
      if (p.range && p.range.length === 2) state.btRange = p.range;
      return true;
    }
  } catch (e) {}
  return false;
}
